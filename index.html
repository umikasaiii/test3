      { h: 'I tre tempi', b: '- **Past simple**: eventi in sequenza. {{en-GB|He opened the door and walked in.}}\n- **Past continuous** (was/were + -ing): sfondo, azione in corso quando succede altro. {{en-GB|It was raining when we left.}}\n- **Past perfect** (had + participio): evento precedente a un altro passato. {{en-GB|When I arrived, the film had already started.}}\n\nUna storia ben fatta alterna: sfondo (continuous), eventi (simple), antefatti (perfect).' },
      { h: 'Simple + continuous', b: 'Azione lunga interrotta da un evento breve:\n> {{en-GB|I was cooking when the phone rang.}}\n\nDue azioni simultanee in corso: {{en-GB|She was reading while he was cooking.}}\n\nUna sequenza di eventi completati: {{en-GB|I got up, had a shower and left.}}\n\nSe usi past simple per due eventi vicini, la sequenza è temporale: {{en-GB|When I opened the door, the dog ran out.}} (prima apro, poi corre).' },
      { h: 'Past perfect e abitudini passate', b: 'Past perfect per l’**anteriorità**:\n> {{en-GB|I couldn’t get in because I had lost my key.}}\n> {{en-GB|By the time we arrived, they had left.}}\n\n**Used to** per abitudini o stati passati che non esistono più: {{en-GB|I used to play the piano.}} / {{en-GB|We used to live in Rome.}} (domanda: *Did you use to…?*)\n\n**Would** per abitudini ripetute (non per stati): {{en-GB|Every summer we would go to the sea.}} Non si dice *I would live in Rome*.' },
      { h: 'Esempio guidato', b: 'Racconta: *ieri sera / cena / mio fratello arrivare / io cucinare da due ore.*\n\n→ **Last night I was cooking dinner. I had been cooking for two hours when my brother arrived.** (had been cooking: past perfect continuous per durata prima di un evento)\n\nVersione più semplice, sempre corretta: **Last night I was cooking when my brother arrived. I had started at six.**\n\nControllo: stabilisci la linea del tempo; l’azione più antica prende il past perfect, lo sfondo il continuous, gli eventi il simple.' },
      { h: 'Errori comuni', b: '- *When I arrived, the film started* (se era già iniziato) → {{en-GB|had started.}}\n- *I was knowing him* → {{en-GB|I knew him.}} (verbo di stato)\n- *I used to went* → {{en-GB|I used to go.}}\n- *I would be a shy child* (stato) → {{en-GB|I used to be a shy child.}}\n- Usare past perfect per **ogni** passato: serve solo per anteriorità.' },
      { h: 'Riepilogo', b: '- Simple = eventi; continuous = sfondo/azione in corso; perfect = prima di.\n- Used to = abitudine/stato passato; would = solo azioni ripetute.\n- Connettori: when, while, as, by the time, after, before, as soon as.' }
    ],
    exercises: [
      mc('I ___ dinner when the phone rang.', ['cooked', 'was cooking', 'had cooked', 'cook'], 1),

      mc('We ___ live in Rome when I was a child.', ['would', 'used to', 'use to', 'were used'], 1, 'Stato passato → used to.'),
      mc('Every summer we ___ to the sea.', ['would go', 'used to be going', 'were go', 'have gone'], 0, 'Azione ripetuta: would.'),

      fill('Complete: She ___ (walk) in the park when it started to rain.', ['was walking'], 'Azione in corso interrotta.'),

    cards: [

      card('c5', 'accadere', 'to happen', 'What happened?'), card('c6', 'fortunatamente', 'luckily', 'Luckily, nobody was hurt.'), card('c7', 'improvvisamente', 'suddenly', 'Suddenly the lights went out.'), card('c8', 'alla fine', 'in the end', 'In the end, we found it.')

      { h: 'Suoni: le differenze principali', b: '**Rotico / non rotico**: l’americano pronuncia la /r/ dopo la vocale ({{en-US|car, hard, water}}); il britannico standard e l’australiano di solito no ({{en-GB|car}} → «cah»).\n\n**T intervocalica**: l’americano «flappa» la /t/ in /ɾ/ quasi /d/: {{en-US|water, better, city}}. Il britannico mantiene una /t/ più netta; nel parlato informale può diventare glottal stop ({{en-GB|bottle}}).\n\n**Vocale di *bath*, *dance*, *can’t***: britannico /ɑː/ (bahth), americano /æ/ (bæth).\n\n**Australiano**: vocali tipicamente più «spostate»: *mate* ≈ «maite», *day* ≈ «dai»; intonazione spesso ascendente a fine frase; molte abbreviazioni: *arvo* (afternoon), *brekkie* (breakfast).' },
      { h: 'Lessico e ortografia', b: 'Britannico → americano:\n- flat → apartment\n- lift → elevator\n- lorry → truck\n- autumn → fall\n- holiday → vacation\n- biscuit → cookie\n- petrol → gas(oline)\n- pavement → sidewalk\n\nAustraliano: *ute* (pick-up), *servo* (distributore), *thongs* (infradito), *no worries* (prego, non c’è problema).\n\nOrtografia: colour/color, centre/center, organise/organize, travelling/traveling.' },
      { h: 'Come allenare l’orecchio', b: '1. Scegli **tre fonti** costanti, una per accento (es. un podcast, un canale video, un notiziario).\n2. Ascolta ogni settimana 10 minuti per fonte, **senza sottotitoli** nella prima passata.\n3. Annota **due tratti** ricorrenti per fonte (es. flap, rising intonation).\n4. Usa lo shadowing su brevi frammenti per interiorizzare il ritmo.\n5. Ritorna a materiali già ascoltati dopo alcuni giorni: la ripetizione consolida.\n\nNon mescolare l’**output**: quando parli, resta coerente (es. «lift» e «holiday» insieme a «color» sono incoerenti, ma non sono errori gravi).' },
      { h: 'Esempio guidato', b: 'Tre persone dicono «I can’t park here»:\n\n- {{en-GB|I can’t park here.}} — /kɑːnt/, /r/ non pronunciata in «park» → «pahk».\n- {{en-US|I can’t park here.}} — /kænt/, /r/ pronunciata → «parrk».\n- {{en-AU|I can’t park here.}} — vocale di «can’t» lunga, /r/ assente, «here» più chiuso.\n\nControllo: riascolta le tre versioni e prova a descrivere in una frase quale tratto hai notato per ciascuna.' },
      { h: 'Errori comuni', b: '- Pensare che un accento sia «sbagliato»: sono varietà legittime.\n- Rinunciare a un audio perché «non è l’accento che conosco»: allena proprio quello.\n- Imitare un accento senza padroneggiarne i tratti: scegli un modello e resta coerente.\n- Ignorare il lessico: capire «lorry» o «fall» evita incomprensioni.' },
      { h: 'Riepilogo', b: '- /r/ rotica: americano sì, britannico e australiano no.\n- T tra vocali: flap in americano.\n- bath/dance: /ɑː/ britannico, /æ/ americano.\n- Australiano: vocali spostate, intonazione ascendente, abbreviazioni.\n- Allena tre fonti, senza sottotitoli, e usa lo shadowing.' }

  C.addTopic({

    pages: [
      { h: 'Obiettivo', b: 'Per discutere ciò che **non è successo** (e come sarebbe andata) serve un set di strutture: terzo condizionale, condizionali misti, wish. Sono tipici del B2 e compaiono in conversazioni su scelte e rimpianti.' },
      { h: 'Terzo condizionale', b: 'Ipotesi sul passato che non si è realizzata.\n\n**If + past perfect, would have + participio**\n> {{en-GB|If I had studied harder, I would have passed.}}\n> {{en-GB|She wouldn’t have missed the bus if she had left earlier.}}\n\nSignifica: non ho studiato abbastanza e non ho passato. Il passato qui è **irreale**: è la distanza di due livelli (past perfect) per sottolineare che non si può cambiare.' },
      { h: 'Condizionali misti', b: 'Mescolano passato e presente.\n\n**Causa passata → effetto presente**: if + past perfect, would + base\n> {{en-GB|If I had taken that job, I would be richer now.}}\n\n**Condizione presente → effetto passato**: if + past simple, would have + participio\n> {{en-GB|If I weren’t so shy, I would have asked her out.}}\n\nControlla la linea del tempo di ciascuna metà della frase, non della frase intera.' },
      { h: 'Wish, if only, should have', b: '- **wish + past simple**: rimpianto sul presente. {{en-GB|I wish I knew the answer.}} / {{en-GB|I wish I were taller.}}\n- **wish + past perfect**: rimpianto sul passato. {{en-GB|I wish I had listened.}}\n- **wish + would**: lamentela su un comportamento altrui. {{en-GB|I wish you would stop that.}}\n- **if only**: più enfatico di wish. {{en-GB|If only I had more time!}}\n- **should have + participio**: critica o rimpianto. {{en-GB|I should have called her.}} / {{en-GB|You shouldn’t have said that.}}' },
      { h: 'Esempio guidato', b: 'Fatti: *Non ho preso l’ombrello. Mi sono bagnato.*\n\n- Terzo condizionale: **If I had taken an umbrella, I wouldn’t have got wet.**\n- Wish: **I wish I had taken an umbrella.**\n- Should have: **I should have taken an umbrella.**\n\nMisto: *Sono raffreddato ora perché mi sono bagnato ieri* → **If I hadn’t got wet yesterday, I wouldn’t have a cold now.**\n\nControllo: parti dai fatti reali, poi nega mentalmente ciascuno.' },
      { h: 'Errori comuni', b: '- *If I would have known, I would have come.* → {{en-GB|If I had known, I would have come.}}\n- *I wish I would have more time.* → {{en-GB|I wish I had more time.}}\n- *If I had known, I would come* (voleva dire passato) → {{en-GB|I would have come.}}\n- *I should have went* → {{en-GB|I should have gone.}}\n- Dimenticare have: *I would passed.* → {{en-GB|I would have passed.}}' },
      { h: 'Riepilogo', b: '- Third: if + past perfect, would have + participio.\n- Mixed: guarda la linea del tempo di ciascuna metà.\n- wish + past (presente), wish + past perfect (passato), wish + would (lamentela).\n- should have per rimpianti/critiche.' }
    ],
    exercises: [
      mc('If I ___ harder, I would have passed.', ['studied', 'had studied', 'would study', 'have studied'], 1),
      fill('Complete: She wouldn’t have missed the bus if she ___ (leave) earlier.', ['had left'], 'Past perfect nella if-clause.'),
      mc('I wish I ___ the answer now.', ['knew', 'know', 'had known', 'would know'], 0, 'Presente irreale: wish + past simple.'),
      mc('I wish I ___ to her yesterday.', ['talked', 'had talked', 'would talk', 'talk'], 1, 'Passato: past perfect.'),
      mc('You ___ said that. It was rude.', ['shouldn’t have', 'mustn’t', 'shouldn’t', 'couldn’t to'], 0),
      mc('If I hadn’t eaten so much, I ___ so sick now.', ['wouldn’t be', 'wouldn’t have been', 'won’t be', 'wasn’t'], 0, 'Misto: causa passata, effetto presente.'),
      order('Metti in ordine', ['If', 'only', 'I', 'had', 'more', 'time'], 'If only + past simple per rimpianto presente.')
    ],
    test: [
      mc('Which sentence is a third conditional?', ['If I see her, I’ll tell her.', 'If I saw her, I would tell her.', 'If I had seen her, I would have told her.', 'If I see her, I told her.'], 2),
      mc('«I wish I had saved more money» refers to…', ['the present', 'the past', 'the future', 'a habit'], 1),
      fill('Complete: If I ___ (know), I would have helped.', ['had known'], 'Third conditional.'),
      mc('Which is correct?', ['If I would have known, I would have come.', 'If I had known, I would have come.', 'If I knew, I would have come.', 'If I had know, I would come.'], 1)
    ],
    cards: [
      card('c1', 'rimpianto', 'regret', 'I have no regrets.'), card('c2', 'sarebbe dovuto', 'should have', 'I should have called.'), card('c3', 'se solo', 'if only', 'If only I had more time!'), card('c4', 'sbagliare/perdere', 'to miss', 'I missed the train.'),
      card('c5', 'ripensare', 'to rethink', 'I need to rethink this.'), card('c6', 'bagnato', 'wet', 'I got wet in the rain.'), card('c7', 'scelta', 'choice', 'It was a difficult choice.'), card('c8', 'conseguenza', 'consequence', 'That has consequences.')
    ],
    listening: [{ id: 'l1', lang: 'en-US', title: 'A missed chance', text: 'If I had applied for that job, I would be working in Berlin now. Honestly, I wish I had taken the chance. I was afraid, and I should have listened to my sister. She told me I would regret it. If only I could go back, I would send the application without a second thought.',
      qs: [{ q: 'Did the speaker apply for the job?', o: ['Yes', 'No', 'Not sure', 'He applied twice'], a: 1, kind: 'implicit' }, { q: 'Who gave advice?', o: ['His boss', 'His sister', 'A friend', 'His father'], a: 1, kind: 'explicit' }, { q: 'How does the speaker feel now?', o: ['Proud', 'Regretful', 'Neutral', 'Angry at his sister'], a: 1, kind: 'implicit' }] }],

  C.addTopic({
    id: 'eng-l4-collocations', subject: 'eng', stage: 'L4', title: 'Collocazioni e phrasal verbs ad alta frequenza', minutes: 20, prereq: ['eng-l4-hypothetical'],
    summary: 'Le combinazioni di parole naturali e i phrasal verbs più utili.',
    objectives: ['Usare collocazioni verbo+nome e aggettivo+nome', 'Capire i phrasal verbs più frequenti', 'Imparare il lessico in blocchi, non parole isolate'],
    pages: [
      { h: 'Obiettivo', b: 'Parlare in modo naturale significa scegliere le parole che **vanno insieme**. Si dice *make a decision* e *do homework*, non il contrario. Imparerai collocazioni e phrasal verbs come **blocchi** da recuperare interi.' },
      { h: 'Collocazioni: make, do, take, have', b: '**make**: a decision, a mistake, an effort, progress, money, a suggestion, a phone call\n**do**: homework, the dishes, research, business, your best, someone a favour\n**take**: a break, a photo, a risk, part in, place, advantage of\n**have**: a look, a chat, a shower, fun, an argument, a problem\n\n{{en-GB|I need to make a decision.}} / {{en-GB|Let’s take a break.}} / {{en-GB|Can you do me a favour?}}\n\nCollocazioni con aggettivi: *heavy rain, strong coffee, deep sleep, fast food, bitter disappointment.* Non si dice *strong rain* né *heavy coffee*.' },
      { h: 'Phrasal verbs', b: 'Verbo + particella: spesso il significato non si deduce dalle parti.\n\n- **give up** (smettere) · **carry on** (continuare) · **find out** (scoprire)\n- **look after** (accudire) · **look for** (cercare) · **look forward to** (non vedere l’ora, + -ing)\n- **turn down** (rifiutare) · **put off** (rimandare) · **come up with** (inventare)\n- **get along with** (andare d’accordo) · **run out of** (finire) · **take off** (decollare; togliere)\n\nSeparabili: {{en-GB|Turn the offer down. / Turn down the offer.}} Con pronome: **sempre separato**: {{en-GB|Turn it down.}} Non separabili: {{en-GB|Look after the kids.}} → *look them after* è sbagliato; si dice {{en-GB|look after them.}}' },
      { h: 'Come impararli', b: '1. Studia **blocchi interi**, non parole singole: *make a decision*, non solo *decision*.\n2. Usa carte con la frase, non solo la traduzione.\n3. Crea una frase **tua** per ogni blocco.\n4. Ripassa dopo 1, 3, 7, 14, 30 giorni (le carte lo fanno per te).\n5. Quando ascolti, nota le collocazioni ricorrenti.\n\nNon imparare cento phrasal verbs di colpo: sceglierne pochi, ma usarli davvero.' },
      { h: 'Esempio guidato', b: 'Completa: *I’ve ____ a lot of progress, but I can’t ____ up with a good plan. I’ll ____ a break and ____ it over later.*\n\n- **made** a lot of progress (make progress)\n- **come** up with a plan\n- **take** a break\n- **think** it over (riflettere)\n\nControllo: ciascuna parola va con quella accanto? Se hai dubbi, cerca la collocazione in un corpus o dizionario.' },
      { h: 'Errori comuni', b: '- *do a mistake* → {{en-GB|make a mistake.}}\n- *make a photo* → {{en-GB|take a photo.}}\n- *look forward to see you* → {{en-GB|look forward to seeing you.}}\n- *I’ll look after it them* → {{en-GB|I’ll look after them.}}\n- *strong rain / heavy tea* → {{en-GB|heavy rain, strong tea.}}' },
      { h: 'Riepilogo', b: '- make = creare/produrre; do = attività generiche/doveri.\n- Collocazioni di aggettivi vanno imparate come blocchi.\n- Phrasal verbs: pochi, utili, in frasi tue.\n- look forward to + -ing; pronome tra verbo e particella nei separabili.' }
    ],
    exercises: [
      mc('Please ___ a decision before Friday.', ['do', 'make', 'take', 'have'], 1),
      mc('Let’s ___ a break; I’m tired.', ['make', 'do', 'take', 'give'], 2),
      mc('Which is correct?', ['strong rain', 'heavy rain', 'deep rain', 'big rain'], 1),
      mc('«I’m looking forward to ___ you.»', ['see', 'seeing', 'saw', 'be seen'], 1),
      mc('She ___ up smoking last year.', ['gave', 'put', 'took', 'came'], 0),
      mc('«Turn down the offer» — which sentence is correct?', ['Turn down it.', 'Turn it down.', 'Turn down it the.', 'Down turn it.'], 1),
      fill('Complete: We have run ___ of milk.', ['out'], 'run out of = finire.')
    ],
    test: [
      mc('Which collocation is correct?', ['do a mistake', 'make a mistake', 'take a mistake', 'have a mistake'], 1),
      mc('I can’t ___ with a better idea.', ['come up', 'make up', 'put up', 'get over'], 0),
      mc('Which phrasal verb means «to postpone»?', ['put off', 'put on', 'put up', 'put out'], 0),
      mc('How do you say «accudire i bambini»?', ['look for the kids', 'look after the kids', 'look at the kids', 'look up the kids'], 1)
    ],
    cards: [
      card('c1', 'prendere una decisione', 'to make a decision', 'I need to make a decision.'), card('c2', 'fare una pausa', 'to take a break', 'Let’s take a break.'), card('c3', 'rimandare', 'to put off', 'Don’t put it off.'), card('c4', 'inventare/trovare (idea)', 'to come up with', 'She came up with a plan.'),
      card('c5', 'scoprire', 'to find out', 'I found out the truth.'), card('c6', 'andare d’accordo', 'to get along with', 'I get along with him.'), card('c7', 'rifiutare', 'to turn down', 'They turned down the offer.'), card('c8', 'non vedere l’ora', 'to look forward to', 'I look forward to meeting you.')
    ],
    listening: [{ id: 'l1', lang: 'en-GB', title: 'Planning a trip', text: 'We’ve been putting off this trip for ages, but we’ve finally made a decision. We’re going to take a few days off and travel to Scotland. I’m really looking forward to it. We’ve come up with a rough plan, though we’ll find out more details next week. If we run out of money, we’ll just give up the hotel and camp.',
      qs: [{ q: 'What decision have they made?', o: ['To go to Scotland', 'To stay home', 'To sell the car', 'To cancel the trip'], a: 0, kind: 'explicit' }, { q: 'What will they do if they run out of money?', o: ['Return home', 'Give up the hotel and camp', 'Borrow money', 'Stay with friends'], a: 1, kind: 'explicit' }, { q: 'How does the speaker feel?', o: ['Excited', 'Worried', 'Angry', 'Bored'], a: 0, kind: 'implicit' }] }],
    dictation: [{ text: 'We’ve finally made a decision.', lang: 'en-GB' }, { text: 'She came up with a great idea.', lang: 'en-US' }, { text: 'I’m looking forward to meeting you.', lang: 'en-AU' }],
    shadowing: [{ text: 'We’ve been putting off this trip for ages.', lang: 'en-GB', tip: 'Linking: «putting off» → «puttinoff».' }, { text: 'I’m really looking forward to it.', lang: 'en-US', tip: 'Stress su really, forward.' }, { text: 'Let’s take a break and think it over.', lang: 'en-AU', tip: 'Think it over: legami.' }],
    speaking: [{ prompt: 'Describe a plan you have put off for a long time and what you will do about it, using three collocations.', model: 'I’ve been putting off a visit to the dentist. I need to make an appointment and take a day off work. I’ll do my best to go next week.' }, { prompt: 'Explain what you do when you run out of ideas at work or at home.', model: 'I take a break, go for a walk, and then try to come up with a new idea. If that doesn’t work, I talk to a friend.' }]
  });

  C.addTopic({
    id: 'eng-l5-register', subject: 'eng', stage: 'L5', title: 'Registro, cortesia e sfumature', minutes: 20, prereq: ['eng-l4-collocations'],
    summary: 'Formale/informale, hedging, cortesia indiretta e toni.',
    objectives: ['Adattare il registro alla situazione', 'Usare hedging per attenuare affermazioni', 'Formulare richieste cortesi e commenti diplomatici'],
    pages: [
      { h: 'Obiettivo', b: 'Una frase corretta può suonare brusca, troppo informale o troppo rigida. A livello B2+ il tuo inglese deve **adattarsi al contesto**: email di lavoro, amici, clienti, riunioni.' },
      { h: 'Formale, neutro, informale', b: 'Informale → neutro → formale:\n- Can you…? → Could you…? → Would you be able to…?\n- I wanna… → I’d like to… → I would like to…\n- Sorry about that → I apologise → Please accept my apologies\n- Thanks → Thank you → Thank you very much for…\n- Get back to me → Let me know → Please reply at your earliest convenience\n\nNel formale: niente contrazioni nei testi scritti, verbi più lunghi (*obtain* vs *get*), frasi complete. Nell’informale: contrazioni, phrasal verbs, frasi brevi.' },
      { h: 'Cortesia indiretta', b: 'Le richieste dirette suonano brusche. Rendile indirette:\n\n- {{en-GB|Close the window.}} → {{en-GB|Could you close the window, please?}} → {{en-GB|Would you mind closing the window?}}\n- {{en-GB|I want a coffee.}} → {{en-GB|I’d like a coffee.}} → {{en-GB|I was wondering if I could have a coffee.}}\n\nPiù la richiesta è importante o il rapporto formale, più la frase si allunga e passa al condizionale (**could, would, might**). Funziona anche per rifiuti: {{en-GB|I’m afraid I can’t make it.}}' },
      { h: 'Hedging', b: 'Il **hedging** attenua l’affermazione per essere accurati o diplomatici:\n\n- verbi: *seem, appear, tend to, suggest* — {{en-GB|The data seems to suggest that…}}\n- avverbi: *probably, possibly, fairly, relatively, generally*\n- modali: *may, might, could*\n- espressioni: *to some extent, in most cases, it appears that*\n\n> {{en-GB|Remote work may improve productivity in some cases.}}\n\nNon è debolezza: è precisione. Nel B2/C1 scritto e orale è un segnale di competenza.' },
      { h: 'Esempio guidato', b: 'Riscrivi in tre registri: *«Send me the file now.»*\n\n- **Informale**: *Can you send me the file? Thanks!*\n- **Neutro**: *Could you send me the file, please?*\n- **Formale**: *I would be grateful if you could send me the file at your earliest convenience.*\n\nControllo: ogni versione cambia lunghezza, verbo e tono. Chiediti chi leggerà o ascolterà e quanto è formale il rapporto.' },
      { h: 'Errori comuni', b: '- Tradurre dal tono italiano: *Give me…* può sembrare un ordine.\n- Usare contrazioni e slang in una email a un cliente.\n- Esagerare con la formalità tra colleghi alla pari: sembra freddo.\n- *Please to confirm* → {{en-GB|Please confirm.}}\n- Mischiare registri nella stessa frase.' },
      { h: 'Riepilogo', b: '- Adatta registro a persona e situazione.\n- Richieste: can → could → would you mind.\n- Hedging per precisione e diplomazia.\n- Formale: frasi complete, no contrazioni scritte; informale: contrazioni e phrasal verbs.' }
    ],
    exercises: [
      mc('Which request is the most polite?', ['Give me the report.', 'Could you give me the report?', 'Would you mind giving me the report, please?', 'I want the report.'], 2),
      mc('Which is the most formal?', ['Get back to me', 'Let me know', 'Please reply at your earliest convenience', 'Drop me a line'], 2),
      mc('«The data seems to suggest…» is an example of…', ['Hedging', 'Slang', 'Exaggeration', 'Command'], 0),
      mc('Which phrase is suitable for an email to a client?', ['Hey, thanks!', 'I wanna ask you something', 'I would like to enquire about…', 'Gimme the info'], 2),
      mc('A polite way to refuse an invitation:', ['No.', 'I’m afraid I can’t make it.', 'Never.', 'I don’t want.'], 1),
      fill('Complete: I was ___ if I could borrow your pen.', ['wondering'], 'Formula cortese.'),
      mc('Which sounds more tentative?', ['It is wrong.', 'It may be slightly inaccurate.', 'It’s definitely wrong.', 'Wrong.'], 1)
    ],
    test: [
      mc('«Would you mind closing the window?» is…', ['formal-polite', 'rude', 'slang', 'an order'], 0),
      mc('Which verb is a typical hedge?', ['prove', 'tend', 'insist', 'order'], 1),
      mc('Which contraction use is most suitable in a formal letter?', ['I’m writing to apply.', 'I am writing to apply.', 'Im writing to apply.', 'I writing to apply.'], 1),
      mc('A natural way to ask a colleague for help is…', ['Help me now.', 'Could you give me a hand?', 'I demand help.', 'You must help.'], 1)
    ],
    cards: [
      card('c1', 'ti dispiace…?', 'would you mind…?', 'Would you mind waiting?'), card('c2', 'temo di', 'I’m afraid', 'I’m afraid I can’t.'), card('c3', 'tendere a', 'to tend to', 'People tend to forget.'), card('c4', 'a vostro comodo', 'at your earliest convenience', 'Reply at your earliest convenience.'),
      card('c5', 'scusarsi (formale)', 'to apologise', 'I apologise for the delay.'), card('c6', 'richiedere informazioni', 'to enquire', 'I’m writing to enquire about prices.'), card('c7', 'diplomatico', 'tactful', 'She is very tactful.'), card('c8', 'dare una mano', 'to give someone a hand', 'Can you give me a hand?')
    ],
    listening: [{ id: 'l1', lang: 'en-GB', title: 'Two ways to ask', text: 'Version one: Hey, can you send me that file? Thanks! Version two: Good morning, Ms Patel. I was wondering whether you might be able to send me the file when you have a moment. I would be very grateful.',
      qs: [{ q: 'Which version is more formal?', o: ['Version one', 'Version two', 'Both equally', 'Neither'], a: 1, kind: 'explicit' }, { q: 'Which phrase makes the request more tentative?', o: ['Can you', 'I was wondering whether you might be able to', 'Thanks', 'Hey'], a: 1, kind: 'explicit' }, { q: 'Who is probably the listener in version two?', o: ['A close friend', 'A colleague or client the speaker respects', 'A family member', 'A child'], a: 1, kind: 'implicit' }] }],
    dictation: [{ text: 'I was wondering whether you might be able to help.', lang: 'en-GB' }, { text: 'I would be very grateful for your reply.', lang: 'en-US' }, { text: 'I’m afraid I can’t make it on Friday.', lang: 'en-AU' }],
    shadowing: [{ text: 'Would you mind closing the window, please?', lang: 'en-GB', tip: 'Intonazione ascendente cortese.' }, { text: 'The data seems to suggest a slight improvement.', lang: 'en-US', tip: 'Ritmo professionale, stress su data, suggest, slight.' }, { text: 'I’m afraid I won’t be able to attend.', lang: 'en-AU', tip: 'Toni bassi per rifiuto cortese.' }],
    speaking: [{ prompt: 'Role-play: ask your manager politely for a day off next Friday. Give a reason.', model: 'Good morning. I was wondering whether I could take next Friday off. I have a family event, and I’d be happy to finish my urgent tasks beforehand.' }, { prompt: 'Rephrase this bluntly stated opinion in a more diplomatic way: «Your plan is bad.»', model: 'I’m not sure the plan fully addresses the problem. It might be worth considering a few alternatives.' }]
  });

  C.addTopic({
    id: 'eng-l5-emphasis', subject: 'eng', stage: 'L5', title: 'Enfasi, inversione e frasi scisse', minutes: 20, prereq: ['eng-l5-register'],
    summary: 'Cleft sentences, inversione dopo avverbi negativi e altri mezzi per mettere in risalto.',
    objectives: ['Usare cleft sentences (It was… that / What I need is…)', 'Riconoscere l’inversione dopo never, rarely, not only', 'Variare l’enfasi nella lingua parlata e scritta'],
    pages: [
      { h: 'Obiettivo', b: 'Quando vuoi dire «questa cosa, e non un’altra», l’inglese riordina la frase invece di usare soltanto l’intonazione. Imparerai **cleft sentences** e **inversione**: strutture che compaiono spesso nel parlato colto e nello scritto.' },
      { h: 'Cleft sentences', b: 'Mettono in risalto un elemento.\n\n- **It + be + elemento + that/who…**\n> {{en-GB|It was Anna who called me.}}\n> {{en-GB|It’s the noise that bothers me.}}\n\n- **What + frase + be + elemento**\n> {{en-GB|What I need is a holiday.}}\n> {{en-GB|What annoys me is the delay.}}\n\n- **All / The thing / The reason** + be:\n> {{en-GB|All I want is some peace.}}\n> {{en-GB|The reason I called is to ask a favour.}}' },
      { h: 'Inversione', b: 'Dopo avverbi negativi o restrittivi in prima posizione, l’ausiliare precede il soggetto:\n\n- **never / rarely / seldom**: {{en-GB|Never have I seen such a mess.}}\n- **not only … but also**: {{en-GB|Not only did she win, but she also broke the record.}}\n- **no sooner … than**: {{en-GB|No sooner had we arrived than it started to rain.}}\n- **hardly … when**: {{en-GB|Hardly had he left when the phone rang.}}\n- **only after / only when**: {{en-GB|Only then did I understand.}}\n\nCon i verbi senza ausiliare compare do/does/did: *Not only **did** she win.*\n\nÈ una struttura **formale o enfatica**: non è necessario nel parlato quotidiano, ma devi riconoscerla.' },
      { h: 'Altri mezzi di enfasi', b: '- **Ausiliare enfatico**: {{en-GB|I DO like it!}} / {{en-GB|She did tell me.}}\n- **Intensificatori**: absolutely, totally, utterly, extremely; con aggettivi estremi: *exhausted* (non *very exhausted*).\n- **Ripetizione**: {{en-GB|It was a long, long day.}}\n- **Intonazione e stress**: {{en-GB|I didn’t say HE stole it.}} — il significato cambia con lo stress.\n\nAttenzione ai **gradable / non-gradable adjectives**: *very tired* ma *absolutely exhausted*.' },
      { h: 'Esempio guidato', b: 'Frase base: *I need a holiday.* Rendila enfatica in tre modi:\n\n- Cleft: **What I need is a holiday.**\n- Inversione (frase simile): **Never have I needed a holiday more.**\n- Ausiliare: **I do need a holiday!**\n\nControllo: leggi ad alta voce e senti come cambia il peso della frase. Usale con moderazione: troppa enfasi stanca chi ascolta.' },
      { h: 'Errori comuni', b: '- *Never I have seen…* → {{en-GB|Never have I seen…}}\n- *Not only she won…* → {{en-GB|Not only did she win…}}\n- *very exhausted* → {{en-GB|absolutely exhausted.}}\n- *It was Anna that she called me.* → {{en-GB|It was Anna who called me.}}\n- Usare inversione in contesti informali: suona teatrale.' },
      { h: 'Riepilogo', b: '- Cleft: It was… that / What I need is…\n- Inversione dopo never, rarely, not only, no sooner, only after.\n- Ausiliare enfatico: I DO like it.\n- Aggettivi estremi con absolutely, non con very.' }
    ],
    exercises: [
      mc('Which sentence is correct?', ['Never I have seen such a mess.', 'Never have I seen such a mess.', 'Never I saw such a mess.', 'Never did I have seen.'], 1),
      mc('___ did she win, but she also broke the record.', ['Not only', 'Only not', 'No only', 'Not just'], 0),

      { h: 'Obiettivo', b: 'Se conosci hiragana e katakana puoi leggere, ma per **capire e farti capire** serve il ritmo giusto. Il giapponese non conta sillabe: conta **more**, unità di durata quasi uguale.\n\nImparerai a sentire e produrre la differenza tra *oba-san* e *obaa-san* (zia / nonna) e altre coppie che cambiano il significato.' },
      { h: 'La mora', b: 'Ogni kana vale **una mora**, con due eccezioni utili:\n- i kana piccoli ゃ ゅ ょ si fondono con quello prima: きゃ = **una** mora;\n- ん, っ e la barra ー (e la seconda vocale lunga) valgono **una mora ciascuno**.\n\n> {{ja|ビール}} = bi-i-ru = **3 more** · {{ja|ビル}} = bi-ru = **2 more**\n> {{ja|きって}} = ki-t-te = **3 more** · {{ja|きて}} = ki-te = **2 more**\n> {{ja|とうきょう}} = to-u-kyo-u = **4 more**\n\nIl ritmo è regolare: ogni mora dura circa lo stesso tempo, come i battiti di un metronomo.' },
      { h: 'Vocali lunghe, っ, ん', b: '**Vocali lunghe**: una vocale ripetuta dura due more. Cambia il significato:\n- {{ja|おばさん}} (zia/signora) vs {{ja|おばあさん}} (nonna)\n- {{ja|おじさん}} (zio) vs {{ja|おじいさん}} (nonno)\n- {{ja|ゆき}} (neve) vs {{ja|ゆうき}} (coraggio)\n\n**っ (sokuon)**: una piccola pausa prima della consonante: {{ja|きて}} (vieni) vs {{ja|きって}} (francobollo); {{ja|かた}} vs {{ja|かった}} (ha comprato / ha vinto).\n\n**ん**: nasale che dura una mora intera; il suono si adatta a ciò che segue (n/m/ng). {{ja|ほん}}, {{ja|さんぽ}}, {{ja|にほんご}}.' },
      { h: 'Vocali, consonanti, accento', b: '**Vocali**: cinque, pure e stabili (a i u e o): niente dittonghi all’italiana.\n\n**Consonanti**: la **r** giapponese è una battuta rapida della lingua (simile alla d di «ladro» o della t americana in *water*). **ふ** è un suono soffiato, tra f e h. **つ** = tsu.\n\n**Vocali sorde**: in {{ja|です}} e {{ja|ます}} la u finale quasi scompare («des», «mas»).\n\n**Pitch accent**: il giapponese usa differenze di **altezza** (alto/basso), non di intensità. Esempio (Tokyo): {{ja|あめ}} «pioggia» (alto-basso) e {{ja|あめ}} «caramella» (basso-alto). Varia secondo il dialetto: impara ascoltando e ripetendo (shadowing).' },
      { h: 'Saluti essenziali', b: '- {{ja|おはようございます}} — buongiorno (mattina)\n- {{ja|こんにちは}} — salve / buongiorno (giorno)\n- {{ja|こんばんは}} — buonasera\n- {{ja|ありがとうございます}} — grazie\n- {{ja|すみません}} — scusi / mi scusi (anche per attirare l’attenzione)\n- {{ja|いただきます}} — prima di mangiare\n- {{ja|ごちそうさまでした}} — dopo aver mangiato\n- {{ja|おやすみなさい}} — buonanotte\n\nNota: こんにちは si scrive con **は** ma si legge **wa**; è un residuo di una frase più lunga.' },
      { h: 'Esempio guidato', b: 'Conta le more: {{ja|がっこう}} (scuola).\n\nが – っ – こ – う → **4 more**: ga · Q · ko · u.\n\nProva ad ascoltarla e a ripeterla battendo il ritmo con la mano: *ga – Q – ko – u*. La pausa di っ deve essere vuota ma contata.\n\nControllo: se pronunci «gakko» senza pausa e «koo» senza lunghezza, ti capiranno comunque spesso, ma coppie come *oba-san / obaa-san* diventano ambigue.' },
      { h: 'Errori comuni', b: '- Dimenticare la lunghezza: *obasan* per *obaasan*.\n- Pronunciare っ come consonante lunga debole: va sentita come pausa.\n- Mettere un accento d’intensità come in italiano: il giapponese è piatto in intensità.\n- Leggere **は** come *ha* nella particella: è *wa* (lo vedrai nella prossima lezione).\n- Pronunciare ん sempre come «n»: davanti a p/b/m è «m».' },
      { h: 'Riepilogo', b: '- Il giapponese conta **more**: ogni kana = 1 (きゃ = 1).\n- Vocali lunghe, っ e ん contano come more e cambiano il significato.\n- です/ます: u quasi muta; r = battuta rapida.\n- L’accento è di altezza, non di intensità: allenalo con lo shadowing.' }

      { h: 'Domande, も, の', b: '**Domanda**: aggiungi **か** alla fine, senza punto interrogativo obbligatorio. {{ja|[学生|がくせい]ですか。}}\n\n**も** = «anche»: sostituisce は. {{ja|わたしも [学生|がくせい]です。}}\n\n**の** collega due nomi (possesso, appartenenza, descrizione): {{ja|イタリアの [学生|がくせい]}} (studente d’Italia); {{ja|わたしの [名前|なまえ]}} (il mio nome).\n\n**Domande utili**:\n- {{ja|お[名前|なまえ]は なんですか。}} — Come ti chiami?\n- {{ja|おいくつですか。}} — Quanti anni hai?\n- {{ja|どこの [国|くに]の [人|ひと]ですか。}} — Di che paese sei?' },
      { h: 'Parole di sopravvivenza', b: '**Persone**: {{ja|わたし}} (io), {{ja|あなた}} (tu: usalo poco, meglio il nome), {{ja|[友達|ともだち]}} (amico), {{ja|[先生|せんせい]}}, {{ja|[学生|がくせい]}}, {{ja|[会社員|かいしゃいん]}} (impiegato).\n**Paesi**: {{ja|イタリア}}, {{ja|にほん}}, {{ja|アメリカ}}, {{ja|イギリス}}.\n**Numeri 1–10**: {{ja|いち}}, {{ja|に}}, {{ja|さん}}, {{ja|よん}}/{{ja|し}}, {{ja|ご}}, {{ja|ろく}}, {{ja|なな}}/{{ja|しち}}, {{ja|はち}}, {{ja|きゅう}}, {{ja|じゅう}}.\n\n**Suffisso さん**: si aggiunge ai nomi altrui (mai al proprio): {{ja|[田中|たなか]さん}}.' },
      { h: 'Esempio guidato', b: 'Presentati: *Mi chiamo Marco, sono italiano, sono impiegato.*\n\n1. Nome: {{ja|わたしは マルコです。}}\n2. Origine: {{ja|イタリアの [人|ひと]です。}}\n3. Lavoro: {{ja|[会社員|かいしゃいん]です。}}\n4. Chiusura: {{ja|よろしく おねがいします。}}\n\nOra rendila una conversazione: {{ja|A：はじめまして。マルコです。B：[田中|たなか]です。よろしく おねがいします。}}\n\nControllo: ogni frase finisce con です; la presentazione usa わたしは una volta sola e poi omette il soggetto.' },
      { h: 'Errori comuni', b: '- Leggere **は** come *ha*: è *wa* come particella.\n- Dimenticare che per presentarsi si dice solo il nome: {{ja|マルコです。}} basta, senza さん.\n- Usare さん per se stessi: {{ja|わたしは マルコさんです}} è sbagliato.\n- Mettere il punto interrogativo e dimenticare か: la domanda usa か.\n- Usare あなた troppo spesso: suona diretto.' },
      { h: 'Riepilogo', b: '- A は B です = A è B. Negativo: じゃ ありません.\n- か per domandare, も per «anche», の per collegare nomi.\n- さん solo per gli altri.\n- Presentazione tipica: はじめまして → nome → origine → lavoro → よろしく おねがいします.' }

      listen('おなまえは なんですか。', 'ja', 'Che cosa ti ha chiesto?', ['Come ti chiami?', 'Quanti anni hai?', 'Dove abiti?', 'Che lavoro fai?'], 0),

    test: [

      mc('Che cosa significa «わたしも がくせいです»?', ['Anch’io sono studente', 'Non sono studente', 'Sei studente?', 'Sono il suo studente'], 0),
      mc('Quale uso di さん è corretto?', ['わたしは マルコさんです。', 'たなかさんは せんせいです。', 'わたしさんは がくせいです。', 'せんせいさんが ここです。'], 1),
      listen('わたしは にほんじんじゃ ありません。', 'ja', 'Che cosa significa?', ['Sono giapponese', 'Non sono giapponese', 'Sei giapponese?', 'Anch’io sono giapponese'], 1, 'じゃ ありません = negazione cortese.')

    ],
    listening: [{ id: 'l1', lang: 'ja', title: 'Presentazione', text: 'はじめまして。わたしは マルコです。イタリアの ひとです。かいしゃいんです。にほんごを べんきょうして います。よろしく おねがいします。',

  C.addTopic({

      { h: 'La forma ます', b: 'Quattro forme cortesi (presente / passato):\n- affermativa: {{ja|[食|た]べます}} (mangio / mangerò) · {{ja|[食|た]べました}} (ho mangiato)\n- negativa: {{ja|[食|た]べません}} (non mangio) · {{ja|[食|た]べませんでした}} (non ho mangiato)\n\nNel giapponese non esiste un tempo futuro distinto: **presente = abitudine e futuro**. {{ja|あした [行|い]きます。}} = domani vado.\n\nVerbi utili: {{ja|[食|た]べます}}, {{ja|[飲|の]みます}}, {{ja|[行|い]きます}}, {{ja|[来|き]ます}}, {{ja|[見|み]ます}}, {{ja|[聞|き]きます}}, {{ja|[読|よ]みます}}, {{ja|[書|か]きます}}, {{ja|[勉強|べんきょう]します}}, {{ja|[起|お]きます}}, {{ja|[寝|ね]ます}}.' },
      { h: 'Particelle: を, に, で, へ', b: '- **を** (si legge o): oggetto diretto. {{ja|[水|みず]を [飲|の]みます。}}\n- **に**: punto di arrivo, tempo preciso, destinatario. {{ja|[七時|しちじ]に [起|お]きます。}} / {{ja|[学校|がっこう]に [行|い]きます。}}\n- **で**: luogo dell’azione o mezzo. {{ja|[図書館|としょかん]で [勉強|べんきょう]します。}} / {{ja|[電車|でんしゃ]で [行|い]きます。}}\n- **へ** (si legge e): direzione, come に per i movimenti. {{ja|[日本|にほん]へ [行|い]きます。}}\n\nLa differenza fra **に** e **で**: に = dove arrivi o quando; で = dove fai l’azione.' },
      { h: 'Tempo e routine', b: '**Ora + に**: {{ja|[七時|しちじ]に}} (alle 7), {{ja|[八時半|はちじはん]に}} (alle 8:30).\n**Giorni**: {{ja|[毎日|まいにち]}} (ogni giorno), {{ja|[今日|きょう]}}, {{ja|[明日|あした]}}, {{ja|[昨日|きのう]}}. Con まいにち, きょう, あした NON si usa に.\n**Frequenza**: {{ja|よく}} (spesso), {{ja|ときどき}}, {{ja|あまり ～ません}} (non molto), {{ja|ぜんぜん ～ません}} (mai).\n\nOrdine tipico: **tempo → luogo → oggetto → verbo**.\n> {{ja|わたしは [毎朝|まいあさ] [七時|しちじ]に [起|お]きます。}}' },
      { h: 'Esempio guidato', b: 'Racconta: *Ogni mattina bevo un caffè a casa e vado in ufficio in treno.*\n\n1. Tempo: {{ja|[毎朝|まいあさ]}}\n2. Luogo + oggetto + verbo: {{ja|うちで コーヒーを [飲|の]みます。}}\n3. Mezzo e meta: {{ja|[電車|でんしゃ]で [会社|かいしゃ]へ [行|い]きます。}}\n\nFrase completa: {{ja|[毎朝|まいあさ] うちで コーヒーを [飲|の]みます。[電車|でんしゃ]で [会社|かいしゃ]へ [行|い]きます。}}\n\nControllo: i verbi sono in fondo; で indica sia il luogo («a casa») sia il mezzo («in treno»).' },
      { h: 'Errori comuni', b: '- *コーヒー**が** のみます* (oggetto con が): di norma を.\n- *うちに コーヒーを のみます* (luogo dell’azione con に): usa で.\n- *まいにちに* : dopo まいにち non si mette に.\n- Mettere il verbo a metà frase: va **alla fine**.\n- Dimenticare le negazioni cortesi: ません (non ない) nel parlato cortese.' },
      { h: 'Riepilogo', b: '- ます / ません / ました / ませんでした.\n- を oggetto; に arrivo/ora; で luogo azione/mezzo; へ direzione.\n- Ordine: tempo → luogo → oggetto → verbo.\n- Presente = abitudine e futuro.' }

    ],

    ],

      qs: [{ q: 'A che ora si alza Mari?', o: ['Alle 6', 'Alle 7', 'Alle 8', 'Alle 9'], a: 1, kind: 'explicit' }, { q: 'Come va a scuola?', o: ['In bus', 'In treno', 'A piedi', 'In bici'], a: 1, kind: 'explicit' }, { q: 'Quando studia giapponese?', o: ['Prima di colazione', 'Dopo cena', 'A pranzo', 'Alla mattina'], a: 1, kind: 'explicit' }] }],

  C.addTopic({
    id: 'jpn-j1-places-wants', subject: 'jpn', stage: 'J1', title: 'Luoghi, esistenza, aggettivi e desideri', minutes: 20, prereq: ['jpn-j1-masu'],

    pages: [

      { h: 'あります / います', b: '- **あります**: esistono cose inanimate (e piante).\n- **います**: persone e animali.\n\n> {{ja|つくえの うえに [本|ほん]が あります。}} — Sul tavolo c’è un libro.\n> {{ja|[公園|こうえん]に [犬|いぬ]が います。}} — Nel parco c’è un cane.\n\nLuogo + **に** + cosa + **が** + あります/います.\n\nPosizioni: {{ja|うえ}} (sopra), {{ja|した}} (sotto), {{ja|まえ}} (davanti), {{ja|うしろ}} (dietro), {{ja|なか}} (dentro), {{ja|となり}} (accanto), {{ja|ちかく}} (vicino).\n\nDomande: {{ja|[駅|えき]は どこですか。}} — Dov’è la stazione? / {{ja|[駅|えき]は [公園|こうえん]の [隣|となり]です。}}' },
      { h: 'Aggettivi in い e in な', b: 'Due famiglie:\n- **い-aggettivi** finiscono in い: {{ja|[大|おお]きい}}, {{ja|[小|ちい]さい}}, {{ja|おいしい}}, {{ja|[高|たか]い}}. Negazione: ～くないです. {{ja|おいしくないです。}}\n- **な-aggettivi** richiedono な davanti a un nome: {{ja|きれいな [部屋|へや]}}, {{ja|[静|しず]かな [町|まち]}}. Negazione: ～じゃ ありません.\n\nPredicato: {{ja|この [店|みせ]は おいしいです。}} / {{ja|この [町|まち]は [静|しず]かです。}}\n\nEccezione frequente: {{ja|いい}} (buono) → negativo {{ja|よくないです}}.' },
      { h: 'Preferenze e desideri', b: '- **～が すきです / きらいです**: piacere / non piacere. {{ja|わたしは [音楽|おんがく]が すきです。}}\n- **～が ほしいです**: voglio (un oggetto). {{ja|あたらしい [靴|くつ]が ほしいです。}}\n- **～たいです**: voglio fare. Radice del verbo (senza ます) + たい. {{ja|[日本|にほん]へ [行|い]きたいです。}} / {{ja|[水|みず]を [飲|の]みたいです。}}\n\nAttenzione: la forma たい riguarda **il parlante**; per altri si usa ～たがっています (più avanti).\n\nNella negazione: {{ja|[行|い]きたくないです。}} (non voglio andare).' },
      { h: 'Esempio guidato', b: 'Descrivi la tua stanza: *Nella mia stanza c’è un grande letto e una scrivania. Sulla scrivania c’è un libro. Vorrei una lampada nuova.*\n\n- {{ja|わたしの [部屋|へや]に [大|おお]きい ベッドと つくえが あります。}}\n- {{ja|つくえの うえに [本|ほん]が あります。}}\n- {{ja|あたらしい ランプが ほしいです。}}\n\nControllo: う/に/が corretti? **に** per il luogo di esistenza, **が** per l’oggetto che c’è.' },
      { h: 'Errori comuni', b: '- *いぬが あります* → {{ja|いぬが います。}} (animati: います).\n- *きれいい* → {{ja|きれいな}} (な-aggettivo, non い).\n- *おいしいじゃありません* → {{ja|おいしくないです。}}\n- *たべますたいです* → {{ja|たべたいです。}} (radice + たい, non ます).\n- Usare **を** con すき: si dice {{ja|おんがくが すきです。}}' },

      mc('«Voglio bere acqua»:', ['みずを のみたいです。', 'みずを のみますたいです。', 'みずが のむたいです。', 'みずを のませんです。'], 0),
      order('Metti in ordine: «Sul tavolo c’è un libro»', ['つくえの', 'うえに', 'ほんが', 'あります'], 'Luogo + に + cosa + が + あります.'),

  C.addTopic({

      { h: 'Obiettivo', b: 'In giapponese **la direzione** del favore o del dono conta: chi dà, chi riceve, e se il ricevente è «dentro» (io, la mia famiglia) o «fuori». Imparerai a esprimerlo e a rendere le tue richieste più rispettose.' },

      { h: 'Richieste cortesi', b: 'Scala di cortesia (crescente):\n1. {{ja|[待|ま]って。}} (casual)\n2. {{ja|[待|ま]って ください。}}\n3. {{ja|[待|ま]って くれませんか。}} / {{ja|[待|ま]って もらえませんか。}}\n4. {{ja|[待|ま]って いただけませんか。}} (molto cortese)\n5. {{ja|お[待|ま]ち ください。}} / {{ja|お[待|ま]ち いただけますか。}} (servizio / keigo)\n\nRifiuto con garbo: {{ja|すみません、ちょっと…}} (lascia la frase in sospeso), {{ja|あいにく ～}} (purtroppo).' },
      { h: 'Formule di servizio', b: '- {{ja|いらっしゃいませ。}} — benvenuto (negozi)\n- {{ja|かしこまりました。}} — certamente\n- {{ja|[少々|しょうしょう]お[待|ま]ち ください。}} — un momento, per favore\n- {{ja|[申|もう]します}} — mi chiamo (umile): {{ja|[田中|たなか]と [申|もう]します。}}\n- {{ja|いただきます}} — ricevo (letteralmente: umilmente accetto)\n- {{ja|ございます}} — forma cortese di あります (おはようございます)\n- {{ja|[召|め]し[上|あ]がって ください。}} — la prego di mangiare (onorifico)\n\nNon è necessario usare keigo attivamente subito: **riconoscerlo** ti permette di capire commessi, annunci ed email formali.' },

      { h: 'Errori comuni', b: '- *わたしは ともだちに くれました* → {{ja|ともだちは わたしに くれました。}} (くれる: l’altro dà a me).\n- *せんせいに てつだって あげます* a un superiore: suona presuntuoso; meglio {{ja|おてつだい します。}}\n- Usare **もらう** con に/から indifferentemente: dopo もらう va bene **に** o **から**.\n- Confondere *お[待|ま]ち ください* (formale) con *まってください* (neutro).\n- Chiedere un favore con ～てください a chi è molto più alto di rango.' },

/* SkillTree — guscio dell'app: stato, navigazione a pila, barra superiore, eventi, tempo attivo. */
(function (ST) {
  'use strict';
  const U = ST.util, P = ST.progress;
  const A = ST.app = { state: null, stack: [], tab: 'home', ctx: null };
  ST.views = {};      // name -> (params) => html
  ST.after = {};      // name -> (el, params) => void   (hook post-render)
  ST.acts = {};       // data-act -> (el, ev) => void

  const $ = (q, r) => (r || document).querySelector(q);
  A.$ = $;
  A.save = () => ST.storage.save(A.state);
  A.toast = (msg, ms) => {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600);
  };
  A.theme = () => { document.documentElement.setAttribute('data-theme', A.state.profile.theme || 'neon'); };

  A.view = () => A.stack.length ? A.stack[A.stack.length - 1] : { name: A.tab, p: {} };
  A.go = (name, p) => { A.stack.push({ name, p: p || {} }); try { history.pushState({ d: A.stack.length }, ''); } catch (e) { /* file:// può rifiutare */ } A.render(true); };
  A.replace = (name, p) => { A.stack[A.stack.length - 1] = { name, p: p || {} }; A.render(); };
  A.back = () => {
    if (!A.stack.length) return;
    let used = false;
    try { if (history.state && history.state.d) { history.back(); used = true; } } catch (e) { /* ignora */ }
    if (!used) { A.stack.pop(); A.render(true); }
  };
  A.setTab = t => { A.stack = []; A.tab = t; A.render(true); };
  window.addEventListener('popstate', () => {
    if (A.stack.length) { A.stack.pop(); A.render(true); }
    else if (A.tab !== 'home') { A.tab = 'home'; A.render(true); }
  });

  /* ---- tempo attivo (stima onesta: i minuti sono misurati dall'interazione, con soglia di inattività) ---- */
  let lastTouch = Date.now();
  const touch = () => {
    const now = Date.now(), dt = now - lastTouch;
    lastTouch = now;
    if (dt > 0 && dt < 45000 && A.ctx && A.state) {
      const d = (A.state.daily[U.today()] = A.state.daily[U.today()] || {});
      d.active = d.active || {};
      d.active[A.ctx] = (d.active[A.ctx] || 0) + dt / 60000;
    }
  };
  document.addEventListener('pointerdown', touch, true);
  document.addEventListener('keydown', touch, true);
  A.activeMin = ctx => { const d = A.state.daily[U.today()]; return d && d.active ? Math.round(d.active[ctx] || 0) : 0; };

  /* ---- giornata ---- */
  A.day = (date) => { const k = date || U.today(); return (A.state.daily[k] = A.state.daily[k] || { en: {}, ja: {}, general: {}, active: {} }); };
  A.streak = () => {
    let n = 0, d = U.today();
    const has = k => { const x = A.state.daily[k]; return x && ((x.active && Object.values(x.active).some(v => v >= 1)) || Object.values(x.en || {}).some(Boolean) || Object.values(x.ja || {}).some(Boolean) || Object.values(x.general || {}).some(Boolean)); };
    if (!has(d)) d = U.addDays(d, -1);
    while (has(d)) { n++; d = U.addDays(d, -1); }
    return n;
  };
  A.xp = (amount, key) => {
    const before = P.levelInfo(A.state.xp).level;
    const g = P.award(A.state, amount, key);
    const now = P.levelInfo(A.state.xp).level;
    if (now > before) A.toast('🎉 Livello generale ' + now + '!', 3200);
    A.save(); A.topbar();
    return g;
  };

    ST.audio.speak(sp.text, { lang, rate }).then(x => { if (!x.ok) A.toast(ST.audio.explain(x.reason), 4500); });
  };
  X['run-say'] = () => speakCur();
  X['run-slow'] = () => speakCur(0.6);
  X['run-quit'] = () => { clearTimers(); ST.audio.stop(); if (confirm('Uscire dalla sessione? I progressi di questa sessione non salvati andranno persi.')) { A.run = null; A.back(); } };

  const norm = s => U.norm(String(s));
  const check = (it, val) => {
    if (it.t === 'mc') return +val === it.a2;
    if (it.t === 'fill') {
      if (it.ja) return it.a.some(a => K.sameReading(val, a)) || it.a.some(a => norm(val) === norm(a));
      if (it.num) return it.a.some(a => String(val).trim() === String(a));
      return it.a.some(a => norm(a) === norm(val));
    }
    if (it.t === 'span') return String(val).replace(/\D/g, '') === it.a[0];
    if (it.t === 'dict') {
      const jp = it.lang === 'ja';
      const d = jp ? U.charDiff(K.toHiragana(U.speechText(it.text)), K.toHiragana(val)) : U.wordDiff(it.text, val);

      return d.score >= 0.85;
    }
    return !!val;
  };
  const answerText = it => it.t === 'dict' ? it.text : it.t === 'mc' ? it.o2[it.a2] : it.t === 'order' ? it.words.join(' ') : (it.a || []).join(' / ');

  R.answer = (ok, val) => {
    const r = A.run, it = r.cur;
    if (r.phase !== 'q') return;
    r.phase = 'fb';
    clearTimers();
    r.res.push({ item: r.items[r.i], ok, val, ms: Date.now() - r.t0 });
    if (r.onAnswer) r.onAnswer(r.items[r.i], ok, r.i);
    const fb = A.$('#fb');
    fb.innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + (ok ? '✓ Corretto' : '✗ Non corretto') + '</b>' + (it.t === 'dict' ? '<div>Precisione: <b>' + Math.round((r.lastScore || 0) * 100) + '%</b></div><div class="diff">' + (r.lastDiff ? r.lastDiff.ops.map(o => o.ok ? E(o.w) : o.missing ? '<span class="m">' + E(o.w) + '</span>' : '<span class="x">' + E(o.w) + '</span>').join(' ') : '') + '</div><div>Testo: <b>' + U.ruby(it.text) + '</b></div>' : ok ? '' : '<div>Risposta: <b>' + U.ruby(answerText(it)) + '</b></div>') + (it.why ? '<div class="mute small" style="margin-top:4px">' + U.ruby(it.why) + '</div>' : '') + '</div>' +
      '<button class="btn block" style="margin-top:10px" data-act="run-next">' + (r.i + 1 >= r.items.length ? 'Concludi' : 'Avanti') + '</button>';
    fb.scrollIntoView({ block: 'nearest' });
  };
  X['run-opt'] = el => {
    const r = A.run; if (r.phase !== 'q') return;
    const it = r.cur, i = +el.dataset.i, ok = i === it.a2;
    document.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (k === it.a2) b.classList.add('ok'); else if (k === i) b.classList.add('no'); });
    R.answer(ok, i);
  };
  X['run-fill'] = () => { const r = A.run, f = A.$('#fill'); if (!f || r.phase !== 'q') return; if (!f.value.trim()) return; f.disabled = true; R.answer(check(r.cur, f.value), f.value); };
  X['run-tok'] = el => { const r = A.run, it = r.cur, t = it.tok[+el.dataset.k]; if (it.placed.includes(t)) return; it.placed.push(t); const keep = r.phase; A.render(); r.phase = keep; };
  X['run-untok'] = el => { const it = A.run.cur; it.placed.splice(+el.dataset.k, 1); A.render(); };
  X['run-order'] = () => { const it = A.run.cur; if (A.run.phase !== 'q') return; const ok = it.placed.length === it.words.length && it.placed.every((p, k) => p.i === k) || it.placed.map(p => p.w).join(' ') === it.words.join(' '); R.answer(ok, it.placed.map(p => p.w).join(' ')); };
  X['run-corsi'] = el => {
    const r = A.run, it = r.cur; if (r.phase !== 'q') return;
    const i = +el.dataset.i; r.corsiIn.push(i); el.classList.add('lit');
    const k = r.corsiIn.length - 1;
    if (it.seq[k] !== i) { document.querySelectorAll('#corsi button').forEach(b => { b.disabled = true; }); R.answer(false, r.corsiIn.join(',')); }
    else if (r.corsiIn.length === it.seq.length) { document.querySelectorAll('#corsi button').forEach(b => { b.disabled = true; }); R.answer(true, r.corsiIn.join(',')); }
  };
  X['run-odd'] = el => { const it = A.run.cur; if (A.run.phase !== 'q') return; R.answer(+el.dataset.i === it.a, el.dataset.i); };
  X['run-stroop'] = el => { const it = A.run.cur; if (A.run.phase !== 'q') return; R.answer(+el.dataset.i === it.a, el.dataset.i); };
  X['run-next'] = () => {
    const r = A.run; clearTimers(); ST.audio.stop();
    if (r.i + 1 >= r.items.length) { r.phase = 'done'; r.extra = r.onFinish ? r.onFinish(r.res) : ''; A.render(); return; }
    r.i++; prep(); A.render();
  };
  const summary = () => {
    const r = A.run, ok = r.res.filter(x => x.ok).length, n = r.res.length;
    const wrong = r.res.filter(x => !x.ok);
    return '<div class="card glow center"><h1>' + E(r.title) + '</h1><div class="big">' + ok + ' / ' + n + '</div><p class="mute">' + Math.round(100 * ok / Math.max(1, n)) + '% corrette</p>' + (r.extra || '') + '</div>' +
      (wrong.length ? '<div class="card"><h3>Da rivedere</h3>' + wrong.map(w => '<p><b>' + U.ruby(w.item.q || '') + '</b><br><span class="mute small">' + U.ruby(w.item.t === 'mc' ? w.item.o[w.item.a] : w.item.t === 'order' ? w.item.words.join(' ') : (w.item.a || []).join(' / ')) + '</span></p>').join('') + '<p class="mute small">Gli errori tornano nel ripasso dilazionato.</p></div>' : '') +
      '<button class="btn block" data-act="run-close">Fine</button>';
  };
  X['run-close'] = () => { const r = A.run; A.run = null; clearTimers(); if (r && r.after) r.after(); A.back(); };
})(window.ST = window.ST || {});

/* ---- ui/topic ---- */
/* SkillTree — hub dell'argomento, lezione a pagine (stile libro digitale), esercizi e verifica. */
(function (ST) {
  'use strict';

    const act = (icon, title, sub, view, extra) => '<button class="item" data-act="go" data-view="' + view + '" data-p=\'' + JSON.stringify(Object.assign({ id: t.id }, extra || {})) + '\'><span class="ic">' + icon + '</span><span class="tx"><b>' + title + '</b><span>' + sub + '</span></span></button>';
    const lastTest = (r.tests || []).slice(-1)[0];
    let h = '<div class="row"><button class="btn alt sm" data-act="back">← Indietro</button></div><h1>' + E(t.title) + '</h1><p class="mute">' + E(t.summary) + '</p>' +
      '<p>' + (C.subject(t.subject) ? '<span class="tag">' + E(C.subject(t.subject).title) + '</span>' : '') + '<span class="tag">Stage ' + E(t.stage) + '</span><span class="tag">~' + t.minutes + ' min</span>' + ST.statusTag(st) + '</p>';
    if (t.objectives && t.objectives.length) h += '<div class="card"><h3>Obiettivi</h3><ul>' + t.objectives.map(o => '<li>' + E(o) + '</li>').join('') + '</ul>' + ((t.prereq || []).length ? '<p class="mute small">Prerequisiti: ' + t.prereq.map(x => E(C.topic(x).title)).join(', ') + '</p>' : '') + '</div>';
    h += '<div class="list">' +
      act('📖', 'Lezione', t.pages.length + ' pagine' + (r.studied ? ' · letta' : r.page ? ' · riprendi da pagina ' + (r.page + 1) : ''), 'lesson') +
      act('✍️', 'Esercizi applicativi', done + '/' + nEx + ' svolti correttamente', 'practiceTopic') +
      (t.listening ? act('🎧', 'Ascolto senza testo', t.listening.length + ' brano · comprensione esplicita e implicita', 'listenTopic') : '') +
      (t.dictation ? act('📝', 'Dettato', t.dictation.length + ' frasi', 'dictTopic') : '') +
      (t.shadowing ? act('🗣️', 'Shadowing e pronuncia', t.shadowing.length + ' frasi · registrazione facoltativa', 'shadowTopic') : '') +
      (t.speaking ? act('💬', 'Risposta spontanea', t.speaking.length + ' consegne', 'speakTopic') : '') +
      (t.reading ? act('📰', 'Lettura', t.reading.length + ' testi', 'readTopic') : '') +
      act('🧪', 'Verifica dell’argomento', (t.test || []).length + ' domande · ' + (lastTest ? 'ultimo: ' + Math.round(lastTest.score * 100) + '% (' + lastTest.date + ')' : 'non ancora svolta') + (canTest ? '' : ' · conta come verifica da domani'), 'testTopic') +
      '</div>';
    if (t.cards && t.cards.length) h += '<div class="card"><h3>Lessico dell’argomento</h3><p class="mute small">Entra nel ripasso dilazionato dopo la lezione.</p><p>' + t.cards.map(c => '<span class="tag">' + U.ruby(c.b) + ' · ' + E(c.f) + '</span>').join(' ') + '</p></div>';
    return h;
  };

  /* ---- Lezione a pagine ---- */
  V.lesson = p => {
    const t = C.topic(p.id), r = rec(t.id), n = t.pages.length;
    let i = typeof p.page === 'number' ? p.page : (r.page || 0);
    i = Math.max(0, Math.min(n - 1, i));
    r.page = i; A.save();

    if (i === n - 1 && !r.studied) markStudied(t);
    const toc = p.toc ? '<div class="card"><h3>Indice</h3><div class="list">' + t.pages.map((q, k) => '<button class="item' + (k === i ? ' done' : '') + '" data-act="lpage" data-id="' + t.id + '" data-k="' + k + '"><span class="tx"><b>' + (k + 1) + '. ' + E(q.h) + '</b></span></button>').join('') + '</div></div>' : '';
    const lang = langOf(t);
    return '<div class="reader"><div class="row"><button class="btn alt sm" data-act="back">← Argomento</button><span class="sp"></span>' + (lang === 'ja' ? '<button class="btn alt sm" data-act="furi">あ ' + (A.state.profile.furigana === false ? 'Mostra' : 'Nascondi') + ' furigana</button>' : '') + '<button class="btn alt sm" data-act="ltoc" data-id="' + t.id + '" data-i="' + i + '">☰ Indice</button></div>' +
      '<div class="pbar"><div class="prog"><i style="width:' + Math.round(100 * (i + 1) / n) + '%"></i></div><div class="mute small">Pagina ' + (i + 1) + ' di ' + n + ' · ' + E(t.title) + '</div></div>' + toc +
      '<article class="page"><h2>' + E(pg.h) + '</h2>' + U.markup(pg.b) + '</article></div>' +
      '<div class="footnav"><button class="btn alt" data-act="lpage" data-id="' + t.id + '" data-k="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + '>← Indietro</button>' +
      (i < n - 1 ? '<button class="btn" data-act="lpage" data-id="' + t.id + '" data-k="' + (i + 1) + '">Avanti →</button>' : '<button class="btn" data-act="lexercise" data-id="' + t.id + '">Vai agli esercizi →</button>') + '</div>';
  };
  const markStudied = t => {
    const r = rec(t.id); r.studied = U.today();
    ST.cards.introduceTopic(A.state, t);
    const subj = C.subject(t.subject); if (subj) A.subjectTouch(subj.id);
    A.xp(t.pill ? 12 : 30, 'lesson:' + t.id);
    A.toast('Lezione completata · lessico aggiunto al ripasso');
    if (ST.topicStudiedHook) ST.topicStudiedHook();
  };
  X.lpage = el => { const t = C.topic(el.dataset.id); A.replace('lesson', { id: t.id, page: +el.dataset.k }); };
  X.ltoc = el => A.replace('lesson', { id: el.dataset.id, page: +el.dataset.i, toc: !A.view().p.toc });
  X.furi = () => { A.state.profile.furigana = A.state.profile.furigana === false; A.save(); A.render(); };

  const subjectCtx = t => langOf(t) || 'general';
  V.practiceTopic = p => { setTimeout(() => X.startPractice(p.id, true), 0); return '<p class="mute center">Preparazione…</p>'; };
  X.startPractice = (id, replace) => {
    const t = C.topic(id), r = rec(id);
    if (replace) A.stack.pop();
    // Priorità: esercizi non ancora corretti, poi gli altri.
    const order = t.exercises.map((e, i) => ({ e, i, ok: (r.ex[i] || {}).ok })).sort((a, b) => (a.ok ? 1 : 0) - (b.ok ? 1 : 0));
    R.start({
      title: 'Esercizi · ' + t.title, kind: 'practice', items: order.map(o => Object.assign({}, o.e, { _i: o.i })), ctx: subjectCtx(t),
      onAnswer: (it, ok) => {
        const e = (r.ex[it._i] = r.ex[it._i] || { n: 0, ok: false }); e.n++; if (ok) e.ok = true; e.last = U.today();
        if (!ok) ST.cards.registerError(A.state, t, it._i);
        A.xp(ok ? 4 : 1, 'ex:' + t.id + ':' + it._i);
      },
      onFinish: res => { A.subjectTouch(t.subject); A.save(); const ok = res.filter(x => x.ok).length; return '<p>' + (ok === res.length ? 'Tutto corretto. Domani prova la verifica.' : 'Gli errori tornano domani nei ripassi.') + '</p>'; }
    });
  };
  V.testTopic = p => { setTimeout(() => X.startTest(p.id, true), 0); return '<p class="mute center">Preparazione…</p>'; };
  X.startTest = (id, replace) => {
    const t = C.topic(id), r = rec(id);
    if (replace) A.stack.pop();
    const canCount = r.studied && U.diffDays(r.studied, U.today()) >= 1;
    if (!r.studied && !confirm('Non hai ancora completato la lezione. Vuoi fare la prova comunque? (non contribuirà alla verifica)')) { return; }
    R.start({
      title: 'Verifica · ' + t.title, kind: 'test', items: (t.test || []).map(x => Object.assign({}, x)), ctx: subjectCtx(t),
      onAnswer: (it, ok) => { A.xp(ok ? 8 : 0, 'test:' + t.id); },
      onFinish: res => {
        const score = res.filter(x => x.ok).length / res.length;
        const wasRetest = P.atLeast(P.topicStatus(A.state, id), 'verified');
        (wasRetest ? r.retests : r.tests).push({ date: U.today(), score, n: res.length });
        A.subjectTouch(t.subject); A.save();
        const st = P.topicStatus(A.state, id);
        let msg = '<p>Stato: ' + ST.statusTag(st) + '</p>';
        if (score < P.PASS) msg += '<p class="warn">Sotto l’80%: rivedi la lezione e gli errori; riprova dopo un po’.</p>';
        else if (!canCount) msg += '<p class="warn">Superata, ma svolta nello stesso giorno della lezione: <b>non conta come verifica</b>. Ripetila da domani per ottenere «Verificato».</p>';
        else if (st === 'verified') msg += '<p class="fb ok">Verificato. Un ritest dopo almeno 14 giorni porterà a «Mantenuto».</p>';
        else if (st === 'retained') msg += '<p class="fb ok">Ritest superato a distanza: conoscenza mantenuta.</p>';
        return msg;
      }
    });
  };
  P.canVerify = 1;

/* ---- ui/labs ---- */
/* SkillTree — laboratori linguistici: ripasso, ascolto, dettato, shadowing, risposta spontanea,
   conversazione ramificata, lettura, scrittura, Kana Trainer, mini-esami e prove B2 (ascolto/lettura). */
(function (ST) {
  'use strict';
  const U = ST.util, P = ST.progress, PL = ST.plan, C = ST.content, A = ST.app, E = U.esc, V = ST.views, X = ST.acts, R = ST.runner, K = ST.kana;
  const L = ST.labs = {};

  const subjOf = lang => lang === 'en' ? 'eng' : 'jpn';
  const ttsLang = (lang, accent) => lang === 'ja' ? 'ja-JP' : (accent || A.state.profile.accents.en || 'en-GB');
  const cleanSpeech = t => U.speechText(t).replace(/(^|[.!?。]\s+|— )([A-Z][a-z]+(?: [A-Za-z]+)?): /g, '$1');
  /* Argomenti già studiati (lezione letta); se nessuno, il primo argomento sbloccato come anteprima. */
  L.studied = lang => {
    const ts = C.topicsOf(subjOf(lang)), s = A.state;
    const st = ts.filter(t => P.atLeast(P.topicStatus(s, t.id), 'studied'));
    return st.length ? st : ts.slice(0, 1);
  };
  const leastUsed = (arr, key, map) => {
    const m = map || {};
    const sorted = U.shuffle(arr).sort((a, b) => ((m[a[key]] || {}).n || 0) - ((m[b[key]] || {}).n || 0));
    return sorted[0];
  };
  const done = opts => { if (opts && opts.onDone) opts.onDone(); };
  const langOpt = (p) => p && p.lang ? p.lang : 'en';

  /* ---------- Ripasso dilazionato ---------- */
  X.startReview = (lang, opts) => {
    const s = A.state;
    let ids = ST.cards.dueIds(s, lang || '').slice(0, (opts && opts.max) || 20);
    if (!ids.length) { A.toast('Nessun elemento dovuto: ottimo!'); done(opts); return; }
    const items = ids.map(id => ST.cards.question(s, id)).filter(Boolean);
    R.start({
      title: 'Ripasso dilazionato', kind: 'review', items, ctx: lang || 'en',
      onAnswer: (it, ok) => { if (it.cardId) ST.cards.grade(s, it.cardId, ok, false); A.xp(ok ? 3 : 0, 'rev'); },
      onFinish: res => { A.save(); const ok = res.filter(x => x.ok).length; return '<p>I ripassi riusciti allungano l’intervallo (1→3→7→14→30 giorni…); gli errori tornano domani.</p><p class="mute small">Richiamo corretto: ' + ok + '/' + res.length + '.</p>'; },
      after: () => done(opts)
    });
  };
  V.review = p => { setTimeout(() => { A.stack.pop(); X.startReview(p.lang); }, 0); return '<p class="mute center">Preparazione…</p>'; };
  X.startCardsFree = (lang, opts) => {  // ripasso libero quando nulla è dovuto: non modifica le scadenze
    const ts = L.studied(lang), pool = ts.flatMap(t => (t.cards || []).map(c => ({ t, c })));
    if (!pool.length) { A.toast('Completa prima una lezione.'); return; }
    const pick = U.sample(pool, Math.min(10, pool.length));
    const isJa = lang === 'ja';
    R.start({ title: 'Lessico a recupero attivo', kind: 'free', ctx: lang, items: pick.map(x => ({ t: 'fill', ja: isJa, srcLabel: 'Richiamo libero (non modifica le scadenze)', q: 'Scrivi in ' + (isJa ? 'giapponese (kana o romaji)' : 'inglese') + ': «' + x.c.f + '»', a: [isJa ? (x.c.r || U.speechText(x.c.b)) : x.c.b], why: (isJa ? U.plainText(x.c.b) : x.c.b) + (x.c.ex ? ' — ' + x.c.ex : '') })), onAnswer: (it, ok) => A.xp(ok ? 1 : 0, 'free'), onFinish: () => '', after: () => done(opts) });
  };

  };
  X.startListening = (lang, opts) => {
    const ts = (opts && opts.topic) ? [C.topic(opts.topic)] : L.studied(lang);
    const pool = ts.flatMap(t => (t.listening || []).map(x => Object.assign({ topic: t }, x)));
    if (!pool.length) { A.toast('Nessun brano disponibile.'); return; }
    const heard = A.state.heard = A.state.heard || {};
    const ps = leastUsed(pool, 'id', Object.fromEntries(Object.keys(heard).map(k => [k.split('|')[1], heard[k]])));
    A.act = { kind: 'listen', passage: ps, plays: 0, lang, opts, gate: false };

  };
  V.listen = () => {
    const a = A.act, ps = a.passage;
    return '<div class="row"><button class="btn alt sm" data-act="listen-quit">← Esci</button></div><h1>🎧 Ascolto attivo</h1><div class="card"><p class="mute">' + E(ps.title) + (a.gate ? ' · prova B2' : '') + ' · accento ' + E(ps.lang) + '</p>' +
      '<p>Ascolta <b>senza testo</b>: prima il senso generale, poi i dettagli. Massimo 3 ascolti.</p>' +
      '<div class="row"><button class="btn" data-act="listen-play" id="lp">▶ Ascolta (' + a.plays + '/3)</button><button class="btn alt" data-act="listen-stop">■ Stop</button></div><p id="lmsg" class="mute small"></p></div>' +
      '<button class="btn block" data-act="listen-go"' + (a.plays < 1 ? ' disabled' : '') + ' id="lg">Rispondi alle domande →</button>';
  };
  X['listen-quit'] = () => { ST.audio.stop(); A.back(); };
  X['listen-stop'] = () => ST.audio.stop();
  X['listen-play'] = () => {
    const a = A.act; if (a.plays >= 3) { A.toast('Hai usato i 3 ascolti.'); return; }
    a.plays++; const msg = A.$('#lmsg'); A.$('#lp').textContent = '▶ Ascolta (' + a.plays + '/3)'; A.$('#lg').disabled = false;

  };
  X['listen-go'] = () => {
    ST.audio.stop();
    const a = A.act, ps = a.passage;
    A.stack.pop();
    R.start({
      title: 'Comprensione · ' + ps.title, kind: 'listen', ctx: a.lang, items: ps.qs.map(q => ({ t: 'mc', q: q.q, o: q.o, a: q.a, why: q.why || '', srcLabel: q.kind === 'implicit' ? 'Informazione implicita (inferenza)' : 'Informazione esplicita' })),

        A.subjectTouch(subjOf(a.lang)); A.save();

    });

  /* ---------- Dettato ---------- */
  X.startDictation = (lang, opts) => {
    const ts = (opts && opts.topic) ? [C.topic(opts.topic)] : L.studied(lang);

      onFinish: res => { A.subjectTouch(subjOf(lang)); A.save(); return '<p class="mute small">Il dettato verifica ascolto + ortografia. Riascolta le frasi sbagliate con il testo e ripetile in shadowing.</p>'; },
      after: () => done(opts) });
  };

  /* ---------- Shadowing, registrazione e autovalutazione ---------- */
  X.startShadow = (lang, opts) => {
    const ts = (opts && opts.topic) ? [C.topic(opts.topic)] : L.studied(lang);

  const rubric = [['rhythm', 'Ritmo e fluidità'], ['sounds', 'Suoni e pronuncia'], ['intonation', 'Intonazione']];
  V.shadow = () => {
    const a = A.act, it = a.items[a.i], tl = ttsLang(a.lang, it.lang);
    let h = '<div class="row"><button class="btn alt sm" data-act="shadow-quit">← Esci</button><span class="sp"></span><span class="mute small">' + (a.i + 1) + '/' + a.items.length + '</span></div><h1>🗣️ Shadowing</h1><div class="card"><p class="big" style="font-size:1.3rem">' + U.ruby(it.text) + '</p><p class="mute small">💡 ' + E(it.tip || '') + '</p>' +
      '<div class="row wrap"><button class="btn alt sm" data-act="shadow-say">🔊 Modello</button><button class="btn alt sm" data-act="shadow-slow">🐢 Lento</button></div></div>';

    if (a.step === 'compare') h += '<div class="card"><h3>2 · Confronta con il modello</h3>' + (a.blob ? '<div class="row wrap"><button class="btn alt sm" data-act="shadow-say">🔊 Modello</button><button class="btn alt sm" data-act="shadow-mine">▶ La mia voce</button></div>' : '<p class="mute small">Nessuna registrazione: valuta comunque la ripetizione ad alta voce.</p>') +
      '<p class="mute small">Autovalutazione (1 = lontano dal modello, 5 = molto vicino):</p>' + rubric.map(r => '<label class="small">' + r[1] + '</label><input type="range" min="1" max="5" value="3" data-r="' + r[0] + '" class="rg" style="width:100%">').join('') +
      '<p class="warn small">Il confronto autonomo <b>non equivale</b> a una valutazione di pronuncia da parte di un docente.</p><button class="btn block" data-act="shadow-next">' + (a.i + 1 >= a.items.length ? 'Concludi' : 'Salva e avanti') + '</button></div>';
    return h;
  };
  X['shadow-quit'] = () => { ST.audio.stop(); A.back(); };
  const shadowSay = rate => { const a = A.act, it = a.items[a.i]; ST.audio.speak(it.text, { lang: ttsLang(a.lang, it.lang), rate }).then(r => { if (!r.ok) A.toast(ST.audio.explain(r.reason), 4500); }); };
  X['shadow-say'] = () => shadowSay(); X['shadow-slow'] = () => shadowSay(0.6);
  let recTimer = null;
  X['shadow-rec'] = async () => {
    const a = A.act;
    try { await ST.audio.rec.start(); } catch (e) { A.toast(e.message, 5000); a.step = 'compare'; A.render(); return; }
    a.step = 'rec'; a.t0 = Date.now(); A.render();
    recTimer = setInterval(() => { const el = A.$('#rt'); if (!el) { clearInterval(recTimer); return; } const s = Math.floor((Date.now() - a.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 60) X['shadow-stop'](); }, 400);
  };
  X['shadow-stop'] = async () => { clearInterval(recTimer); const a = A.act; a.blob = await ST.audio.rec.stop(); a.step = 'compare'; A.render(); };
  X['shadow-skip'] = () => { A.act.blob = null; A.act.step = 'compare'; A.render(); };
  X['shadow-mine'] = () => { const a = A.act; if (a.blob) ST.audio.playBlob(a.blob).then(r => { if (!r.ok) A.toast('Riproduzione non riuscita.'); }); };
  X['shadow-next'] = async () => {
    const a = A.act, it = a.items[a.i], s = A.state, ratings = {};

    const entry = { id: 'rec-' + Date.now().toString(36), lang: a.lang, text: U.plainText(it.text), date: U.today(), self: ratings, recorded: !!a.blob };
    if (a.blob) {
      const ok = await ST.storage.putRec(entry.id, a.blob); entry.recorded = ok;
      s.rec.push(entry); while (s.rec.length > 40) { const old = s.rec.shift(); ST.storage.delRec(old.id); }
    } else { s.rec.push(entry); if (s.rec.length > 40) s.rec.shift(); }
    A.xp(6, 'shadow');
    a.i++; a.step = 'model'; a.blob = null;
    if (a.i >= a.items.length) { A.subjectTouch(subjOf(a.lang)); A.save(); const o = a.opts; ST.audio.stop(); A.back(); A.toast('Shadowing completato (autovalutato)'); done(o); return; }
    A.render();
  };

  /* ---------- Risposta spontanea ---------- */
  X.startSpeak = (lang, opts) => {
    const ts = (opts && opts.topic) ? [C.topic(opts.topic)] : L.studied(lang);
    const pool = ts.flatMap(t => (t.speaking || []).map(s => Object.assign({ topic: t.id }, s)));
    if (!pool.length) { A.toast('Nessuna consegna disponibile.'); return; }

  V.speak = () => {
    const a = A.act, it = a.item;
    let h = '<div class="row"><button class="btn alt sm" data-act="speak-quit">← Esci</button></div><h1>💬 Risposta spontanea</h1><div class="card"><p class="big" style="font-size:1.2rem">' + U.ruby(it.prompt) + '</p><p class="mute small">Rispondi ad alta voce senza leggere. 30–60 secondi. Se ti blocchi, continua con parole più semplici.</p></div>';

      '<div class="card"><h3>Autovalutazione</h3>' + ['Ho risposto alla consegna', 'Ho usato le strutture della lezione', 'Ho parlato senza lunghe pause (>3 s)', 'Mi sono corretto quando sbagliavo'].map((t, i) => '<label class="row" style="margin:6px 0"><input type="checkbox" class="chk" data-i="' + i + '" style="width:22px;height:22px"> <span>' + t + '</span></label>').join('') +
      '<p class="warn small">Parlato e pronuncia vanno verificati periodicamente con un docente o un madrelingua: questa è solo autovalutazione.</p><button class="btn block" data-act="speak-done">Salva</button></div>';
    return h;
  };
  X['speak-quit'] = () => { ST.audio.stop(); A.back(); };

  X['speak-mine'] = () => { if (A.act.blob) ST.audio.playBlob(A.act.blob); };
  X['speak-done'] = async () => {

    if (a.blob) { entry.recorded = await ST.storage.putRec(entry.id, a.blob); }

  /* ---------- Scrittura e lettura ---------- */

  V.write = () => {
    const a = A.act, it = a.item;
    return '<div class="row"><button class="btn alt sm" data-act="back">← Esci</button></div><h1>✏️ Scrittura autonoma</h1><div class="card"><p>' + U.ruby(it.prompt) + '</p><p class="mute small">Scrivi 6–10 frasi, senza tradurre da un testo. Poi confronta con il modello.</p></div>' +
      '<textarea id="wtxt" placeholder="Scrivi qui…"></textarea><p class="mute small" id="wcount">0 parole</p>' +
      '<div class="card"><h3>Lista di controllo</h3>' + ['Ho risposto alla consegna', 'Ho controllato tempi verbali e accordi', 'Ho usato almeno due connettori/strutture della lezione', 'Ho riletto e corretto'].map((t, i) => '<label class="row" style="margin:6px 0"><input type="checkbox" class="chk" style="width:22px;height:22px"> <span>' + t + '</span></label>').join('') + '</div>' +
      '<div class="card"><button class="btn alt sm" data-act="write-model">Mostra testo modello</button><div id="wmodel"></div></div>' +

  X.startReading = (lang, opts) => {

  V.read = () => {

      '<button class="btn block" data-act="read-go">Rispondi alle domande →</button>';
  };
  X['read-go'] = () => {
    const a = A.act, ps = a.passage; A.stack.pop();
    R.start({ title: 'Lettura · ' + ps.title, kind: 'read', ctx: a.lang, items: ps.qs.map(q => ({ t: 'mc', q: q.q, o: q.o, a: q.a, why: q.why || '', srcLabel: q.kind === 'implicit' ? 'Informazione implicita (inferenza)' : 'Informazione esplicita' })),
      onAnswer: (it, ok) => A.xp(ok ? 5 : 1, 'read'),
      onFinish: res => { const m = A.state.readSeen; m[ps.id] = { n: ((m[ps.id] || {}).n || 0) + 1, last: U.today() }; A.subjectTouch(subjOf(a.lang)); A.save(); return ''; },
      after: () => done(a.opts) });
  };

  X.startConvo = (lang, opts) => {
    const pool = C.dialogues.filter(d => d.lang === lang);
    const seen = A.state.convoSeen = A.state.convoSeen || {};
    const d = leastUsed(pool, 'id', seen);
    A.act = { kind: 'convo', d, node: d.start, score: 0, max: 0, lang, opts, fb: null, log: [] };

  V.convo = () => {
    const a = A.act, n = a.d.nodes[a.node];
    if (a.node === 'end') {
      const pct = Math.round(100 * a.score / Math.max(1, a.max));
      return '<div class="card glow center"><h1>' + E(a.d.title) + '</h1><div class="big">' + pct + '%</div><p class="mute">Autovalutazione guidata sulle tue scelte (2 = naturale, 1 = accettabile, 0 = da migliorare)</p></div><div class="card">' + a.log.map(l => '<p><b>' + U.ruby(l.t) + '</b><br><span class="mute small">' + E(l.fb) + '</span></p>').join('') + '</div><button class="btn block" data-act="convo-close">Fine</button>';

    return '<div class="row"><button class="btn alt sm" data-act="back">← Esci</button></div><h1>🗨️ ' + E(a.d.title) + '</h1><p class="mute small">Livello ' + E(a.d.level) + ' · scegli la risposta migliore e poi <b>pronunciala ad alta voce</b>.</p>' +

      (a.fb ? '<div class="fb info">' + E(a.fb) + '</div><button class="btn block" style="margin-top:10px" data-act="convo-next">Continua →</button>' : n.c.map((c, i) => '<button class="opt" data-act="convo-pick" data-i="' + i + '">' + U.ruby(c.t) + '</button>').join(''));

  X['convo-say'] = () => { const a = A.act; if (!a || a.kind !== 'convo' || A.view().name !== 'convo') return; const n = a.d.nodes[a.node]; if (!n) return; ST.audio.speak(n.p, { lang: ttsLang(a.lang, a.d.accent) }).then(r => { if (!r.ok) A.toast(ST.audio.explain(r.reason), 4500); }); };
  ST.after.convo = () => { const a = A.act; if (a && a.node !== 'end' && !a.fb) setTimeout(() => X['convo-say'](), 300); };
  X['convo-pick'] = el => { const a = A.act, n = a.d.nodes[a.node], c = n.c[+el.dataset.i]; a.score += c.q; a.max += 2; a.fb = '(' + c.q + '/2) ' + c.fb; a.pending = c.next; a.log.push({ t: c.t, fb: c.fb }); A.render(); };

  X['convo-close'] = () => {
    const a = A.act, m = A.state.convoSeen; m[a.d.id] = { n: ((m[a.d.id] || {}).n || 0) + 1, last: U.today() };

  /* ---- Diagnostica audio ---- */
  V.audioTest = () => '<div class="row"><button class="btn alt sm" data-act="back">← Indietro</button></div><h1>🔊 Diagnostica audio</h1><p class="mute small">Verifica sul tuo dispositivo reale: i test automatici non possono garantire l’audio su Android.</p><div id="diag" class="card">Analisi in corso…</div>' +
    '<div class="card"><h3>Prova voci</h3><div class="grid2"><button class="btn alt" data-act="say" data-lang="en-GB" data-text="Hello, this is a British English test.">en-GB</button><button class="btn alt" data-act="say" data-lang="en-US" data-text="Hello, this is an American English test.">en-US</button><button class="btn alt" data-act="say" data-lang="en-AU" data-text="Hello, this is an Australian English test.">en-AU</button><button class="btn alt" data-act="say" data-lang="ja-JP" data-text="こんにちは。これは日本語のテストです。">ja-JP</button></div></div>' +
    '<div class="card"><h3>Microfono</h3><button class="btn alt" data-act="mic-test">Prova registrazione (3 s)</button><p id="mic-out" class="mute small"></p></div>';
  ST.after.audioTest = async () => {
    const d = await ST.audio.diagnose(), el = A.$('#diag'); if (!el) return;
    const row = (k, v, ok) => '<tr><td>' + k + '</td><td><span class="tag ' + (ok ? 'good' : 'bad') + '">' + E(String(v)) + '</span></td></tr>';
    el.innerHTML = '<table class="t">' + row('Protocollo', d.protocol, d.protocol !== 'file:') + row('Contesto sicuro', d.secure ? 'sì' : 'no', d.secure) + row('Sintesi vocale', d.tts ? 'disponibile' : 'assente', d.tts) + row('Voci installate', d.voices.length, d.voices.length > 0) +
      ['en-GB', 'en-US', 'en-AU', 'ja-JP'].map(l => row('Voce ' + l, d.langs[l] || 'non trovata (si userà la più vicina)', !!d.langs[l])).join('') + row('Microfono (getUserMedia)', d.mic ? 'sì' : 'no', d.mic) + row('Registrazione (MediaRecorder)', d.recorder ? 'sì' : 'no', d.recorder) + '</table>' +
      (!d.voices.length ? '<p class="warn small">Nessuna voce rilevata. Su Android: Impostazioni → Sistema → Lingua → Sintesi vocale → installa i dati voce (Google). Poi riapri Chrome.</p>' : '') +
      (d.protocol === 'file:' ? '<p class="warn small">File locale (file://): il microfono può richiedere il permesso a ogni utilizzo e alcuni browser limitano le funzioni. Se possibile, servi il file via https.</p>' : '');
  };
  X['mic-test'] = async () => { const out = A.$('#mic-out'); try { out.textContent = 'Registrazione…'; await ST.audio.rec.start(); await new Promise(r => setTimeout(r, 3000)); const b = await ST.audio.rec.stop(); out.textContent = 'Registrato ' + Math.round(b.size / 1024) + ' KB. Riproduzione…'; const r = await ST.audio.playBlob(b); out.textContent = r.ok ? 'Riproduzione completata ✓' : 'Riproduzione non riuscita'; } catch (e) { out.textContent = e.message; } };
})(window.ST = window.ST || {});

/* ---- ui/boot ---- */
(function (ST) {
  'use strict';
  const start = () => ST.app.init().catch(e => {
    console.error(e);
    document.getElementById('app').innerHTML = '<div class="card"><h2>Errore di avvio</h2><p>' + String(e && e.message).replace(/</g, '&lt;') + '</p></div>';
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(window.ST = window.ST || {});

</script>
</body>
</html>
