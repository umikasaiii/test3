<title>SkillTree Academy</title>
<style>

:root[data-theme="ocean"]{--bg:#031318;--bg2:#06232b;--card:#0a2f38;--card2:#0f3c47;--line:#1d5563;--acc:#2fd0c3;--acc2:#6ab7ff;--glow:#2fd0c355}
:root[data-theme="sunset"]{--bg:#150a14;--bg2:#241022;--card:#2e1630;--card2:#3b1d3d;--line:#5d2f5f;--acc:#ff7aa8;--acc2:#ffb347;--glow:#ff7aa855}
:root[data-theme="light"]{--bg:#f3f5fb;--bg2:#e6eaf6;--card:#ffffff;--card2:#eef1fb;--line:#c9d1ea;--text:#141a33;--mute:#4f5b82;--acc:#4c5cff;--acc2:#0aa2c0;--good:#14935f;--bad:#d1304b;--warn:#b57600;--glow:#4c5cff33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:72px}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:1.45rem;margin:.2em 0}h2{font-size:1.15rem;margin:.9em 0 .4em}h3{font-size:1rem;margin:.8em 0 .3em}
p{margin:.5em 0}a{color:var(--acc2)}
ruby rt{font-size:.55em;color:var(--mute)}
.nofur ruby rt{display:none}
#top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg)e6);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 16px}
#top .row{display:flex;align-items:center;gap:10px;font-size:.85rem}
#top .lv{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:10px;padding:2px 10px;font-weight:700}
#top .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
#top .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
#top .sub{display:flex;justify-content:space-between;color:var(--mute);font-size:.75rem;margin-top:3px}
main{padding:12px 16px 24px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 6px;color:var(--mute);font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:1.25rem;font-weight:400;line-height:1}
nav.tabs button.on{color:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.glow{box-shadow:0 0 24px var(--glow)}
.card h3:first-child,.card h2:first-child{margin-top:0}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:700;border-radius:12px;padding:12px 16px;min-height:44px}
.btn.alt{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.mute{color:var(--mute);font-size:.88rem}.small{font-size:.8rem}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mute);margin-right:4px}
.tag.good{color:var(--good);border-color:var(--good)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.acc{color:var(--acc2);border-color:var(--acc2)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.item .ic{font-size:1.5rem;width:36px;text-align:center}.item .tx{flex:1;min-width:0}.item .tx b{display:block}.item .tx span{color:var(--mute);font-size:.82rem}
.item.done{border-color:var(--good)}.item.locked{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}

.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}

.reader ul{padding-left:20px}

.sayt{font-weight:600}
.pbar{position:sticky;top:78px;z-index:10;background:var(--bg);padding:6px 0}
.footnav{position:fixed;bottom:54px;left:0;right:0;z-index:15;background:var(--bg2);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;max-width:760px;margin:0 auto}
.footnav .btn{flex:1}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.opt.sel{border-color:var(--acc2)}.opt.ok{border-color:var(--good);background:#16432f}.opt.no{border-color:var(--bad);background:#4a1b26}
:root[data-theme="light"] .opt.ok{background:#d9f5e8}:root[data-theme="light"] .opt.no{background:#fde0e6}

textarea{min-height:140px}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px}.fb.ok{background:#16432f;border:1px solid var(--good)}.fb.no{background:#4a1b26;border:1px solid var(--bad)}.fb.info{background:var(--card2);border:1px solid var(--line)}

.chip.used{opacity:.3}

.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px;background:none;border:0;color:var(--mute)}.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.timer{font-size:2.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.phase{text-align:center;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto}

.big{font-size:2rem}.center{text-align:center}

.diff .m{background:#4a1b26}.diff .x{background:#4a3b0b}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}.kv dt{color:var(--mute)}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--card2);border:1px solid var(--acc2);padding:10px 16px;border-radius:99px;z-index:50;max-width:90%;box-shadow:0 6px 30px #0008}
@media (prefers-reduced-motion:no-preference){.hero .pulse{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.5}}}

<body>
<header id="top" aria-live="polite"></header>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Navigazione principale"></nav>
<noscript>SkillTree richiede JavaScript.</noscript>
<script>
/* ---- core/util ---- */
/* SkillTree — utilità comuni (nessuna dipendenza). */
(function (ST) {
  'use strict';

  // Orologio sostituibile: i test e le simulazioni sui 24 mesi lo sovrascrivono.
  ST.clock = { now: () => new Date() };

  const pad = n => String(n).padStart(2, '0');
  const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const U = ST.util = {};

  U.today = () => dstr(ST.clock.now());
  U.dstr = dstr;
  U.parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  U.addDays = (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return dstr(d); };
  U.diffDays = (a, b) => Math.round((U.parse(b) - U.parse(a)) / 864e5);
  // 0 = lunedì … 6 = domenica
  U.weekday = (s) => (U.parse(s || U.today()).getDay() + 6) % 7;
  // Mese di corso (1-based) rispetto alla data di inizio.
  U.monthIndex = (start, s) => {
    const a = U.parse(start), b = U.parse(s || U.today());
    let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
    if (b.getDate() < a.getDate()) m -= 1;
    return Math.max(1, m + 1);
  };

  U.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  U.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  U.clone = o => JSON.parse(JSON.stringify(o));

  // PRNG deterministico (mulberry32) per esercizi riproducibili nei test.
  U.rng = seed => {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.rand = Math.random;
  U.shuffle = (arr, r) => {
    r = r || U.rand;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  U.pick = (arr, r) => arr[Math.floor((r || U.rand)() * arr.length)];
  U.sample = (arr, n, r) => U.shuffle(arr, r).slice(0, n);

  /* Testo con ruby: [漢字|かんじ]. display → <ruby>, speech → lettura (per la TTS), plain → base. */
  const RUBY = /\[([^\]|]+)\|([^\]]+)\]/g;
  const SAY = /\{\{[a-zA-Z-]+\|([^}]+)\}\}/g;
  U.unsay = s => String(s).replace(SAY, '$1');
  U.ruby = s => U.esc(U.unsay(s)).replace(RUBY, (_, b, r) => '<ruby>' + b + '<rt>' + r + '</rt></ruby>');
  U.speechText = s => U.unsay(s).replace(RUBY, (_, b, r) => r);
  U.plainText = s => U.unsay(s).replace(RUBY, (_, b) => b);

  /* Mini-markup per le lezioni: paragrafi, **grassetto**, "- " elenchi, "> " esempi,
     {{lang|testo}} = frase con pulsante audio, [漢字|かな] = ruby. */
  U.markup = src => {
    const inline = t => {
      let s = U.esc(t);
      s = s.replace(/\{\{([a-zA-Z-]+)\|([^}]+)\}\}/g, (_, lang, txt) =>
        '<button class="say" data-act="say" data-lang="' + lang + '" data-text="' + U.esc(U.speechText(txt.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'))) + '" aria-label="Ascolta">🔊</button><span class="sayt">' + txt.replace(RUBY, (_, b, r) => '<ruby>' + b + '<rt>' + r + '</rt></ruby>') + '</span>');
      s = s.replace(RUBY, (_, b, r) => '<ruby>' + b + '<rt>' + r + '</rt></ruby>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      return s;
    };
    const out = [];
    let list = null, quote = null;
    const flush = () => {
      if (list) { out.push('<ul>' + list.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'); list = null; }
      if (quote) { out.push('<div class="ex">' + quote.map(x => '<p>' + inline(x) + '</p>').join('') + '</div>'); quote = null; }
    };
    String(src).split('\n').forEach(line => {
      const l = line.trim();
      if (!l) { flush(); return; }
      if (l.startsWith('- ')) { if (quote) flush(); (list = list || []).push(l.slice(2)); return; }
      if (l.startsWith('> ')) { if (list) flush(); (quote = quote || []).push(l.slice(2)); return; }
      flush();
      out.push('<p>' + inline(l) + '</p>');
    });
    flush();
    return out.join('');
  };

  // Normalizzazione per confronto di risposte digitate.
  U.norm = s => String(s).toLowerCase().normalize('NFKC')
    .replace(/[’‘`]/g, "'").replace(/[“”]/g, '"')
    .replace(/[.,!?;:。、！？「」]/g, ' ').replace(/\s+/g, ' ').trim();

  // Distanza di edit su parole, per il dettato (restituisce anche il diff).
  U.wordDiff = (ref, got) => {
    const a = U.norm(ref).split(' ').filter(Boolean), b = U.norm(got).split(' ').filter(Boolean);
    const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    const ops = [];
    let i = n, j = m;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) { ops.push({ w: a[i - 1], ok: true }); i--; j--; }
      else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) { ops.push({ w: b[j - 1], extra: true }); j--; }
      else { ops.push({ w: a[i - 1], missing: true }); i--; }
    }
    ops.reverse();
    const hit = dp[n][m];
    return { ops, score: n ? hit / Math.max(n, m) : 0, total: n };
  };
  // Dettato giapponese: confronto per caratteri (nessuno spazio tra le parole).
  U.charDiff = (ref, got) => {
    const a = Array.from(U.norm(U.speechText(ref)).replace(/\s/g, '')), b = Array.from(U.norm(got).replace(/\s/g, ''));
    const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    return { score: n ? dp[n][m] / Math.max(n, m) : 0, total: n };
  };
})(window.ST = window.ST || {});

/* ---- core/version ---- */
(function (ST) { 'use strict'; ST.VERSION = '1.0.0'; })(window.ST = window.ST || {});

/* ---- core/srs ---- */
/* SkillTree — ripetizione dilazionata adattiva.
   Un solo motore per carte teoriche, kana, errori linguistici e tecniche motorie.
   Ladder iniziale richiesta: 1, 3, 7, 14, 30 giorni; poi 60 e 120 come tetto di mantenimento.
   Nessun elemento esce mai dal sistema: l'intervallo massimo è finito. */
(function (ST) {
  'use strict';
  const U = ST.util;
  const SRS = ST.srs = {};

  SRS.LADDER = [1, 3, 7, 14, 30, 60, 120];
  SRS.MAX_INTERVAL = 120;

  // Voti: 0 = non ricordato / eseguito male, 1 = difficile, 2 = bene, 3 = facile.
  SRS.newCard = (extra) => Object.assign({
    step: 0, ease: 2.3, reps: 0, lapses: 0, streak: 0,
    due: U.today(), last: null, interval: 0, state: 'new', mode: 'recognition'
  }, extra || {});

  SRS.stateOf = c => {
    if (!c || c.reps === 0) return 'new';
    if (c.step >= 5 && c.streak >= 3) return 'consolidated';
    if (c.step >= 3) return 'consolidating';
    return 'learning';
  };

  /* Applica una valutazione. Restituisce una nuova carta (non muta l'originale). */
  SRS.review = (card, grade, today) => {
    today = today || U.today();
    const c = Object.assign({}, card);
    c.reps = (c.reps || 0) + 1;
    c.last = today;
    const L = SRS.LADDER;
    if (grade <= 0) {
      c.lapses = (c.lapses || 0) + 1;
      c.streak = 0;
      c.step = Math.max(0, (c.step || 0) - 2);   // un errore riporta indietro di due gradini
      c.ease = Math.max(1.3, c.ease - 0.2);
      c.interval = 1;                            // il giorno dopo: l'errore torna prima
    } else {
      const before = c.step || 0;
      if (grade === 1) c.ease = Math.max(1.3, c.ease - 0.1);
      if (grade >= 2) c.streak = (c.streak || 0) + 1;
      if (grade === 3) c.ease = Math.min(2.8, c.ease + 0.1);
      let adv = grade === 2 ? 1 : grade === 3 ? (c.streak >= 2 ? 2 : 1) : 0;   // salto solo dopo risposte buone ripetute
      c.step = Math.min(L.length - 1, before + adv);
      const earned = L[Math.min(L.length - 1, before + (adv === 2 ? 1 : 0))];   // intervallo guadagnato dal gradino di partenza
      const target = grade === 1 ? Math.max(1, Math.round(earned * 0.6)) : earned;
      c.interval = U.clamp(Math.round(target * U.clamp(c.ease / 2.3, 0.7, 1.2)), 1, SRS.MAX_INTERVAL);
    }
    c.due = U.addDays(today, c.interval);
    c.state = SRS.stateOf(c);
    // Richiamo attivo (digitare/produrre) dai 7 giorni in poi: prevenire il completamento passivo.
    c.mode = c.step >= 2 ? 'recall' : 'recognition';
    return c;
  };

  SRS.isDue = (c, today) => !c || c.reps === 0 ? false : c.due <= (today || U.today());
  SRS.overdueDays = (c, today) => c && c.due ? Math.max(0, U.diffDays(c.due, today || U.today())) : 0;

  /* Elementi dovuti, ordinati: più in ritardo e più fragili per primi. */
  SRS.dueList = (cards, today, filter) => {
    today = today || U.today();
    return Object.keys(cards).filter(id => (!filter || filter(id, cards[id])) && SRS.isDue(cards[id], today))
      .map(id => ({ id, card: cards[id], late: SRS.overdueDays(cards[id], today) }))
      .sort((a, b) => (b.late + (b.card.lapses || 0) * 0.5) - (a.late + (a.card.lapses || 0) * 0.5));
  };

  /* Conversione da autovalutazione 1–5 (qualità) e difficoltà percepita 1–5 a voto SRS. */
  SRS.gradeFromSelf = (quality, difficulty) => {
    let g = quality <= 2 ? 0 : quality === 3 ? 1 : quality === 4 ? 2 : 3;
    if (g >= 2 && difficulty >= 5) g -= 1;   // buona esecuzione ma percepita come molto faticosa
    return g;
  };
})(window.ST = window.ST || {});

/* ---- core/progress ---- */
/* SkillTree — XP, livello generale e stato di padronanza.
   Quattro piani distinti, mai fusi in un solo numero:
   1. XP / partecipazione   2. completamento (lezione, esercizi)
   3. conoscenza verificata (test dilazionato)   4. mantenimento (ritest a distanza).
   La competenza pratica (lingua parlata, judo con partner) NON è derivabile da XP né da quiz. */
(function (ST) {
  'use strict';
  const U = ST.util;
  const P = ST.progress = {};

  P.MAX_LEVEL = 100;
  // XP cumulativi per raggiungere il livello n (n=1 → 0). Livello 100 ≈ 107k XP.
  P.xpForLevel = n => n <= 1 ? 0 : Math.round(55 * Math.pow(n - 1, 1.65));
  P.levelInfo = xp => {
    let lv = 1;
    while (lv < P.MAX_LEVEL && xp >= P.xpForLevel(lv + 1)) lv++;
    const base = P.xpForLevel(lv), next = lv >= P.MAX_LEVEL ? base : P.xpForLevel(lv + 1);
    return { level: lv, xp, into: xp - base, span: next - base, remaining: Math.max(0, next - xp), pct: lv >= P.MAX_LEVEL ? 100 : Math.round(100 * (xp - base) / (next - base)) };
  };

  P.DAILY_XP_CAP = 450;
  /* Assegna XP con tetto giornaliero e rendimenti decrescenti sulla stessa attività. */
  P.award = (state, amount, key) => {
    const day = U.today();
    state.xpLog = state.xpLog || {};
    const used = state.xpLog[day] || 0;
    const seen = (state.xpKeys = state.xpKeys || {});
    const k = day + '|' + (key || '');
    const n = seen[k] = (seen[k] || 0) + 1;
    let gain = Math.round(amount / Math.pow(1.6, n - 1));
    gain = Math.max(0, Math.min(gain, P.DAILY_XP_CAP - used));
    state.xp = (state.xp || 0) + gain;
    state.xpLog[day] = used + gain;
    return gain;
  };

  /* Stato di un argomento. Ordine crescente di garanzia:
     new < studied < practiced < verified < retained */
  P.STATUS = ['new', 'studied', 'practiced', 'verified', 'retained'];
  P.statusLabel = { new: 'Da iniziare', studied: 'Lezione letta', practiced: 'Esercitato', verified: 'Verificato', retained: 'Mantenuto' };

  P.topicRec = (state, id) => (state.topics[id] = state.topics[id] || { page: 0, studied: null, ex: {}, tests: [], retests: [] });

  P.PASS = 0.8;
  P.topicStatus = (state, id) => {
    const t = state.topics[id];
    if (!t || !t.studied) return 'new';
    // Verifica valida solo se svolta almeno 1 giorno dopo la lezione (no "studio e test nella stessa seduta").
    const valid = (t.tests || []).filter(x => x.score >= P.PASS && U.diffDays(t.studied, x.date) >= 1);
    if (valid.length) {
      const firstOk = valid[0].date;
      const re = (t.retests || []).some(x => x.score >= P.PASS && U.diffDays(firstOk, x.date) >= 14);
      return re ? 'retained' : 'verified';
    }
    const correct = Object.values(t.ex || {}).filter(e => e.ok).length;
    const def = ST.content && ST.content.topic(id), total = def ? def.exercises.length : 5;
    return correct >= Math.min(5, total) ? 'practiced' : 'studied';
  };
  /* Ritest dovuto: argomento verificato da ≥14 giorni senza ritest superato. */
  P.retestDue = (state, subjectId, date) => {
    date = date || U.today();
    return (ST.content.order[subjectId] || []).filter(id => {
      const t = state.topics[id];
      if (!t || P.topicStatus(state, id) !== 'verified') return false;
      const first = (t.tests || []).find(x => x.score >= P.PASS && U.diffDays(t.studied, x.date) >= 1);
      return first && U.diffDays(first.date, date) >= 14;
    });
  };
  P.atLeast = (s, min) => P.STATUS.indexOf(s) >= P.STATUS.indexOf(min);
})(window.ST = window.ST || {});

/* ---- core/plan ---- */
/* SkillTree — pianificazione giornaliera da 60 minuti: inglese + giapponese + generale (15').
   La distribuzione dipende dal PROGRESSO verificato, non solo dal calendario. */
(function (ST) {
  'use strict';
  const U = ST.util, P = ST.progress;
  const PL = ST.plan = {};

  PL.TOTAL = 60;
  PL.GENERAL = 15;
  PL.LANG_TOTAL = 45;
  const SKILLS = ['listening', 'reading', 'speaking', 'writing'];
  PL.SKILLS = SKILLS;

  /* Cancelli B2 per abilità.
     - Ascolto/lettura: indicatore in-app (≥6 prove B2 distinte, ≥3 giorni diversi, media ≥75%).
     - Parlato/scrittura: richiedono evidenza ESTERNA (docente/esame): l'autovalutazione non basta.
     - Qualsiasi abilità può essere confermata da evidenza esterna registrata dall'utente. */
  PL.gateStatus = (state, skill) => {
    const g = state.gates && state.gates.en && state.gates.en[skill];
    if (g && g.evidence && g.evidence.length) return 'external';
    if (skill === 'listening' || skill === 'reading') {
      const ex = (state.exams || []).filter(e => e.lang === 'en' && e.level === 'B2' && e.skill === skill && e.kind === 'gate');
      const ids = new Set(ex.map(e => e.item));
      const days = new Set(ex.map(e => e.date));
      const avg = ex.length ? ex.reduce((a, e) => a + e.score, 0) / ex.length : 0;
      if (ids.size >= 6 && days.size >= 3 && avg >= 0.75) return 'in-app';
      return ex.length ? 'partial' : 'none';
    }
    return 'none';
  };
  PL.b2Verified = state => SKILLS.every(s => ['external', 'in-app'].includes(PL.gateStatus(state, s)));
  PL.b2Report = state => SKILLS.map(s => ({ skill: s, status: PL.gateStatus(state, s) }));

  PL.englishStageVerified = (state, stage) => {
    const subj = ST.content.subject('eng');
    if (!subj) return false;
    const st = subj.stages.find(x => x.id === stage);
    if (!st) return false;
    return st.topics.every(id => P.atLeast(P.topicStatus(state, id), 'verified'));
  };

  PL.minutes = (state, date) => {
    date = date || U.today();
    const mo = U.monthIndex(state.startDate || date, date);
    let en, ja, phase, note = '';
    const b2 = PL.b2Verified(state);
    if (mo <= 8) { en = 25; ja = 20; phase = 'Mesi 1–8'; }
    else if (mo <= 16) {
      phase = 'Mesi 9–16';
      if (PL.englishStageVerified(state, 'L2')) { en = 20; ja = 25; }
      else { en = 25; ja = 20; note = 'Inglese mantenuto a 25′: lo stage L2 (B1+) non è ancora verificato.'; }
    } else {
      phase = 'Mesi 17–24';
      if (b2) { en = 15; ja = 30; }
      else {
        en = PL.englishStageVerified(state, 'L4') ? 20 : 25; ja = PL.LANG_TOTAL - en;
        note = 'B2 non verificato su tutte e quattro le abilità: la fase 3 (inglese 15′ / giapponese 30′) non si applica.';
      }
    }
    return { month: mo, phase, en, ja, general: PL.GENERAL, total: en + ja + PL.GENERAL, b2, note };
  };

  // Rotazione teorica (5′) — lunedì = 0.
  PL.THEORY = ['cyber', 'sport', 'prog', 'f1', 'cyberlab', 'strategy', 'secondary'];
  PL.THEORY_LABEL = { cyber: 'Cybersecurity', sport: 'Scienze dello sport', prog: 'Programmazione e AI', f1: 'Formula 1', cyberlab: 'Cybersecurity pratica · scenari', strategy: 'Strategia e logica', secondary: 'Materie secondarie' };
  PL.JUDO_SLOT = ['intro', 'consolidate', 'movement', 'variant', 'random', 'combo', 'theory'];
  PL.JUDO_LABEL = {
    intro: 'Introduzione o perfezionamento di una tecnica', consolidate: 'Consolidamento del movimento',
    movement: 'Tai sabaki, footwork, equilibrio e coordinazione', variant: 'Ripasso con variante',
    random: 'Richiamo casuale di tecniche precedenti', combo: 'Combinazioni e mini-verifica motoria',
    theory: 'Solo teoria e osservazione · riposo fisico'
  };

  // Focus linguistico per giorno della settimana.
  PL.LANG_FOCUS = {
    en: ['lesson', 'listening', 'grammar', 'speaking', 'dictation', 'writing', 'conversation'],
    ja: ['lesson', 'listening', 'grammar', 'speaking', 'dictation', 'reading', 'conversation']
  };
  PL.FOCUS_LABEL = {
    lesson: 'Lezione e applicazione', listening: 'Ascolto senza trascrizione', grammar: 'Grammatica applicata e lessico',
    speaking: 'Shadowing e risposta orale', dictation: 'Dettato e lettura', writing: 'Scrittura autonoma e mini-verifica',
    reading: 'Lettura e scrittura funzionale', conversation: 'Conversazione ramificata e ripasso'
  };

  /* Costruisce i blocchi di una missione linguistica. I ripassi dovuti hanno la precedenza
     (fino al 30% del tempo): il nuovo materiale non copre mai i vecchi errori. */
  PL.languageBlocks = (state, lang, minutes, date) => {
    date = date || U.today();
    const wd = U.weekday(date), focus = PL.LANG_FOCUS[lang][wd];
    const due = ST.cards.dueCount(state, lang, date);
    const blocks = [];
    let left = minutes;
    if (due > 0) {
      const m = Math.min(Math.round(minutes * 0.3), Math.max(3, Math.ceil(due / 4)));
      blocks.push({ kind: 'review', minutes: m, label: 'Ripasso dilazionato', detail: due + ' elementi dovuti' });
      left -= m;
    }
    if (lang === 'ja' && ST.kana.needsTraining(state)) {
      blocks.push({ kind: 'kana', minutes: 3, label: 'Kana Trainer', detail: 'riconoscimento rapido · max 3′' });
      left -= 3;
    }
    const subj = lang === 'en' ? 'eng' : 'jpn';
    const lessonT = PL.nextLesson(state, subj), pracT = PL.practiceTopic(state, subj), testT = PL.pendingTest(state, subj, date);
    const split = (x, f) => [Math.round(x * f), x - Math.round(x * f)];
    const [l1, l2] = split(left, 0.5), [g1, g2] = split(left, 0.7), [s1, s2] = split(left, 0.55), [d1, d2] = split(left, 0.6), [c1, c2] = split(left, 0.65);
    const mainFocus = {
      lesson: lessonT ? [{ kind: 'lesson', topic: lessonT.id, minutes: l1, label: lessonT.title }, { kind: 'practice', topic: lessonT.id, minutes: l2, label: 'Esercizi: ' + lessonT.title }]
        : pracT ? [{ kind: 'practice', topic: pracT.id, minutes: g1, label: 'Esercizi: ' + pracT.title }, { kind: 'cards', minutes: g2, label: 'Lessico a recupero attivo' }] : [{ kind: 'cards', minutes: left, label: 'Lessico a recupero attivo' }],
      listening: [{ kind: 'listening', minutes: Math.round(left * 0.75), label: 'Ascolto attivo' }, { kind: 'speaking', minutes: left - Math.round(left * 0.75), label: 'Risposta orale' }],
      grammar: pracT ? [{ kind: 'practice', topic: pracT.id, minutes: g1, label: 'Grammatica: ' + pracT.title }, { kind: 'cards', minutes: g2, label: 'Lessico a recupero attivo' }] : [{ kind: 'cards', minutes: left, label: 'Lessico a recupero attivo' }],
      speaking: [{ kind: 'shadowing', minutes: s1, label: 'Shadowing e pronuncia' }, { kind: 'speaking', minutes: s2, label: 'Risposta spontanea' }],
      dictation: [{ kind: 'dictation', minutes: d1, label: 'Dettato' }, { kind: 'listening', minutes: d2, label: 'Ascolto' }],
      writing: [{ kind: 'writing', minutes: s1, label: 'Scrittura autonoma' }, { kind: 'test', topic: testT ? testT.id : undefined, minutes: s2, label: testT ? (P.topicStatus(state, testT.id) === 'verified' ? 'Ritest a distanza: ' : 'Verifica: ') + testT.title : 'Mini-verifica cumulativa' }],
      reading: [{ kind: 'reading', minutes: d1, label: 'Lettura funzionale' }, { kind: 'writing', minutes: d2, label: 'Scrittura funzionale' }],
      conversation: [{ kind: 'conversation', minutes: c1, label: 'Conversazione ramificata' }, { kind: 'cards', minutes: c2, label: 'Ripasso libero' }]
    }[focus];
    mainFocus.forEach(b => { if (b.minutes > 0) blocks.push(b); });
    return { focus, blocks };
  };

  /* Selezione degli argomenti: la lezione successiva non attende la verifica (che richiede ≥1 giorno),
     ma richiede i prerequisiti «esercitati». La verifica e i ritest hanno una coda a parte. */
  PL.unlocked = (state, topic) => (topic.prereq || []).every(id => P.atLeast(P.topicStatus(state, id), 'practiced'));
  PL.nextLesson = (state, subjectId) => ST.content.topicsOf(subjectId).find(t => P.topicStatus(state, t.id) === 'new' && PL.unlocked(state, t)) || null;
  PL.practiceTopic = (state, subjectId) => {
    const ts = ST.content.topicsOf(subjectId);
    return ts.find(t => P.topicStatus(state, t.id) === 'studied') || ts.slice().reverse().find(t => P.topicStatus(state, t.id) === 'practiced') || null;
  };
  PL.pendingTest = (state, subjectId, date) => {
    date = date || U.today();
    const due = P.retestDue(state, subjectId, date);
    const ts = ST.content.topicsOf(subjectId).filter(t => { const r = state.topics[t.id]; return r && r.studied && U.diffDays(r.studied, date) >= 1 && P.topicStatus(state, t.id) === 'practiced'; });
    return ts[0] || (due.length ? ST.content.topic(due[0]) : null);
  };
  PL.currentTopic = (state, subjectId) => PL.nextLesson(state, subjectId) || PL.pendingTest(state, subjectId) || PL.practiceTopic(state, subjectId);
})(window.ST = window.ST || {});

/* ---- core/kana ---- */
/* SkillTree — Kana Trainer: riconoscimento rapido di hiragana e katakana.
   Gli errori vengono riproposti più spesso (peso adattivo). Tempo massimo consigliato: 3′ al giorno. */
(function (ST) {
  'use strict';
  const U = ST.util;
  const K = ST.kana = {};

  const ROWS = {
    base: [
      ['あいうえお', 'a i u e o'], ['かきくけこ', 'ka ki ku ke ko'], ['さしすせそ', 'sa shi su se so'],
      ['たちつてと', 'ta chi tsu te to'], ['なにぬねの', 'na ni nu ne no'], ['はひふへほ', 'ha hi fu he ho'],
      ['まみむめも', 'ma mi mu me mo'], ['やゆよ', 'ya yu yo'], ['らりるれろ', 'ra ri ru re ro'], ['わを', 'wa wo'], ['ん', 'n']
    ],
    dakuten: [
      ['がぎぐげご', 'ga gi gu ge go'], ['ざじずぜぞ', 'za ji zu ze zo'], ['だぢづでど', 'da ji zu de do'],
      ['ばびぶべぼ', 'ba bi bu be bo'], ['ぱぴぷぺぽ', 'pa pi pu pe po']
    ],
    yoon: [
      ['きゃきゅきょ', 'kya kyu kyo'], ['しゃしゅしょ', 'sha shu sho'], ['ちゃちゅちょ', 'cha chu cho'], ['にゃにゅにょ', 'nya nyu nyo'],
      ['ひゃひゅひょ', 'hya hyu hyo'], ['みゃみゅみょ', 'mya myu myo'], ['りゃりゅりょ', 'rya ryu ryo'], ['ぎゃぎゅぎょ', 'gya gyu gyo'],
      ['じゃじゅじょ', 'ja ju jo'], ['びゃびゅびょ', 'bya byu byo'], ['ぴゃぴゅぴょ', 'pya pyu pyo']
    ]
  };
  const toKata = s => Array.from(s).map(c => String.fromCharCode(c.charCodeAt(0) + 0x60)).join('');

  K.items = [];
  Object.keys(ROWS).forEach(group => ROWS[group].forEach(([chars, romaji]) => {
    const rs = romaji.split(' ');
    const cs = group === 'yoon' ? chars.match(/.[ゃゅょ]/g) : Array.from(chars);
    cs.forEach((c, i) => {
      K.items.push({ id: 'h:' + c, ch: c, ro: rs[i], script: 'hiragana', group });
      K.items.push({ id: 'k:' + toKata(c), ch: toKata(c), ro: rs[i], script: 'katakana', group });
    });
  }));
  K.byId = Object.fromEntries(K.items.map(i => [i.id, i]));

  /* Romaji → hiragana (per accettare risposte digitate su tastiera latina). */
  const R2H = {};
  K.items.filter(i => i.script === 'hiragana').forEach(i => { R2H[i.ro] = i.ch; });
  Object.assign(R2H, { si: 'し', ti: 'ち', tu: 'つ', hu: 'ふ', zi: 'じ', di: 'ぢ', du: 'づ', sya: 'しゃ', syu: 'しゅ', syo: 'しょ', tya: 'ちゃ', tyu: 'ちゅ', tyo: 'ちょ', zya: 'じゃ', zyu: 'じゅ', zyo: 'じょ', jya: 'じゃ', jyu: 'じゅ', jyo: 'じょ', ja: 'じゃ', ju: 'じゅ', jo: 'じょ', wo: 'を', "n'": 'ん', 'xtu': 'っ', 'ltu': 'っ' });
  K.toHiragana = input => {
    let s = String(input).toLowerCase().normalize('NFKC').trim();
    s = Array.from(s).map(c => { const cp = c.charCodeAt(0); return cp >= 0x30A1 && cp <= 0x30F6 ? String.fromCharCode(cp - 0x60) : c; }).join('');
    let out = '', i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[^a-z']/.test(c)) { out += c === 'ー' ? 'ー' : c; i++; continue; }
      if (c === 'n' && s[i + 1] === 'n') { out += 'ん'; i += /[aiueoy]/.test(s[i + 2] || '') ? 1 : 2; continue; }   // «nn»: ん (konnichi → こんにち)
      if (c === 'n' && (i + 1 === s.length || !/[aiueoy]/.test(s[i + 1]))) { out += 'ん'; i += (s[i + 1] === "'" ? 2 : 1); continue; }
      if (c === s[i + 1] && /[kstpcgzdbhfjmr]/.test(c)) { out += 'っ'; i++; continue; }
      let hit = false;
      for (const len of [3, 2, 1]) {
        const part = s.substr(i, len);
        if (R2H[part]) { out += R2H[part]; i += len; hit = true; break; }
      }
      if (!hit) { out += c; i++; }
    }
    // vocale lunga scritta "ou"/"oo" resta com'è: il confronto avviene sulla lettura kana.
    return out;
  };
  // Confronto tollerante: l'utente può rispondere in kana, katakana o romaji.
  K.sameReading = (answer, reading) => {
    const a = K.toHiragana(U.speechText(answer)).replace(/\s/g, '');
    const r = K.toHiragana(U.speechText(reading)).replace(/\s/g, '');
    return a === r || a.replace(/[ー]/g, '') === r.replace(/[ー]/g, '');
  };

  /* Stato per carattere: {n: prove, ok: corrette, streak, last, w: peso} */
  const rec = (state, id) => (state.kana.items[id] = state.kana.items[id] || { n: 0, ok: 0, streak: 0, last: null, w: 3 });
  K.accuracy = (state, group) => {
    const r = K.items.filter(i => !group || i.group === group).map(i => state.kana.items[i.id]).filter(Boolean);
    const n = r.reduce((a, x) => a + x.n, 0), ok = r.reduce((a, x) => a + x.ok, 0);
    return n ? ok / n : 0;
  };
  K.record = (state, id, correct) => {
    const r = rec(state, id);
    r.n++; r.last = U.today();
    if (correct) { r.ok++; r.streak++; r.w = Math.max(0.4, r.w * (r.streak >= 3 ? 0.6 : 0.8)); }
    else { r.streak = 0; r.w = Math.min(12, r.w * 2); }
  };
  /* Estrae n elementi con probabilità proporzionale al peso (errori più frequenti). */
  K.pickSet = (state, n, groups, rng) => {
    rng = rng || U.rand;
    const pool = K.items.filter(i => groups.includes(i.group));
    const picked = [];
    const left = pool.slice();
    while (picked.length < n && left.length) {
      const ws = left.map(i => (state.kana.items[i.id] ? state.kana.items[i.id].w : 3));
      const tot = ws.reduce((a, b) => a + b, 0);
      let x = rng() * tot, idx = 0;
      while (idx < ws.length - 1 && x > ws[idx]) { x -= ws[idx]; idx++; }
      picked.push(left.splice(idx, 1)[0]);
    }
    return picked;
  };
  K.question = (state, item, rng) => {
    rng = rng || U.rand;
    const same = K.items.filter(i => i.script === item.script && i.id !== item.id);
    const near = U.sample(same, 3, rng);
    const opts = U.shuffle([item].concat(near), rng);
    return { item, options: opts.map(o => o.ro), answer: opts.findIndex(o => o.id === item.id) };
  };
  /* Serve il trainer? Sì finché non c'è un test di posizionamento, poi solo se l'accuratezza cala. */
  K.needsTraining = state => {
    if (!state.kana.placed) return true;
    const acc = K.accuracy(state, 'base');
    const last = state.kana.lastSession;
    if (acc < 0.92) return !last || U.diffDays(last, U.today()) >= 1;
    return !last || U.diffDays(last, U.today()) >= 7;
  };
})(window.ST = window.ST || {});

/* ---- core/cards ---- */
/* SkillTree — carte di ripasso (lessico, frasi, errori) integrate con lo scheduler SRS.
   Una carta nasce quando l'argomento viene studiato oppure quando un esercizio viene sbagliato. */
(function (ST) {
  'use strict';
  const U = ST.util, S = ST.srs;
  const C = ST.cards = {};

  const langOf = subj => subj === 'eng' ? 'en' : subj === 'jpn' ? 'ja' : null;

  /* Crea le carte lessicali di un argomento (prima apparizione: dovute il giorno dopo). */
  C.introduceTopic = (state, topic) => {
    const lang = langOf(topic.subject);
    (topic.cards || []).forEach(cd => {
      const id = 'v:' + topic.id + ':' + cd.id;
      if (!state.cards[id]) state.cards[id] = S.newCard({ kind: 'vocab', lang, topic: topic.id, cid: cd.id, due: U.addDays(U.today(), 1), reps: 1, last: U.today(), interval: 1, step: 1, state: 'learning' });
    });
  };
  /* Un esercizio sbagliato torna domani (poi secondo ladder). Un esercizio giusto non crea carte. */
  C.registerError = (state, topic, exIdx) => {
    const id = 'x:' + topic.id + ':' + exIdx;
    const prev = state.cards[id];
    const card = prev ? S.review(prev, 0) : S.newCard({ kind: 'error', lang: langOf(topic.subject), topic: topic.id, ex: exIdx, reps: 1, lapses: 1, last: U.today(), interval: 1, due: U.addDays(U.today(), 1), step: 0, state: 'learning' });
    state.cards[id] = card;
  };
  C.dueCount = (state, lang, date) => S.dueList(state.cards, date || U.today(), (id, c) => !lang || c.lang === lang).length;
  C.dueIds = (state, lang, date) => S.dueList(state.cards, date || U.today(), (id, c) => !lang || c.lang === lang).map(x => x.id);

  /* Costruisce l'esercizio da mostrare per una carta. Recognition → scelta; recall → risposta digitata. */
  C.question = (state, id, rng) => {
    rng = rng || U.rand;
    const c = state.cards[id];
    if (!c) return null;
    const topic = ST.content.topic(c.topic);
    if (!topic) return null;
    if (c.kind === 'error') {
      const ex = topic.exercises[c.ex];
      return ex ? Object.assign({ cardId: id, srcLabel: 'Errore da ripassare · ' + topic.title }, ex) : null;
    }
    const cd = (topic.cards || []).find(x => x.id === c.cid);
    if (!cd) return null;
    const pool = (topic.cards || []).filter(x => x.id !== cd.id);
    const isJa = c.lang === 'ja';

/* ---- core/motor ---- */
/* SkillTree — scheduler motorio (judo/lotta). 5 minuti al giorno, solo esercizi solitari e sicuri.
   Registra per ogni tecnica: ultimo allenamento, richiami, difficoltà, qualità, errori ricorrenti,
   prossima data, stato e (separata) eventuale verifica di un istruttore.
   La valutazione autonoma NON è una validazione tecnica esterna. */
(function (ST) {
  'use strict';
  const U = ST.util, S = ST.srs, PL = ST.plan;
  const M = ST.motor = {};

  M.rec = (state, id) => state.motor[id];
  M.active = state => Object.keys(state.motor).filter(id => state.motor[id].introduced);
  M.defs = () => ST.content.judo.techniques;
  M.def = id => ST.content.judo.techniques.find(t => t.id === id);

  M.mean = (rec, n) => {
    const l = (rec.log || []).slice(-n);
    return l.length ? l.reduce((a, x) => a + x.quality, 0) / l.length : 0;
  };

  /* Una nuova tecnica entra solo se: (1) il mese del corso lo consente, (2) le tecniche attive
     sono abbastanza stabili (media qualità ≥ 3 sugli ultimi 2 richiami), (3) sono passati ≥ 10 giorni
     dall'ultima introduzione, (4) al massimo 2 tecniche sono ancora in fase "learning". */
  M.nextToIntroduce = (state, date) => {
    date = date || U.today();
    const mo = U.monthIndex(state.startDate || date, date);
    const act = M.active(state).map(id => state.motor[id]);
    const next = M.defs().find(t => !state.motor[t.id] && mo >= t.minMonth);
    if (!next) return null;
    if (act.length) {
      const lastIntro = act.map(r => r.introduced).sort().pop();
      if (U.diffDays(lastIntro, date) < 10) return null;
      const learning = act.filter(r => r.card.state === 'learning' || r.card.state === 'new');
      if (learning.length > 2) return null;
      if (act.some(r => r.log.length >= 2 && M.mean(r, 2) < 3)) return null;
    }
    return next;
  };

  M.introduce = (state, techId, date) => {
    date = date || U.today();
    state.motor[techId] = { introduced: date, card: S.newCard({ due: U.addDays(date, 1) }), log: [], errors: {}, instructor: null };
    return state.motor[techId];
  };

  M.dueScore = (state, id, date) => {
    const r = state.motor[id];
    return (r.card.due <= date ? 1 : 0) * (1 + S.overdueDays(r.card, date)) * (1 + (r.card.lapses || 0) * 0.5);
  };

  /* Sceglie ciò che si fa oggi, secondo la rotazione settimanale approvata. */
  M.pickForDay = (state, date) => {
    date = date || U.today();
    const wd = U.weekday(date), slot = PL.JUDO_SLOT[wd];
    const act = M.active(state);
    const out = { slot, weekday: wd, items: [], intro: null, rest: wd === 6, reason: '' };
    if (slot === 'theory') { out.reason = 'Domenica: nessun lavoro fisico.'; return out; }
    const byDue = act.slice().sort((a, b) => M.dueScore(state, b, date) - M.dueScore(state, a, date));
    const newest = act.slice().sort((a, b) => state.motor[b].introduced.localeCompare(state.motor[a].introduced));
    const movement = act.filter(id => (M.def(id).tags || []).includes('movement'));
    const dueNow = act.filter(id => state.motor[id].card.due <= date);

    if (slot === 'intro') {
      const next = M.nextToIntroduce(state, date);
      if (next) { out.intro = next.id; out.items = [next.id]; out.reason = 'Nuova tecnica: ' + next.name; }
      else if (act.length) {
        const weak = act.slice().sort((a, b) => M.mean(state.motor[a], 3) - M.mean(state.motor[b], 3))[0];
        out.items = [weak]; out.reason = 'Perfezionamento: la tecnica con qualità media più bassa.';
      } else { const f = M.defs()[0]; out.intro = f.id; out.items = [f.id]; out.reason = 'Prima tecnica del percorso.'; }
    } else if (slot === 'consolidate') {
      const cur = newest.find(id => state.motor[id].card.state !== 'consolidated') || newest[0];
      if (cur) { out.items = [cur]; out.reason = 'Consolida la tecnica più recente non ancora consolidata.'; }
    } else if (slot === 'movement') {
      const pool = movement.length ? movement : act;
      const sorted = pool.slice().sort((a, b) => (state.motor[a].card.last || '').localeCompare(state.motor[b].card.last || ''));
      if (sorted.length) { out.items = sorted.slice(0, 2); out.reason = 'Spostamenti, equilibrio e tai sabaki: i meno allenati di recente.'; }

    } else if (slot === 'random') {
      // Richiamo casuale pesato: più in ritardo/più fragile = più probabile. Nessuna dimostrazione.
      const pool = act.slice();

      const stable = (ready.length >= 2 ? ready : act);
      const combo = (ST.content.judo.combos || []).find(c => c.ids.every(id => stable.includes(id)));
      out.items = combo ? combo.ids.slice() : U.sample(stable, Math.min(3, stable.length));
      out.combo = combo ? combo.name : 'Sequenza libera';
      out.reason = 'Combinazione e mini-verifica motoria.';
    }
    // Mai una sessione vuota: al primo giorno (o se il giorno non ha tecniche idonee) si parte dal repertorio.
    if (!out.items.length) {
      if (!act.length) { const f = M.defs()[0]; out.slot = 'intro'; out.intro = f.id; out.items = [f.id]; out.reason = 'Prima tecnica del percorso.'; }
      else { out.items = [byDue[0]]; out.reason = (out.reason || '') + ' Nessuna tecnica specifica per oggi: si ripassa la più in ritardo.'; }
      return out;
    }
    // Una tecnica scaduta non resta fuori: se la giornata non la include, si aggiunge (max 3 voci totali).
    const overdue = byDue.filter(id => dueNow.includes(id) && !out.items.includes(id) && state.motor[id].card.due < date);

    return out;
  };

  /* Suddivisione dei 300 secondi: si adatta a complessità, qualità recente e necessità di recupero. */
  M.phases = (state, techId) => {
    const t = M.def(techId), r = state.motor[techId];
    let p = { recall: 30, slow: 150, vary: 90, check: 30 };
    const q = r ? M.mean(r, 3) : 0, st = r ? r.card.state : 'new';
    if (!r || st === 'new' || q > 0 && q < 3) p = { recall: 30, slow: 180, vary: 60, check: 30 };
    else if (st === 'consolidated' && q >= 4) p = { recall: 45, slow: 75, vary: 135, check: 45 };

  };

  /* Registra una sessione. quality 1–5 (autovalutata), difficulty 1–5, errors: tag[]. */
  M.log = (state, techId, quality, difficulty, errors, date) => {
    date = date || U.today();
    const r = state.motor[techId];
    r.log.push({ date, quality, difficulty, errors: errors || [] });
    if (r.log.length > 200) r.log.shift();
    (errors || []).forEach(e => { r.errors[e] = (r.errors[e] || 0) + 1; });
    let grade = S.gradeFromSelf(quality, difficulty);
    // Un errore ricorrente (≥3 volte negli ultimi 5 richiami) limita l'allungamento dell'intervallo.
    const recent = r.log.slice(-5);
    const counts = {};
    recent.forEach(x => (x.errors || []).forEach(e => { counts[e] = (counts[e] || 0) + 1; }));
    const recurring = Object.keys(counts).filter(e => counts[e] >= 3);
    r.card = S.review(r.card, grade, date);
    if (recurring.length && r.card.interval > 7) { r.card.interval = 7; r.card.due = U.addDays(date, 7); }

  };

    state.motor[techId].instructor = { date: date || U.today(), note: note || '' };
  };

  /* Stadio motorio L0–L5 derivato dal progresso (non dai XP). */
  M.stage = (state, date) => {
    const mo = U.monthIndex(state.startDate || (date || U.today()), date);
    const act = M.active(state).map(id => ({ d: M.def(id), r: state.motor[id] }));
    const cons = act.filter(x => ['consolidating', 'consolidated'].includes(x.r.card.state)).length;

      { h: 'Il concetto', b: 'In italiano usiamo il presente per tutto. In inglese la scelta cambia il significato:\n\n> {{en-GB|I work in a bank.}} → è il mio lavoro, un fatto stabile.\n> {{en-GB|I am working on a report today.}} → è un’azione in corso, temporanea.\n\n**Present simple** = abitudini, fatti, stati stabili, orari.\n**Present continuous** = azioni in corso adesso, situazioni temporanee, cambiamenti in atto ({{en-GB|The weather is getting colder.}}).' },

      { h: 'Esempio guidato', b: 'Scegli la forma giusta: *«Listen! Someone ____ (knock) at the door. — Who ____ (it/be)? I ____ (not/expect) anyone.»*\n\n1. «Listen!» → azione in corso adesso → **is knocking**.\n2. «Who is it?» → be non cambia, domanda con inversione → **is it**.\n3. «I don’t expect» o «I’m not expecting»? Qui è un’attesa **in corso**: **I’m not expecting anyone** è la più naturale; ma {{en-GB|I don’t expect anyone}} sarebbe un fatto generale.\n\nControllo: la prima frase risponde a «che cosa succede ora?», quindi continuous.' },
      { h: 'Errori comuni', b: 'Errori tipici di chi parla italiano:\n\n- *I am agree* → {{en-GB|I agree.}} (agree è un verbo, non «essere d’accordo»)\n- *She works now* → {{en-GB|She is working now.}}\n- *Does she works?* → {{en-GB|Does she work?}} (la -s passa a does)\n- *I am knowing* → {{en-GB|I know.}}\n- *Do you can swim?* → {{en-GB|Can you swim?}} (i modali non vogliono do)\n- *He go to school by bus* → {{en-GB|He goes…}}' },

      { h: 'Obiettivo', b: 'In italiano «ho mangiato» e «mangiai» si scelgono per stile e regione. In inglese la scelta tra **past simple** e **present perfect** dipende dal **collegamento con il presente**.\n\nImparerai a decidere in tre domande.' },
      { h: 'Il concetto', b: '**Past simple**: l’azione è finita e il momento è indicato o chiaro.\n> {{en-GB|I visited Paris in 2019.}}\n> {{en-GB|She left an hour ago.}}\n\n**Present perfect** (have/has + participio): il passato conta ORA — esperienza, risultato, periodo non concluso.\n> {{en-GB|I have visited Paris three times.}} (esperienza)\n> {{en-GB|I’ve lost my keys.}} (e non li ho ancora)\n\nRegola pratica: se c’è un tempo **concluso** (yesterday, last week, in 2019, ago) → past simple. Mai present perfect con quegli indicatori.' },
      { h: 'Forme e indicatori', b: '**Past simple**: regolari -ed (worked, studied, stopped); irregolari da imparare (go → went, see → saw, buy → bought, have → had). Domanda/negazione con **did**: {{en-GB|Did you see it?}} / {{en-GB|I didn’t see it.}}\n\n**Present perfect**: have/has + participio: {{en-GB|She has finished.}} / {{en-GB|Have you ever been to Japan?}}\n\nIndicatori tipici:\n- **ever, never, just, already, yet, so far, recently** → present perfect\n- **for** + durata (for two years), **since** + punto di partenza (since 2022)\n- **ago, yesterday, last year, in 2020, when…?** → past simple' },
      { h: 'Per decidere', b: 'Tre domande, nell’ordine:\n\n1. C’è un tempo concluso nella frase (yesterday, in May, two days ago)? → **past simple**.\n2. Parlo di esperienza, risultato o periodo ancora aperto (this week, so far, ever)? → **present perfect**.\n3. Sto chiedendo *quando*? → **past simple** ({{en-GB|When did you arrive?}}).\n\nPer le situazioni che durano ancora: {{en-GB|I have lived here for ten years.}} (e vivo qui). Se non vivo più qui: {{en-GB|I lived there for ten years.}}' },
      { h: 'Esempio guidato', b: '*«I ____ (see) that film last week. Have you ____ (see) it?»*\n\n- «last week» = tempo concluso → past simple: **saw**.\n- «Have you…?» chiede un’esperienza, senza data → present perfect: **seen**.\n\nProva a rendere vera la frase con un tuo ricordo: *I saw it on Tuesday. Have you seen it yet?*\n\nControllo: se aggiungi «yesterday» alla seconda frase, deve diventare past simple: {{en-GB|Did you see it yesterday?}}' },
      { h: 'Errori comuni', b: '- *I have seen him yesterday* → {{en-GB|I saw him yesterday.}}\n- *I am here since Monday* → {{en-GB|I have been here since Monday.}}\n- *When have you arrived?* → {{en-GB|When did you arrive?}}\n- *I didn’t went* → {{en-GB|I didn’t go.}} (dopo did il verbo è base)\n- *I have been to Rome last year* → {{en-GB|I went to Rome last year.}}' },
      { h: 'Riepilogo', b: '- Tempo concluso o domanda *when* → past simple.\n- Esperienza, risultato, periodo aperto → present perfect.\n- for = durata, since = inizio.\n- Dopo did e didn’t: verbo base.\n\nI participi irregolari (been, seen, done, gone, written, taken…) vanno ripassati con le carte.' }
    ],
    exercises: [
      mc('Choose the correct sentence.', ['I have seen her yesterday.', 'I saw her yesterday.', 'I have saw her yesterday.', 'I did see her yesterday?'], 1, 'Yesterday = tempo concluso → past simple.'),
      fill('Complete: I ___ (live) here since 2020.', ['have lived', "'ve lived"], 'Since + punto di partenza, situazione ancora vera → present perfect.'),
      fill('Complete: ___ you ever been to Japan?', ['have'], 'Esperienza di vita: Have you ever…?'),
      mc('She ___ for the company for five years — she is still there.', ['worked', 'has worked', 'works since', 'did work'], 1, 'For + durata, ancora vera → present perfect.'),
      order('Metti in ordine', ['When', 'did', 'you', 'arrive', 'in', 'London'], 'When → past simple con did.'),
      mc('I ___ my wallet! Have you seen it?', ['lost', 'have lost', 'did lose', 'was losing'], 1, 'Risultato ancora attuale: non ce l’ho → present perfect.'),
      mc('We ___ to the cinema last Saturday.', ['have gone', 'went', 'go', 'have been going'], 1)
    ],
    test: [
      mc('Which sentence is correct?', ['I have finished my homework two hours ago.', 'I finished my homework two hours ago.', 'I finish my homework two hours ago.', 'I am finishing two hours ago.'], 1),
      fill('Complete: She ___ (not/arrive) yet.', ["hasn't arrived", 'has not arrived'], 'Yet con risultato atteso → present perfect.'),
      mc('How long ___ you ___ English?', ['did / study', 'have / studied', 'are / studying since', 'do / study'], 1, 'How long + situazione ancora in corso → present perfect.'),
      mc('I ___ him in 2018 but we have never spoken since.', ['have met', 'met', 'meet', 'was meeting'], 1)
    ],
    cards: [
      card('c1', 'fa (tempo)', 'ago', 'She left two hours ago.'), card('c2', 'già', 'already', 'I’ve already eaten.'), card('c3', 'ancora (non)', 'yet', 'He hasn’t called yet.'), card('c4', 'da (punto di partenza)', 'since', 'I’ve known her since 2015.'),
      card('c5', 'per (durata)', 'for', 'We’ve lived here for years.'), card('c6', 'finora', 'so far', 'So far, it’s been a good day.'), card('c7', 'perdere', 'to lose (lost)', 'I lost my keys.'), card('c8', 'esperienza', 'experience', 'He has a lot of experience.')
    ],
    listening: [{ id: 'l1', lang: 'en-US', title: 'Checking in', text: 'Hello, I made a booking last week under the name Hernandez. I’ve been travelling since six this morning and I haven’t eaten anything yet. Has my room been cleaned? Great. Oh, and I lost my charger on the train — has anybody handed one in? No? Okay, I’ll buy a new one. Thanks.',
      qs: [{ q: 'When did the guest make the booking?', o: ['This morning', 'Last week', 'Yesterday', 'Two hours ago'], a: 1, kind: 'explicit' }, { q: 'What is still true now?', o: ['He has eaten', 'He has found the charger', 'He has not eaten', 'He has not booked'], a: 2, kind: 'explicit' }, { q: 'What will he probably do about the charger?', o: ['Wait for the train company', 'Buy another one', 'Borrow one from the hotel', 'Do nothing'], a: 1, kind: 'implicit' }] }],
    dictation: [{ text: 'I haven’t eaten anything yet.', lang: 'en-US' }, { text: 'When did you arrive in London?', lang: 'en-GB' }, { text: 'She has lived here since 2020.', lang: 'en-AU' }],
    shadowing: [{ text: 'I’ve been travelling since six and I haven’t eaten yet.', lang: 'en-US', tip: 'Contrazioni: I’ve, haven’t. Non separare le parole: «I’ve-been-travelling».' }, { text: 'When did you last see her?', lang: 'en-GB', tip: 'Linking: «did you» scorre in «didyou».' }, { text: 'We’ve known each other for ten years.', lang: 'en-AU', tip: 'Ritmo a stress: known, other, ten, years.' }],
    speaking: [{ prompt: 'Tell me about a trip you made: where, when, with whom, and one thing you have never done there.', model: 'Last summer I went to Lisbon with my sister. We stayed for five days. I have never tried the famous custard tarts, but I want to go back for them.' }, { prompt: 'Say three things you have done this week and one thing you haven’t done yet.', model: 'I’ve studied every day, I’ve cooked dinner twice, and I’ve called my parents. I haven’t finished my book yet.' }]

  C.addTopic({
    id: 'eng-l1-modals', subject: 'eng', stage: 'L1', title: 'Modali: obbligo, consiglio, possibilità', minutes: 20, prereq: ['eng-l0-past'],
    summary: 'must, have to, should, might, can’t: sfumature di significato.',
    objectives: ['Distinguere must e have to nel significato e nella negazione', 'Dare consigli con should/ought to', 'Esprimere deduzione e possibilità: must be, might, can’t be'],
    pages: [
      { h: 'Obiettivo', b: 'I verbi modali non descrivono *che cosa succede*, ma **come lo vedi tu**: obbligo, consiglio, possibilità, deduzione.\n\nImparerai le differenze che contano davvero a livello B1+ e che spesso si sbagliano.' },
      { h: 'Il concetto', b: 'Tutti i modali hanno la stessa forma: **soggetto + modale + verbo base**, senza -s alla terza persona, senza do.\n> {{en-GB|She can swim.}} / {{en-GB|Can she swim?}} / {{en-GB|She can’t swim.}}\n\nPer ogni modale pensa a **che cosa esprime**:\n- must / have to / need to → obbligo\n- should / ought to → consiglio\n- can / could / may / might → possibilità o permesso\n- must be / can’t be → deduzione logica' },
      { h: 'Obbligo e divieto', b: '**must** = obbligo sentito da chi parla (o regola personale); **have to** = obbligo esterno (regole, circostanze).\n> {{en-GB|I must call my mum tonight.}} / {{en-GB|I have to wear a uniform at work.}}\n\n**Attenzione alla negazione:**\n- **mustn’t** = è vietato: {{en-GB|You mustn’t park here.}}\n- **don’t have to** = non è necessario: {{en-GB|You don’t have to come.}}\n\nPassato: must non ha passato → **had to**: {{en-GB|I had to leave early.}}' },
      { h: 'Consiglio, possibilità, deduzione', b: '**Consiglio**: should / shouldn’t / ought to. {{en-GB|You should see a doctor.}} Più forte: had better.\n\n**Possibilità**: may, might, could. {{en-GB|It might rain.}} (≈ 40%) {{en-GB|He could be at home.}}\n\n**Deduzione (certezza)**:\n- **must be** = sono quasi certo: {{en-GB|She must be tired.}}\n- **can’t be** = sono quasi certo che NON sia: {{en-GB|That can’t be true.}}\n- **might / could be** = è possibile.\n\nNota: per la deduzione NON si usa «mustn’t be» ma **can’t be**.' },
      { h: 'Esempio guidato', b: 'Situazione: l’autobus è in ritardo di 30 minuti e Maria non risponde.\n\n- Deduzione forte: *She must be stuck in traffic.* (tutti gli indizi lo suggeriscono)\n- Possibilità: *She might have forgotten.* (modali + have + participio per il passato)\n- Esclusione: *She can’t be at home — her car is here.*\n- Consiglio: *You should call her again.*\n\nControllo: se togli il modale, la frase diventa un fatto («She is stuck»). Il modale mostra quanto sei sicuro.' },
      { h: 'Errori comuni', b: '- *You mustn’t come* quando vuoi dire «non serve» → {{en-GB|You don’t have to come.}}\n- *She cans swim* → {{en-GB|She can swim.}}\n- *You should to go* → {{en-GB|You should go.}} (niente to dopo should; sì dopo ought: ought **to**)\n- *I must to go* → {{en-GB|I must go.}}\n- *He musts* → {{en-GB|He must / has to.}}' },
      { h: 'Riepilogo', b: '- Modale + verbo base, sempre.\n- must ≠ have to nella negazione: mustn’t (vietato) vs don’t have to (non necessario).\n- should = consiglio; might/could = possibilità; must be/can’t be = deduzione.\n- Passato dell’obbligo: had to.' }
    ],
    exercises: [
      mc('You ___ park here. It’s forbidden.', ['don’t have to', 'mustn’t', 'shouldn’t to', 'might not'], 1, 'Forbidden = divieto → mustn’t.'),
      mc('You ___ come tomorrow. The meeting is cancelled.', ['mustn’t', 'don’t have to', 'can’t be', 'ought'], 1, 'Non è necessario → don’t have to.'),
      fill('Complete: She’s been working since 6 a.m. She ___ be exhausted.', ['must'], 'Deduzione forte: must be.'),
      mc('That ___ be Tom! He is in Spain this week.', ['mustn’t', 'can’t', 'doesn’t', 'might not to'], 1, 'Deduzione negativa: can’t be.'),
      fill('Complete (past): Yesterday I ___ (must) leave early.', ['had to'], 'Passato di must: had to.'),
      mc('Which is correct?', ['She cans cook very well.', 'She can cooks very well.', 'She can cook very well.', 'She can to cook very well.'], 2),
      mc('You look ill. You ___ see a doctor.', ['should', 'must to', 'have', 'might to'], 0)
    ],
    test: [
      mc('«You mustn’t tell anyone» means…', ['It isn’t necessary to tell', 'It is forbidden to tell', 'It is possible to tell', 'You told someone'], 1),
      mc('It’s 3 a.m. and there are lights in the house. They ___ be awake.', ['must', 'mustn’t', 'don’t have to', 'should to'], 0),
      fill('Complete: You ___ to wear a helmet. It’s the law.', ['have'], 'Obbligo esterno: have to.'),
      mc('He ___ be at work — I saw him at the station five minutes ago.', ['must', 'can’t', 'should', 'has to'], 1)
    ],
    cards: [
      card('c1', 'vietato', 'forbidden', 'Smoking is forbidden here.'), card('c2', 'consigliare', 'to advise', 'I advise you to wait.'), card('c3', 'deduzione', 'deduction', 'This is a logical deduction.'), card('c4', 'sicuro', 'certain', 'I’m certain he left.'),
      card('c5', 'permesso', 'permission', 'You need permission to enter.'), card('c6', 'ritardo', 'delay', 'There’s a delay on the line.'), card('c7', 'stanco morto', 'exhausted', 'She looks exhausted.'), card('c8', 'regola', 'rule', 'It’s against the rules.')
    ],
    listening: [{ id: 'l1', lang: 'en-GB', title: 'At the office', text: 'You don’t have to stay for the whole meeting, Karen, but you should read the report before Friday. Oh, and you mustn’t share it outside the company — it’s confidential. I think Dan might present the results, though he could be on holiday, so please check with him. He can’t have left yet, his coat is still here.',
      qs: [{ q: 'What is NOT necessary for Karen?', o: ['Reading the report', 'Staying for the whole meeting', 'Checking with Dan', 'Sharing results'], a: 1, kind: 'explicit' }, { q: 'What is forbidden?', o: ['Reading it', 'Presenting results', 'Sharing the report outside the company', 'Talking to Dan'], a: 2, kind: 'explicit' }, { q: 'What does the speaker deduce at the end?', o: ['Dan is probably still in the building', 'Dan is on holiday', 'Dan took his coat', 'Dan will not present'], a: 0, kind: 'implicit' }] }],
    dictation: [{ text: 'You don’t have to stay for the whole meeting.', lang: 'en-GB' }, { text: 'She must be tired after the flight.', lang: 'en-US' }, { text: 'That can’t be true.', lang: 'en-AU' }],
    shadowing: [{ text: 'You mustn’t share it, but you don’t have to read it today.', lang: 'en-GB', tip: 'Contrasto: stress su mustn’t e don’t.' }, { text: 'He can’t have left yet — his coat is still here.', lang: 'en-US', tip: 'Can’t have → «can’t-have» fuso.' }, { text: 'It might rain, so you should take an umbrella.', lang: 'en-AU', tip: 'Might: /maɪt/; should: /ʃʊd/ debole.' }],
    speaking: [{ prompt: 'Give a friend three pieces of advice about starting a new job.', model: 'You should arrive early on the first day. You shouldn’t be afraid to ask questions. And you ought to learn your colleagues’ names quickly.' }, { prompt: 'Your neighbour’s light is on at 2 a.m. Say what might be happening and what you deduce.', model: 'He must be working late, or he might be ill. He can’t be asleep, because I can hear music.' }]
  });

  C.addTopic({
    id: 'eng-l1-future-cond', subject: 'eng', stage: 'L1', title: 'Futuro e condizionali reali', minutes: 20, prereq: ['eng-l1-modals'],
    summary: 'will, going to, present continuous per il futuro; first e second conditional.',
    objectives: ['Scegliere tra will, going to e present continuous', 'Costruire first e second conditional', 'Evitare will dopo if e when nelle frasi temporali'],
    pages: [
      { h: 'Obiettivo', b: 'Il futuro in inglese non ha un tempo unico. Scegli la forma in base a **che cosa sai** e **quando hai deciso**.\n\nPoi aggiungiamo il **condizionale**: «se succede X, succederà Y» (reale) e «se succedesse X, succederebbe Y» (ipotetico).' },
      { h: 'Tre forme di futuro', b: '- **will**: decisione al momento, previsione, promessa. {{en-GB|I’ll help you.}} {{en-GB|It will be sunny tomorrow.}}\n- **be going to**: intenzione già decisa o previsione con indizi visibili. {{en-GB|I’m going to apply for that job.}} {{en-GB|Look at those clouds — it’s going to rain.}}\n- **present continuous**: appuntamento già organizzato. {{en-GB|I’m meeting Anna at seven.}}\n\nOrario ufficiale (treni, programmi): present simple. {{en-GB|The train leaves at 9:15.}}' },
      { h: 'First conditional', b: 'Situazione reale o probabile nel futuro.\n\n**If + present simple, will + verbo base**\n> {{en-GB|If it rains, we’ll stay at home.}}\n> {{en-GB|If you study, you’ll pass.}}\n\n**Attenzione**: dopo *if*, *when*, *as soon as*, *before*, *unless* si usa il **present simple**, non will.\n> {{en-GB|I’ll call you when I arrive.}} (non *when I will arrive*)\n\n*Unless* = if … not. {{en-GB|Unless you hurry, you’ll miss the train.}}' },
      { h: 'Second conditional', b: 'Situazione immaginaria o improbabile ORA.\n\n**If + past simple, would + verbo base**\n> {{en-GB|If I won the lottery, I would buy a house.}}\n> {{en-GB|If I were you, I would apply.}}\n\nCon *be* si dice comunemente **were** per tutte le persone: *If I were you…* (also *If I was* nel parlato).\n\nIl passato qui NON indica passato: indica **distanza dalla realtà**. Confronta: first = «può succedere», second = «è poco probabile o irreale».' },
      { h: 'Esempio guidato', b: 'Scegli: *«If I (have) more time, I (learn) Japanese properly.»* → il tempo non c’è, è ipotetico → second conditional: **If I had more time, I would learn Japanese properly.**\n\nPer la stessa persona con un vero piano: *«If I finish early tonight, I (study) Japanese.»* → possibile → first: **If I finish early tonight, I’ll study Japanese.**\n\nControllo: chiediti «È realistico?» Sì → first. Irrealistico/immaginario → second.' },
      { h: 'Errori comuni', b: '- *If it will rain, we stay.* → {{en-GB|If it rains, we’ll stay.}}\n- *When I will see him, I tell him.* → {{en-GB|When I see him, I’ll tell him.}}\n- *If I would have money, I would buy it.* → {{en-GB|If I had money, I would buy it.}} (niente would nella parte con if)\n- *I go to see a film tonight* come progetto → {{en-GB|I’m going to see a film tonight.}} / {{en-GB|I’m seeing a film tonight.}}' },
      { h: 'Riepilogo', b: '- will = decisione, previsione, promessa. going to = intenzione/indizi. continuous = accordo preso.\n- First: if + present, will. Second: if + past, would.\n- Mai will/would subito dopo if.\n- Dopo when, as soon as, before, unless: present simple.' }
    ],
    exercises: [
      mc('Look at the sky! It ___ rain.', ['will', 'is going to', 'rains', 'would'], 1, 'Indizi visibili → going to.'),
      mc('«The phone is ringing.» — «I ___ get it.»', ['’ll', 'am going to', 'am getting', 'would'], 0, 'Decisione al momento → will.'),
      fill('Complete: If it ___ (rain), we’ll stay at home.', ['rains'], 'Dopo if: present simple.'),
      fill('Complete: If I ___ (be) you, I would apply.', ['were', 'was'], 'Second conditional con be: were/was.'),
      mc('I’ll call you when I ___ home.', ['will get', 'get', 'would get', 'am getting to'], 1, 'Dopo when: present simple.'),
      order('Metti in ordine', ['If', 'I', 'won', 'the', 'lottery', 'I', 'would', 'travel', 'the', 'world'], 'If + past simple, would + base.'),
      mc('Which sentence is a second conditional?', ['If I see her, I’ll tell her.', 'If I saw her, I would tell her.', 'If I had seen her, I would have told her.', 'If I see her, I told her.'], 1)
    ],
    test: [
      mc('Which is correct?', ['If I will see him, I’ll tell him.', 'If I see him, I’ll tell him.', 'If I would see him, I tell him.', 'If I saw him, I’ll tell him.'], 1),
      mc('I’m ___ the dentist at 4 o’clock tomorrow. It’s already arranged.', ['going see', 'seeing', 'will see', 'to see'], 1),
      fill('Complete: If she ___ (have) more money, she would travel more.', ['had'], 'Second conditional.'),
      mc('Unless you ___, you’ll miss the bus.', ['don’t hurry', 'hurry', 'won’t hurry', 'would hurry'], 1, 'Unless = if not: quindi niente negazione e present simple.')
    ],
    cards: [
      card('c1', 'a meno che', 'unless', 'Unless it rains, we’ll go.'), card('c2', 'appena', 'as soon as', 'Call me as soon as you arrive.'), card('c3', 'promettere', 'to promise', 'I promise I’ll be there.'), card('c4', 'previsione', 'forecast', 'The forecast says rain.'),
      card('c5', 'vincere (lotteria)', 'to win', 'If I won, I’d travel.'), card('c6', 'progetto', 'plan', 'We have a plan for the weekend.'), card('c7', 'perdere il treno', 'to miss the train', 'Hurry or you’ll miss the train.'), card('c8', 'intenzione', 'intention', 'My intention is to learn.')
    ],
    listening: [{ id: 'l1', lang: 'en-AU', title: 'Weekend plans', text: 'Right, so if the weather’s good on Saturday, we’ll go to the beach. If it rains, we’re going to visit the museum — I’ve already bought the tickets. I’m meeting Lucy at ten, so I’ll text you when I’m on my way. If I had a car, I’d pick you up, but I don’t, sorry!',
      qs: [{ q: 'What will they do if it’s sunny?', o: ['Visit the museum', 'Go to the beach', 'Stay home', 'Meet Lucy'], a: 1, kind: 'explicit' }, { q: 'Why does the speaker say «I’d pick you up»?', o: ['They have a car', 'They don’t have a car but imagine it', 'They will have a car tomorrow', 'They hate driving'], a: 1, kind: 'implicit' }, { q: 'When will the speaker text?', o: ['When Lucy arrives', 'On the way', 'Tomorrow', 'After the museum'], a: 1, kind: 'explicit' }] }],
    dictation: [{ text: 'If it rains, we’ll visit the museum.', lang: 'en-AU' }, { text: 'I’ll text you when I’m on my way.', lang: 'en-GB' }, { text: 'If I had more time, I would learn Japanese.', lang: 'en-US' }],
    shadowing: [{ text: 'If the weather’s good, we’ll go to the beach.', lang: 'en-AU', tip: 'Contrazioni: weather’s, we’ll. Ritmo veloce.' }, { text: 'I’ll text you when I’m on my way.', lang: 'en-GB', tip: 'Linking: «text you» → «textchu».' }, { text: 'If I won the lottery, I’d buy a small house.', lang: 'en-US', tip: 'Flapping americano del /t/ in «lottery».' }],
    speaking: [{ prompt: 'Describe your plans for next weekend, with one condition (if …).', model: 'I’m going to visit my cousin on Saturday. If the weather is nice, we’ll go for a walk. If it rains, we’ll watch a film.' }, { prompt: 'What would you do if you had a free year? Give three ideas.', model: 'If I had a free year, I would travel through Japan. I would also study full-time and I would learn to cook properly.' }]
  });

  C.addTopic({
    id: 'eng-l1-connected-speech', subject: 'eng', stage: 'L1', title: 'Parlato connesso: capire l’inglese veloce', minutes: 20, prereq: ['eng-l1-modals'],
    summary: 'Forme deboli, legami tra parole, riduzioni e ritmo dell’inglese naturale.',
    objectives: ['Riconoscere forme deboli e riduzioni (gonna, wanna, hafta)', 'Sentire i legami (linking) e le parole omesse', 'Usare strategie di ascolto senza trascrizione'],
    pages: [
      { h: 'Obiettivo', b: 'Spesso non capisci il parlato non perché non conosci le parole, ma perché **non suonano come le hai imparate**.\n\nQui ti alleni a riconoscere ciò che succede nel parlato veloce: parole che si fondono, vocali che si indeboliscono, ritmo basato sugli accenti.' },
      { h: 'Il ritmo: stress-timed', b: 'L’inglese è «stress-timed»: le sillabe accentate arrivano a intervalli regolari e le altre si comprimono.\n\n> {{en-GB|I WANT to BUY a NEW CAR.}}\n\nLe parole di contenuto (nomi, verbi, aggettivi, avverbi) sono accentate. Le parole funzionali (to, a, the, of, and, can, was) sono deboli: *to* → /tə/, *a* → /ə/, *of* → /əv/, *and* → /ən/.\n\nIn italiano ogni sillaba ha quasi la stessa durata: per questo l’inglese sembra «mangiare» le parole.' },
      { h: 'Linking e riduzioni', b: '**Legami**: consonante + vocale si fondono. {{en-GB|Pick it up.}} → «pi-ki-tup». {{en-GB|What are you doing?}} → «whatcha doing?»\n\n**Riduzioni comuni nel parlato informale** (non da scrivere in testi formali):\n- going to → **gonna**\n- want to → **wanna**; have to → **hafta**\n- give me → **gimme**; kind of → **kinda**\n- I would have → **I’d’ve / I would’ve**\n- do you → **d’you** ({{en-GB|D’you want some?}})\n\n**Elisione**: la /t/ e la /d/ finali spesso scompaiono prima di consonante: {{en-GB|Next week}} → «nex week».' },
      { h: 'Strategie di ascolto', b: 'Per allenare l’orecchio senza leggere:\n\n1. **Primo ascolto**: solo il senso generale (chi, dove, perché). Non fermarti sulle parole sconosciute.\n2. **Secondo ascolto**: cerca i dettagli richiesti dalle domande.\n3. **Terzo ascolto con trascrizione**: confronta con ciò che hai sentito e segna dove le parole si erano fuse.\n4. **Shadowing**: ripeti ad alta voce a mezza frase di distanza, copiando ritmo e intonazione.\n\nNon trascrivere tutto: il B2 richiede di capire **il messaggio**, anche con parole mancanti.' },
      { h: 'Esempio guidato', b: 'Ascolta: {{en-US|I’m gonna grab a coffee. D’you wanna come?}}\n\nCosa senti? «Ahm gonna grab a coffee. Joo wanna come?»\n\nAnalisi:\n- *I’m gonna* = I am going to\n- *D’you* = do you (la /d/ + y fondono in /dʒ/)\n- *wanna* = want to\n\nRiscrittura standard: *I’m going to grab a coffee. Do you want to come?*\n\nControllo: se riesci a ripetere la versione veloce con lo stesso ritmo, stai imparando a «pensare» alla velocità giusta.' },
      { h: 'Errori comuni', b: '- Tentare di sentire ogni parola: funziona solo con il parlato lento. Accetta di perdere le parole funzionali.\n- Scrivere «gonna» o «wanna» in un testo formale o in un esame scritto: è parlato.\n- Pronunciare ogni parola con accento pieno: suona robotico e rende più difficile anche capire.\n- Ascoltare sempre con i sottotitoli italiani: toglie l’allenamento dell’orecchio.' },
      { h: 'Riepilogo', b: '- Ritmo: parole di contenuto accentate, parole funzionali deboli.\n- Linking: le parole si fondono; non contare gli spazi.\n- Riduzioni: gonna, wanna, hafta, d’you, I’d’ve — solo parlato.\n- Ascolta in 3 passaggi, poi shadowing.' }

      { h: 'Il backshift', b: 'Se il verbo di riporto è al passato (said, told), il tempo della frase riportata di solito **arretra di un gradino**:\n\n- present simple → past simple: «I **work** here» → She said she **worked** here.\n- present continuous → past continuous: «I’m **leaving**» → He said he **was leaving**.\n- past simple → past perfect: «I **saw** it» → She said she **had seen** it.\n- present perfect → past perfect\n- will → would; can → could; may → might\n\nCambiano anche i riferimenti: here → there, now → then, today → that day, tomorrow → the next day, ago → before.\n\nSe il fatto è ancora vero, il backshift è facoltativo: {{en-GB|She said she lives in Rome.}}' },
      { h: 'Verbi di riporto', b: 'Say e tell non sono intercambiabili: **tell** richiede un oggetto (*told me*), **say** no.\n> {{en-GB|She told me she was tired.}} / {{en-GB|She said she was tired.}}\n\nVerbi che riassumono l’atto comunicativo e hanno strutture proprie:\n- **suggest** + -ing / that: {{en-GB|He suggested going out.}}\n- **promise / offer / refuse / agree** + to + base: {{en-GB|She promised to call.}}\n- **admit / deny / apologise for** + -ing: {{en-GB|He admitted breaking the window.}}\n- **ask / tell / warn / advise** + oggetto + to: {{en-GB|He told me not to worry.}}\n\nQuesti verbi rendono il riporto più naturale di un lungo «he said that…».' },
      { h: 'Domande riportate e indirette', b: 'Nelle domande riportate l’ordine è **da frase affermativa** e non c’è do/does:\n\n- «Where do you live?» → She asked me **where I lived.**\n- «Are you ready?» → He asked **if/whether I was ready.**\n\nLe **domande indirette** (educate) funzionano allo stesso modo:\n> {{en-GB|Could you tell me where the station is?}} (non *where is the station*)\n> {{en-GB|Do you know what time it starts?}}\n> {{en-GB|I wonder whether she’s coming.}}\n\nQuando c’è una frase introduttiva, la domanda perde l’inversione.' },
      { h: 'Esempio guidato', b: '*«I’m going to quit my job next month,» Marco told me yesterday.* Riporta.\n\n1. Verbo di riporto passato → backshift: *am going to* → **was going to**.\n2. *my* → **his**; *next month* → **the following month**; (yesterday resta se il riferimento è chiaro, oppure the day before).\n3. Risultato: **Marco told me he was going to quit his job the following month.**\n\nProva con un verbo di riporto: *Marco announced he was going to quit…* oppure *Marco said he was quitting.*\n\nControllo: ogni pronome e riferimento temporale deve avere senso dal punto di vista di chi riporta.' },

      { h: 'Il passivo', b: 'Forma: **be (nel tempo giusto) + participio passato**.\n\n- present simple: {{en-GB|English is spoken here.}}\n- past simple: {{en-GB|The bridge was built in 1890.}}\n- present perfect: {{en-GB|The report has been finished.}}\n- future: {{en-GB|It will be delivered tomorrow.}}\n- con modale: {{en-GB|It must be done today.}}\n\nUsa il passivo quando l’agente è sconosciuto, ovvio o irrilevante: {{en-GB|My bike was stolen.}} Per indicare l’agente: **by**.\n\nStruttura utile: **have something done** = far fare qualcosa a un altro: {{en-GB|I had my hair cut.}} {{en-GB|She’s having the car repaired.}}' },
      { h: 'Frasi relative', b: '**Pronomi**:\n- persone: **who** (o that)\n- cose: **which** (o that)\n- possesso: **whose**\n- luogo: **where**; tempo: **when**\n\n**Definenti** (identificano il nome, niente virgole, that possibile):\n> {{en-GB|The man who lives next door is a doctor.}}\n> {{en-GB|This is the book that I told you about.}}\n\n**Non definenti** (aggiungono un’informazione extra, tra virgole, NO that):\n> {{en-GB|My sister, who lives in Milan, works for a bank.}}\n\nNelle definenti il pronome si può omettere se è **oggetto**: {{en-GB|The book I told you about.}} Non si omette se è soggetto.' },

      { h: 'Contrasto', b: 'Attenzione alla grammatica che segue ogni connettore:\n\n- **but / however**: {{en-GB|It was cheap. However, the quality was poor.}}\n- **although / even though** + frase: {{en-GB|Although it was cheap, the quality was poor.}}\n- **despite / in spite of** + nome o -ing: {{en-GB|Despite the rain, we went out.}} / {{en-GB|In spite of being tired…}}\n- **whereas / while**: confronto tra due fatti: {{en-GB|My brother likes sport, whereas I prefer books.}}\n\nNon dire *Despite of* o *although of*.' },
      { h: 'Causa, risultato, aggiunta', b: '**Causa**: because + frase; because of / due to + nome; since / as.\n> {{en-GB|We stayed home because of the storm.}}\n\n**Risultato**: so, therefore, as a result, consequently.\n> {{en-GB|Prices rose. As a result, fewer people bought cars.}}\n\n**Aggiunta**: and, also, in addition, moreover, besides.\n\n**Esempio/riformulazione**: for example, for instance, in other words, that is.\n\n**Conclusione**: to sum up, in conclusion, overall.' },
      { h: 'Strutturare un’opinione', b: 'Una struttura semplice e robusta (adatta a prove B2):\n\n1. **Posizione**: {{en-GB|In my opinion, remote work is a good thing.}}\n2. **Ragione 1 + esempio**: *First, it saves commuting time. For example, I gain two hours a day.*\n3. **Ragione 2**: *Moreover, it can improve concentration.*\n4. **Controargomento**: *Admittedly, some people feel isolated; however, this can be solved by meeting colleagues occasionally.*\n5. **Conclusione**: *Overall, the benefits outweigh the drawbacks.*\n\nFormule per introdurre opinioni: I believe, It seems to me that, As far as I’m concerned, From my point of view.' },
      { h: 'Accordo e disaccordo', b: 'Nel parlato spontaneo il disaccordo diretto («No, you’re wrong») è brusco. Alternative:\n\n- Accordo: {{en-GB|I totally agree.}} / {{en-GB|That’s a good point.}} / {{en-GB|Exactly.}}\n- Accordo parziale: {{en-GB|I see what you mean, but…}} / {{en-GB|That’s true up to a point.}}\n- Disaccordo cortese: {{en-GB|I’m not sure I agree.}} / {{en-GB|I’d say the opposite, actually.}}\n- Chiedere chiarimenti: {{en-GB|Could you give an example?}}\n\nLa differenza tra neutro e brusco spesso sta nel tono e nei *softeners* (actually, I’m afraid, I think).' },
      { h: 'Esempio guidato', b: 'Trasforma queste idee in un testo collegato: *Cars are convenient. They pollute. Many people use them.*\n\n→ **Although cars are convenient, they pollute the environment. As a result, many cities are encouraging public transport. In my opinion, we should reduce car use, even though this will take time.**\n\nAnalisi: *although* + frase; *as a result* collega causa-effetto; *even though* rafforza il contrasto.\n\nControllo: leggi ad alta voce. Se ogni frase sembra scollegata, manca un connettore.' },
      { h: 'Errori comuni', b: '- *Despite it was raining* → {{en-GB|Despite the rain / Although it was raining.}}\n- *In spite of he was tired* → {{en-GB|In spite of being tired / Although he was tired.}}\n- *Because of he left* → {{en-GB|Because he left / because of his departure.}}\n- Usare *but* e *although* insieme nella stessa frase.\n- Mettere *however* in mezzo a una frase senza punteggiatura: {{en-GB|It was cheap; however, it was poor.}}' },
      { h: 'Riepilogo', b: '- although + frase; despite + nome/-ing; however = nuova frase.\n- because + frase; because of + nome.\n- as a result / therefore per le conseguenze.\n- Opinione: posizione → ragioni + esempi → controargomento → conclusione.' }

  C.addTopic({

    summary: 'Past simple, past continuous, past perfect, used to / would.',
    objectives: ['Costruire un racconto con sequenza e sfondo', 'Usare past perfect per anteriorità', 'Distinguere used to e would per abitudini passate'],
    pages: [
