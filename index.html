<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Bubu & Dudu Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0518;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=800,H=600,LAPS=3,TW=88,KR=14;

// ── TRACK (Catmull-Rom) ────────────────────────────────
const CTRL=[
  {x:400,y:548},{x:548,y:544},{x:655,y:508},
  {x:725,y:438},{x:748,y:350},{x:720,y:260},
  {x:648,y:186},{x:546,y:144},{x:426,y:134},
  {x:306,y:144},{x:200,y:188},{x:122,y:270},
  {x:102,y:368},{x:146,y:470},{x:256,y:536},
];
function cmr(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return{
    x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
    y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
  };
}
const TP=[],TL=[];
function buildTrack(){
  const n=CTRL.length,S=16;
  for(let i=0;i<n;i++){
    const p0=CTRL[(i-1+n)%n],p1=CTRL[i],p2=CTRL[(i+1)%n],p3=CTRL[(i+2)%n];
    for(let j=0;j<S;j++) TP.push(cmr(p0,p1,p2,p3,j/S));
  }
  TL.push(0);
  for(let i=1;i<TP.length;i++){
    const dx=TP[i].x-TP[i-1].x,dy=TP[i].y-TP[i-1].y;
    TL.push(TL[i-1]+Math.hypot(dx,dy));
  }
}
function nearTP(x,y){
  let best=Infinity,bi=0;
  for(let i=0;i<TP.length;i++){const dx=x-TP[i].x,dy=y-TP[i].y,d=dx*dx+dy*dy;if(d<best){best=d;bi=i;}}
  return{dist:Math.sqrt(best),idx:bi,prog:TL[bi]/TL[TL.length-1]};
}
function tdir(i){const n=TP.length,a=TP[(i+1)%n],b=TP[i];return Math.atan2(a.y-b.y,a.x-b.x);}

// ── INPUT ─────────────────────────────────────────────
const K={};
window.addEventListener('keydown',e=>{K[e.code]=true;e.preventDefault();},{passive:false});
window.addEventListener('keyup',e=>{K[e.code]=false;});
let _eL=false,_eR=false,_eE=false;
function edgeL(){const v=K['ArrowLeft']||K['KeyA'];const e=v&&!_eL;_eL=v;return e;}
function edgeR(){const v=K['ArrowRight']||K['KeyD'];const e=v&&!_eR;_eR=v;return e;}
function edgeE(){const v=K['Enter']||K['NumpadEnter'];const e=v&&!_eE;_eE=v;return e;}

// ── SFX ───────────────────────────────────────────────
let AC=null;
function sfx(t){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    const n=AC.currentTime;
    if(t==='boost'){o.frequency.setValueAtTime(440,n);o.frequency.exponentialRampToValueAtTime(880,n+.2);g.gain.setValueAtTime(.18,n);g.gain.linearRampToValueAtTime(0,n+.3);}
    else if(t==='hit'){o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(60,n+.35);g.gain.setValueAtTime(.25,n);g.gain.linearRampToValueAtTime(0,n+.45);}
    else if(t==='item'){o.frequency.setValueAtTime(550,n);o.frequency.exponentialRampToValueAtTime(880,n+.12);g.gain.setValueAtTime(.14,n);g.gain.linearRampToValueAtTime(0,n+.22);}
    else if(t==='lap'){o.type='square';o.frequency.setValueAtTime(660,n);o.frequency.setValueAtTime(990,n+.12);g.gain.setValueAtTime(.14,n);g.gain.linearRampToValueAtTime(0,n+.35);}
    else if(t==='throw'){o.frequency.setValueAtTime(280,n);g.gain.setValueAtTime(.1,n);g.gain.linearRampToValueAtTime(0,n+.18);}
    o.start(n);o.stop(n+.6);
  }catch(e){}
}

// ── CHARACTER HEADS ───────────────────────────────────
function drawHead(ck){
  if(ck==='dudu'){
    ctx.fillStyle='#7B3A0E';
    ctx.beginPath();ctx.arc(-7,-9,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(7,-9,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#C4703A';
    ctx.beginPath();ctx.arc(-7,-9,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(7,-9,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#C8814A';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,140,80,.55)';
    ctx.beginPath();ctx.arc(-6,3.5,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6,3.5,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-3.5,-1,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(3.5,-1,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-2.3,-2.2,1.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.7,-2.2,1.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#E09060';ctx.beginPath();ctx.ellipse(0,4,5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5A2A0A';ctx.beginPath();ctx.ellipse(0,2.5,2.5,1.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF8888';ctx.beginPath();ctx.ellipse(0,7,2.2,2,0,0,Math.PI);ctx.fill();
  } else if(ck==='bubu'){
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-7,-9,6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(7,-9,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#F5F5F5';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';
    ctx.save();ctx.translate(-4,-1);ctx.rotate(-.35);ctx.beginPath();ctx.ellipse(0,0,4.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(4,-1);ctx.rotate(.35);ctx.beginPath();ctx.ellipse(0,0,4.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-4,-1,2.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4,-1,2.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-4,-1,1.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4,-1,1.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-3.2,-1.8,.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.8,-1.8,.8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,180,180,.55)';
    ctx.beginPath();ctx.arc(-6.5,3,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6.5,3,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#F8F0F0';ctx.beginPath();ctx.ellipse(0,4.5,5,3.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#DD8888';ctx.beginPath();ctx.ellipse(0,3,2,1.5,0,0,Math.PI*2);ctx.fill();
  } else if(ck==='ai1'){
    ctx.fillStyle='#CC5500';ctx.beginPath();ctx.arc(-6,-8,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6,-8,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF7722';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';[-3,0,3].forEach(x=>{ctx.fillRect(x-1,-10,2,6);});
    ctx.fillStyle='#FFCC88';ctx.beginPath();ctx.ellipse(0,4,5,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-3.5,-1,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(3.5,-1,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-2.3,-2,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.7,-2,1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(0,2,2,1.5,0,0,Math.PI*2);ctx.fill();
  } else if(ck==='ai2'){
    ctx.fillStyle='#1A7A1A';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#22CC22';ctx.beginPath();ctx.ellipse(0,5,7,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFFF44';ctx.beginPath();ctx.arc(-4.5,-6,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.5,-6,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-4.5,-6,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.5,-6,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';[-3,-1,1,3].forEach(x=>{ctx.beginPath();ctx.moveTo(x,8);ctx.lineTo(x-1,5);ctx.lineTo(x+1,5);ctx.closePath();ctx.fill();});
  } else {
    ctx.fillStyle='#BB44BB';
    ctx.beginPath();ctx.ellipse(-5,-16,3,7,-.15,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(5,-16,3,7,.15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF88BB';
    ctx.beginPath();ctx.ellipse(-5,-16,1.5,4.5,-.15,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(5,-16,1.5,4.5,.15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#EE88EE';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-3.5,-1,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(3.5,-1,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-2.3,-2,1.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.7,-2,1.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,180,200,.5)';ctx.beginPath();ctx.arc(-6,3,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6,3,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF88CC';ctx.beginPath();ctx.ellipse(0,2.5,2,1.5,0,0,Math.PI*2);ctx.fill();
  }
}

// ── KART ──────────────────────────────────────────────
const CFGS={
  dudu:{name:'Dudu',   kc:'#C8A84B',ka:'#8B6914',spd:5.0,acc:.055,trn:.038},
  bubu:{name:'Bubu',   kc:'#EEEEEE',ka:'#111111',spd:4.7,acc:.062,trn:.044},
  ai1: {name:'Tigro',  kc:'#FF6600',ka:'#993300',spd:4.8,acc:.058,trn:.041},
  ai2: {name:'Cocco',  kc:'#22AA22',ka:'#115511',spd:4.5,acc:.052,trn:.039},
  ai3: {name:'Stella', kc:'#DD88DD',ka:'#882288',spd:4.9,acc:.060,trn:.043},
};

class Kart{
  constructor(ck,x,y,angle,isP){
    this.ck=ck;this.cfg=CFGS[ck];
    this.x=x;this.y=y;this.angle=angle;this.speed=0;this.isP=isP;
    this.drifting=false;this.driftDir=0;this.driftCharge=0;
    this.boostTimer=0;this.spinTimer=0;this.item=null;this.wumpa=0;
    this.lap=0;this.cp=0;this.prog=0;this._pp=0;
    this.finished=false;this.onTrack=true;
    this.aiT=0;this.aiIT=Math.random()*6;this._ud=false;
  }
  get total(){return this.lap+this.prog;}

  update(dt){
    if(this.finished)return;
    const ms=this.cfg.spd*(this.boostTimer>0?1.45:1)*(this.onTrack?1:.55);
    if(this.spinTimer>0){this.spinTimer-=dt;this.angle+=5*dt;this.speed*=.92;}
    else if(this.isP)this._pCtrl(dt,ms);
    else this._aCtrl(dt,ms);
    if(this.boostTimer>0)this.boostTimer-=dt;
    this.speed*=this.onTrack?(this.drifting?.962:.970):.86;
    if(Math.abs(this.speed)<.02)this.speed=0;
    let vx=Math.cos(this.angle)*this.speed,vy=Math.sin(this.angle)*this.speed;
    if(this.drifting){
      const sa=this.angle+this.driftDir*Math.PI/2;
      vx+=Math.cos(sa)*this.speed*.18;vy+=Math.sin(sa)*this.speed*.18;
      this.driftCharge=Math.min(1,this.driftCharge+dt*.65);
    }
    this.x=Math.max(8,Math.min(W-8,this.x+vx));
    this.y=Math.max(8,Math.min(H-8,this.y+vy));
    const tp=nearTP(this.x,this.y);
    this.onTrack=tp.dist<TW/2;
    this._pp=this.prog;this.prog=tp.prog;
    if(this._pp>.85&&this.prog<.15&&this.cp>=1){
      this.lap++;this.cp=0;
      if(this.isP)sfx('lap');
      if(this.lap>=LAPS&&!this.finished)this.finished=true;
    }
    if(this.prog>.4&&this.prog<.6)this.cp=1;
  }

  _pCtrl(dt,ms){
    const up=K['ArrowUp']||K['KeyW'],dn=K['ArrowDown']||K['KeyS'];
    const lt=K['ArrowLeft']||K['KeyA'],rt=K['ArrowRight']||K['KeyD'];
    const dr=K['ShiftLeft']||K['ShiftRight']||K['KeyZ'];
    const use=K['KeyX']||K['ControlLeft'];
    if(up)this.speed=Math.min(ms,this.speed+this.cfg.acc);
    if(dn)this.speed=Math.max(-ms*.35,this.speed-this.cfg.acc*.65);
    if(this.speed!==0){
      const d=this.speed>0?1:-1;
      if(lt)this.angle-=this.cfg.trn*d*(this.drifting?1.3:1);
      if(rt)this.angle+=this.cfg.trn*d*(this.drifting?1.3:1);
    }
    if(dr&&(lt||rt)&&this.speed>1.5){
      if(!this.drifting){this.drifting=true;this.driftDir=lt?1:-1;}
    }else if(this.drifting&&!dr){
      if(this.driftCharge>.3){this.boostTimer=this.driftCharge*1.4;sfx('boost');}
      this.drifting=false;this.driftCharge=0;this.driftDir=0;
    }
    if(use&&!this._ud){this._ud=true;this._fire();}
    if(!use)this._ud=false;
  }

  _aCtrl(dt,ms){
    const n=TP.length,tgt=TP[this.aiT%n];
    const dx=tgt.x-this.x,dy=tgt.y-this.y;
    if(Math.hypot(dx,dy)<35)this.aiT=(this.aiT+4)%n;
    let diff=Math.atan2(dy,dx)-this.angle;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    this.angle+=Math.sign(diff)*Math.min(this.cfg.trn,Math.abs(diff));
    this.speed=Math.min(ms*.9,this.speed+this.cfg.acc*.88);
    this.aiIT-=dt;
    if(this.aiIT<0&&this.item){this._fire();this.aiIT=5+Math.random()*7;}
  }

  _fire(){
    if(!this.item)return;
    if(this.item==='boost'){this.boostTimer=2.5;sfx('boost');}
    else if(this.item==='bomb'){projs.push(new Bomb(this.x,this.y,this.angle,this));sfx('throw');}
    this.item=null;
  }

  pickItem(){
    const pool=['boost','boost','bomb'];
    this.item=pool[Math.floor(Math.random()*pool.length)];
    this.wumpa=Math.min(10,this.wumpa+3);sfx('item');
  }

  hit(){this.spinTimer=1.6;this.speed*=.25;this.wumpa=Math.max(0,this.wumpa-4);sfx('hit');}

  draw(){
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);
    if(this.boostTimer>0){
      ctx.save();ctx.globalAlpha=.5;
      ['#FF4500','#FF8C00','#FFD700'].forEach((c,i)=>{
        ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(-14-i*7,0,5,3,0,0,Math.PI*2);ctx.fill();
      });ctx.restore();
    }
    if(this.drifting&&this.speed>1){
      ctx.save();const c=this.driftCharge;
      ctx.fillStyle=c>.6?'#FF0000':c>.3?'#FF8C00':'#FFD700';
      for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-8+Math.random()*4-12*this.driftDir,8+Math.random()*6,2,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    if(this.spinTimer>0)ctx.rotate(this.spinTimer*2);
    ctx.fillStyle='#1a1a1a';
    [[-11,-13],[11,-13],[-11,13],[11,13]].forEach(([wx,wy])=>{
      ctx.save();ctx.translate(wx,wy);ctx.fillRect(-4,-3,8,6);ctx.restore();
    });
    ctx.fillStyle=this.cfg.kc;ctx.strokeStyle=this.cfg.ka;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-15,-11,30,22,5);ctx.fill();ctx.stroke();
    ctx.fillStyle=this.cfg.ka;ctx.beginPath();ctx.roundRect(10,-8,8,16,3);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(0,-1,7,5,0,0,Math.PI*2);ctx.fill();
    if(this.ck==='dudu'){
      ctx.fillStyle='#C8A84B';ctx.beginPath();ctx.ellipse(-8,4,4,3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#8B6914';ctx.beginPath();ctx.ellipse(-8,2,4,1.2,0,0,Math.PI*2);ctx.fill();
    }else if(this.ck==='bubu'){
      ctx.fillStyle='#FFF';ctx.beginPath();ctx.ellipse(13,0,4,5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(12,-2,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(14,2,1.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#228B22';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-12,-12);ctx.lineTo(-10,12);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-7,-14);ctx.lineTo(-5,14);ctx.stroke();
    }
    ctx.save();ctx.translate(2,-14);drawHead(this.ck);ctx.restore();
    ctx.restore();
  }
}

// ── BOMB ──────────────────────────────────────────────
class Bomb{
  constructor(x,y,a,owner){
    this.x=x+Math.cos(a)*22;this.y=y+Math.sin(a)*22;
    this.vx=Math.cos(a)*8;this.vy=Math.sin(a)*8;
    this.owner=owner;this.r=8;this.life=2.5;this.active=true;
  }
  update(dt){
    this.x+=this.vx;this.y+=this.vy;this.life-=dt;
    if(this.life<0||this.x<0||this.x>W||this.y<0||this.y>H)this.active=false;
  }
  draw(){
    ctx.save();
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#888';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(this.x,this.y-this.r);ctx.quadraticCurveTo(this.x+5,this.y-this.r-5,this.x+4,this.y-this.r-3);ctx.stroke();
    ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(this.x+4,this.y-this.r-3,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ── ITEM BOX ──────────────────────────────────────────
class IBox{
  constructor(x,y){this.x=x;this.y=y;this.active=true;this.resp=0;this.rot=0;}
  update(dt){
    this.rot+=dt*2.2;
    if(!this.active){this.resp-=dt;if(this.resp<0)this.active=true;}
  }
  tryGet(k){
    if(!this.active)return;
    if(Math.hypot(k.x-this.x,k.y-this.y)<22){this.active=false;this.resp=9;k.pickItem();}
  }
  draw(){
    if(!this.active)return;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    const s=13,g=ctx.createLinearGradient(-s,-s,s,s);
    g.addColorStop(0,'#FFD700');g.addColorStop(.5,'#FF8C00');g.addColorStop(1,'#FFD700');
    ctx.fillStyle=g;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;
    ctx.fillRect(-s,-s,s*2,s*2);ctx.strokeRect(-s,-s,s*2,s*2);
    ctx.fillStyle='#FFF';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('?',0,1);ctx.restore();
  }
}

// ── PALMS & SCENERY ───────────────────────────────────
const PALMS=[{x:750,y:290},{x:720,y:128},{x:426,y:88},{x:98,y:162},{x:60,y:375},{x:195,y:555}];
function drawPalm(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle='#8B5E3C';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(5,-25,0,-50);ctx.stroke();
  ctx.fillStyle='#228B22';
  [0,60,120,180,240,300].forEach(a=>{
    ctx.save();ctx.translate(0,-50);ctx.rotate(a*Math.PI/180);
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(14,-8,26,-4);ctx.quadraticCurveTo(14,2,0,0);ctx.fill();ctx.restore();
  });
  ctx.fillStyle='#8B4513';ctx.beginPath();ctx.arc(-2,-48,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-50,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── TRACK RENDER ──────────────────────────────────────
function drawTrack(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#4AADDD');bg.addColorStop(.32,'#88CCEE');
  bg.addColorStop(.33,'#C8A060');bg.addColorStop(1,'#B89050');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(26,120,200,.55)';ctx.fillRect(0,0,W,210);
  ctx.fillStyle='rgba(160,120,60,.22)';
  for(let x=0;x<W;x+=22)for(let y=195;y<H;y+=22)ctx.fillRect(x+(Math.sin(x*.11+y*.07)*3|0),y,3,3);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();TP.forEach((p,i)=>{i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.closePath();
  ctx.lineWidth=TW+10;ctx.strokeStyle='rgba(0,0,0,.32)';ctx.stroke();
  ctx.lineWidth=TW;ctx.strokeStyle='#4A4A4A';ctx.stroke();
  ctx.lineWidth=TW-4;ctx.strokeStyle='#555';ctx.stroke();
  ctx.setLineDash([16,16]);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.38)';ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();
  ctx.restore();
  const p0=TP[0],d0=tdir(0);
  ctx.save();ctx.translate(p0.x,p0.y);ctx.rotate(d0+Math.PI/2);
  for(let i=0;i<4;i++)for(let j=0;j<3;j++){
    ctx.fillStyle=(i+j)%2===0?'#FFF':'#111';ctx.fillRect(i*11-22,j*7-10,11,7);
  }ctx.restore();
  PALMS.forEach(p=>drawPalm(p.x,p.y));
}

// ── HUD ───────────────────────────────────────────────
function drawHUD(){
  const k=player;
  const pos=[...karts].sort((a,b)=>b.total-a.total).findIndex(x=>x.isP)+1;
  const suf=['st','nd','rd','th'];
  ctx.fillStyle='rgba(20,10,0,.78)';ctx.beginPath();ctx.roundRect(8,8,195,60,10);ctx.fill();
  ctx.fillStyle='#FF8C00';ctx.beginPath();ctx.arc(30,26,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FF4500';ctx.beginPath();ctx.arc(30,26,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1A6A1A';ctx.fillRect(27,15,6,8);
  ctx.fillStyle='#FFD700';ctx.font='bold 19px "Arial Black",Arial';ctx.textAlign='left';
  ctx.fillText(k.wumpa+'/10',48,32);
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='11px Arial';ctx.fillText('LAP',18,56);
  ctx.fillStyle='#FF8C00';ctx.font='bold 18px "Arial Black",Arial';
  ctx.fillText(Math.min(k.lap+1,LAPS)+' / '+LAPS,42,58);
  ctx.fillStyle='rgba(20,10,0,.78)';ctx.beginPath();ctx.roundRect(W/2-65,8,130,60,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='11px Arial';ctx.textAlign='center';
  ctx.fillText('POSIZIONE',W/2,26);
  ctx.fillStyle='#FFD700';ctx.font='bold 30px "Arial Black",Arial';
  ctx.fillText((pos+(suf[Math.min(pos-1,3)])).toUpperCase(),W/2,57);
  ctx.fillStyle='rgba(20,10,0,.78)';ctx.beginPath();ctx.roundRect(W-120,8,112,60,10);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='11px Arial';ctx.textAlign='center';
  ctx.fillText('OGGETTO',W-64,26);
  if(k.item){
    ctx.fillStyle='#FFD700';ctx.font='bold 13px Arial';
    ctx.fillText(k.item==='boost'?'TURBO':'BOMBA',W-64,52);
  }else{
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='14px Arial';ctx.fillText('- - -',W-64,52);
  }
  if(k.drifting){
    const bx=W/2-70,by=H-30,bw=140,bh=14;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    const c=k.driftCharge,bc=c>.6?'#FF2222':c>.3?'#FF8C00':'#FFD700';
    ctx.fillStyle=bc;ctx.fillRect(bx,by,bw*c,bh);
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#FFF';ctx.font='bold 10px Arial';ctx.textAlign='center';
    ctx.fillText('TURBO DRIFT',W/2,by+11);
  }
  const mx=10,my=H-92,mw=94,mh=76;
  ctx.fillStyle='rgba(15,8,0,.78)';ctx.beginPath();ctx.roundRect(mx,my,mw,mh,8);ctx.fill();
  const mnX=80,mxX=768,mnY=100,mxY=575;
  function mm(x,y){return{x:mx+(x-mnX)/(mxX-mnX)*mw,y:my+(y-mnY)/(mxY-mnY)*mh};}
  ctx.lineWidth=4;ctx.strokeStyle='rgba(110,110,110,.85)';
  ctx.beginPath();TP.forEach((p,i)=>{const m=mm(p.x,p.y);i===0?ctx.moveTo(m.x,m.y):ctx.lineTo(m.x,m.y);});
  ctx.closePath();ctx.stroke();
  karts.forEach(kk=>{
    const m=mm(kk.x,kk.y);
    ctx.fillStyle=kk.isP?'#FFD700':kk.cfg.kc;
    ctx.beginPath();ctx.arc(m.x,m.y,kk.isP?4:2.5,0,Math.PI*2);ctx.fill();
    if(kk.isP){ctx.strokeStyle='#FFF';ctx.lineWidth=1;ctx.stroke();}
  });
  if(cdt<8){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(W/2-195,H-42,390,34,8);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='12px Arial';ctx.textAlign='center';
    ctx.fillText('Frecce = Guida  |  Z + Sterza = Drift  |  X = Usa oggetto',W/2,H-20);
  }
}

function drawCountdown(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const n=Math.ceil(4-cdt);
  if(cdt<3){
    ctx.font='bold 110px "Arial Black",Arial';
    ctx.fillStyle='#FF8C00';ctx.shadowColor='#FF4500';ctx.shadowBlur=35;
    ctx.fillText(n,W/2,H/2);
  }else{
    const sc=1+(cdt-3)*.6;
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-W/2,-H/2);
    ctx.font='bold 86px "Arial Black",Arial';
    ctx.fillStyle='#00FF55';ctx.shadowColor='#00FF55';ctx.shadowBlur=30;
    ctx.fillText('VAI!',W/2,H/2);ctx.restore();
  }
  ctx.restore();
}

// ── PREVIEW KART ──────────────────────────────────────
function drawPreview(ck,sc){
  const cfg=CFGS[ck];
  ctx.save();ctx.scale(sc,sc);
  ctx.fillStyle='#1a1a1a';
  [[-11,-13],[11,-13],[-11,13],[11,13]].forEach(([wx,wy])=>{ctx.save();ctx.translate(wx,wy);ctx.fillRect(-4,-3,8,6);ctx.restore();});
  ctx.fillStyle=cfg.kc;ctx.strokeStyle=cfg.ka;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(-15,-11,30,22,5);ctx.fill();ctx.stroke();
  ctx.fillStyle=cfg.ka;ctx.beginPath();ctx.roundRect(10,-8,8,16,3);ctx.fill();
  if(ck==='dudu'){ctx.fillStyle='#C8A84B';ctx.beginPath();ctx.ellipse(-8,4,4,3,0,0,Math.PI*2);ctx.fill();}
  else if(ck==='bubu'){
    ctx.strokeStyle='#228B22';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-12,-12);ctx.lineTo(-10,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-7,-14);ctx.lineTo(-5,14);ctx.stroke();
  }
  ctx.save();ctx.translate(2,-14);drawHead(ck);ctx.restore();
  ctx.restore();
}

// ── SCREENS ───────────────────────────────────────────
function drawMenu(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0a3e');bg.addColorStop(1,'#0a0520');

  for(let i=0;i<80;i++){
    const sx=(Math.sin(i*137.5)*W+W)/2,sy=(Math.cos(i*97.1)*200+200)/2;
    ctx.fillStyle='rgba(255,255,255,'+((.3+.7*Math.abs(Math.sin(Date.now()*.001+i))).toFixed(2))+')';
    ctx.beginPath();ctx.arc(sx,sy,Math.abs(Math.sin(i))*.9+.4,0,Math.PI*2);ctx.fill();
  }
  ctx.textAlign='center';
  ctx.font='bold 62px "Arial Black",Arial';
  const tg=ctx.createLinearGradient(0,70,0,175);
  tg.addColorStop(0,'#FFD700');tg.addColorStop(.5,'#FF8C00');tg.addColorStop(1,'#FF4500');
  ctx.fillStyle=tg;ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=16;
  ctx.fillText('CRASH TEAM',W/2,115);ctx.fillText('RACING',W/2,185);ctx.shadowBlur=0;
  ctx.font='italic 20px Arial';ctx.fillStyle='#FFD700';ctx.fillText('Bubu & Dudu Edition',W/2,220);
  ctx.save();ctx.translate(205,390);drawPreview('bubu',2.0);ctx.restore();
  ctx.save();ctx.translate(595,390);drawPreview('dudu',2.0);ctx.restore();
  ctx.font='bold 17px Arial';ctx.fillStyle='#FFF';ctx.textAlign='center';

  ctx.font='13px Arial';ctx.fillStyle='rgba(255,255,255,.55)';

  ctx.fillStyle=b2;ctx.shadowColor='#FF8C00';ctx.shadowBlur=18;

function drawSelect(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a2060');bg.addColorStop(1,'#7B5510');

  });
  ctx.font='bold 42px Arial';ctx.fillStyle='rgba(255,215,0,.75)';ctx.textAlign='center';
  ctx.fillText('<',110,330);ctx.fillText('>',690,330);
  ctx.font='14px Arial';ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText('< > per scegliere   |   INVIO per partire',W/2,548);
}

function drawFinish(){
  ctx.fillStyle='rgba(0,0,18,.94)';ctx.fillRect(0,0,W,H);
  for(let i=0;i<55;i++){
    const sx=(Math.sin(i*137.5)*W+W)/2,sy=(Math.cos(i*97.1)*H+H)/2;
    ctx.fillStyle='rgba(255,215,0,'+(Math.abs(Math.sin(Date.now()*.001+i))*.6).toFixed(2)+')';
    ctx.beginPath();ctx.arc(sx,sy,1,0,Math.PI*2);ctx.fill();
  }
  ctx.textAlign='center';
  const tg=ctx.createLinearGradient(0,80,0,155);
  tg.addColorStop(0,'#FFD700');tg.addColorStop(1,'#FF8C00');
  ctx.font='bold 58px "Arial Black",Arial';ctx.fillStyle=tg;
  ctx.shadowColor='#FF8C00';ctx.shadowBlur=20;ctx.fillText('GARA FINITA!',W/2,135);ctx.shadowBlur=0;
  ctx.font='22px Arial';ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('Classifica Finale',W/2,178);
  const m=['1°','2°','3°','4°'];
  finOrder.forEach((kk,i)=>{
    ctx.fillStyle=i===0?'#FFD700':i===1?'#C0C0C0':i===2?'#CD7F32':'rgba(255,255,255,.7)';
    ctx.font='bold '+(i===0?29:22)+'px Arial';
    ctx.fillText(m[i]+' '+kk.cfg.name+(kk.isP?' <- Tu!':''),W/2,232+i*58);
  });
  const b2=ctx.createLinearGradient(W/2-130,H-76,W/2+130,H-26);
  b2.addColorStop(0,'#FF8C00');b2.addColorStop(1,'#FFD700');
  ctx.fillStyle=b2;ctx.beginPath();ctx.roundRect(W/2-140,H-80,280,54,14);ctx.fill();
  ctx.fillStyle='#FFF';ctx.font='bold 21px "Arial Black",Arial';ctx.fillText('RIGIOCA! (INVIO)',W/2,H-47);
}

// ── GLOBALS ───────────────────────────────────────────
let state='menu',karts=[],boxes=[],projs=[],player=null,finOrder=[];
let selIdx=0,cdt=0,raceEnded=false,lastTs=0;

// ── RACE START ────────────────────────────────────────
function startRace(){
  karts=[];projs=[];finOrder=[];raceEnded=false;cdt=0;
  const ck=selIdx===0?'bubu':'dudu';
  const p0=TP[0],d0=tdir(0),perp=d0+Math.PI/2;
  const cp=Math.cos(perp),sp=Math.sin(perp),cd=Math.cos(d0),sd=Math.sin(d0);
  [{s:0,b:0},{s:-24,b:-32},{s:24,b:-32},{s:0,b:-64}].forEach((g,i)=>{
    const x=p0.x+cp*g.s+cd*g.b,y=p0.y+sp*g.s+sd*g.b;
    if(i===0){player=new Kart(ck,x,y,d0,true);karts.push(player);}
    else{const ak='ai'+(i);const kk=new Kart(ak,x,y,d0,false);kk.aiT=(i*30)%TP.length;karts.push(kk);}
  });
  boxes=[];
  [.1,.22,.35,.48,.62,.75,.88].forEach(pct=>{
    const idx=Math.floor(pct*TP.length),p=TP[idx],d=tdir(idx),lp=d+Math.PI/2;
    boxes.push(new IBox(p.x+Math.cos(lp)*22,p.y+Math.sin(lp)*22));
    boxes.push(new IBox(p.x-Math.cos(lp)*22,p.y-Math.sin(lp)*22));
  });
  state='race';
}

// ── RACE UPDATE ───────────────────────────────────────
function updateRace(dt){
  cdt+=dt;
  if(cdt<4)return;
  karts.forEach(k=>k.update(dt));
  boxes.forEach(b=>{b.update(dt);karts.forEach(k=>b.tryGet(k));});
  projs.forEach(bm=>{
    if(!bm.active)return;
    bm.update(dt);
    karts.forEach(k=>{if(k===bm.owner)return;if(Math.hypot(k.x-bm.x,k.y-bm.y)<KR+bm.r){k.hit();bm.active=false;}});
  });
  projs=projs.filter(p=>p.active);
  karts.forEach(k=>{if(k.finished&&!finOrder.includes(k))finOrder.push(k);});
  if(player.finished&&!raceEnded){
    raceEnded=true;
    [...karts].filter(k=>!k.finished).sort((a,b)=>b.total-a.total).forEach(k=>{if(!finOrder.includes(k))finOrder.push(k);});
    setTimeout(()=>{state='finish';},2400);
  }
}

// ── MAIN LOOP ─────────────────────────────────────────
function loop(ts){
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;
  ctx.clearRect(0,0,W,H);
  if(state==='menu'){
    drawMenu();
    if(edgeE())state='select';
  }else if(state==='select'){
    drawSelect();
    if(edgeL()||edgeR())selIdx=(selIdx+1)%2;
    if(edgeE())startRace();
  }else if(state==='race'){
    updateRace(dt);
    drawTrack();
    boxes.forEach(b=>b.draw());
    projs.forEach(b=>b.draw());
    [...karts].sort((a,b)=>a.y-b.y).forEach(k=>k.draw());
    drawHUD();
    if(cdt<4)drawCountdown();
  }else if(state==='finish'){
    drawFinish();
    if(edgeE())state='select';
  }
  requestAnimationFrame(loop);
}

// ── BOOT ──────────────────────────────────────────────
buildTrack();
canvas.addEventListener('click',()=>{
  if(state==='menu')state='select';
  else if(state==='finish')state='select';
});
requestAnimationFrame(ts=>{lastTs=ts;requestAnimationFrame(loop);});
</script>
